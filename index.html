0-16T16:15:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners and advanced","ageFrom":2010,"ageTo":2016,"age":"2010–2016","free":true}]},{"id":30106,"title":"Breakdance","category":"Dance, music & stage","activity":"Dance (various)","ageFrom":2017,"ageTo":2020,"ageLabel":"2017–2020","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"Beginners","details":{"texts":[{"value":"Breakdance is part of hip-hop, combines dance and acrobatic elements and is practised as a competition. Practise basics, top rock and footwork and learn the coolest moves to cool beats.","nrs":["BKD 11"]}],"bring":[{"value":"Sports clothes, sports shoes and a drink","nrs":["BKD 11"]}],"notes":[]},"variants":[{"id":30106,"nr":"BKD 11","venue":28,"price":90,"weekId":"3-1","dates":"5 Oct – 9 Oct 2026","days":"Monday to Friday","time":"09:00–10:30","start":9,"end":10.5,"from":"2026-10-05T09:00:00","to":"2026-10-09T10:30:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners","ageFrom":2017,"ageTo":2020,"age":"2017–2020","free":true}]},{"id":30107,"title":"Breakdance","category":"Dance, music & stage","activity":"Dance (various)","ageFrom":2012,"ageTo":2016,"ageLabel":"2012–2016","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"Beginners","details":{"texts":[{"value":"Breakdance is part of hip-hop, combines dance and acrobatic elements and is practised as a competition. Practise basics, top rock and footwork and learn the coolest moves to cool beats.","nrs":["BKD 12"]}],"bring":[{"value":"Sports clothes, sports shoes and a drink","nrs":["BKD 12"]}],"notes":[]},"variants":[{"id":30107,"nr":"BKD 12","venue":28,"price":90,"weekId":"3-1","dates":"5 Oct – 9 Oct 2026","days":"Monday to Friday","time":"10:30–12:00","start":10.5,"end":12,"from":"2026-10-05T10:30:00","to":"2026-10-09T12:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners","ageFrom":2012,"ageTo":2016,"age":"2012–2016","free":true}]},{"id":30142,"title":"Budo","category":"Martial arts","activity":"Martial arts (various)","ageFrom":2012,"ageTo":2019,"ageLabel":"2012–2019","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"Beginners","details":{"texts":[{"value":"In this course you get to know the Japanese martial arts judo, karate, self-defence/self-assertion, ju-jitsu and kendo. Find out which ones you like best.","nrs":["BUD 21"]}],"bring":[{"value":"Sports clothes (training is done barefoot)","nrs":["BUD 21"]}],"notes":[]},"variants":[{"id":30142,"nr":"BUD 21","venue":29,"price":90,"weekId":"3-2","dates":"12 Oct – 16 Oct 2026","days":"Monday to Friday","time":"09:00–10:30","start":9,"end":10.5,"from":"2026-10-12T09:00:00","to":"2026-10-16T10:30:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners","ageFrom":2012,"ageTo":2019,"age":"2012–2019","free":true}]},{"id":30052,"title":"Capoeira-Camp","category":"Martial arts","activity":"Capoeira","ageFrom":2014,"ageTo":2019,"ageLabel":"2014–2019","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"Beginners and advanced","details":{"texts":[{"value":"Capoeira is a Brazilian martial art that includes acrobatic elements. In this camp you will learn how capoeira is played in the roda (circle) and how to play the right music to go with it. You can also draw and paint.","nrs":["CACA 11"]}],"bring":[{"value":"Tracksuit bottoms and a shirt (capoeira is generally practised barefoot), morning snack, lunch, afternoon snack and a drink.","nrs":["CACA 11"]}],"notes":[{"value":"You will be supervised over lunchtime, but you need to bring your lunch from home.","nrs":["CACA 11"]}]},"variants":[{"id":30052,"nr":"CACA 11","venue":30,"price":300,"weekId":"3-1","dates":"5 Oct – 9 Oct 2026","days":"Monday to Friday","time":"09:00–16:00","start":9,"end":16,"from":"2026-10-05T09:00:00","to":"2026-10-09T16:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners and advanced","ageFrom":2014,"ageTo":2019,"age":"2014–2019","free":true}]},{"id":31445,"title":"Check dis Klima","category":"Nature & adventure","activity":"Nature and adventure","ageFrom":2014,"ageTo":2017,"ageLabel":"2014–2017","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"","details":{"texts":[{"value":"Did you know that trees are natural climate protection machines? They filter CO2 out of the air. But how much CO2 does a beech, an oak or an ash remove per year? And how many trees does it take to fish the CO2 we emit every day back out of the air? \u003cp>\nWe get to the bottom of this and many other burning questions about our climate in the Irchelpark. Along the way we will also experiment together and have time for games. We then enjoy the afternoon in the nearby city forest.\u003cp>Exciting discovery tours await you, led by environmental educators from the Rucksackschule Zürich. Come along and check out your climate!\n\u003cp>\nThis course is supported by the KlimUp funding programme of the City of Zurich and can therefore be offered at a greatly reduced price.","nrs":["FCK 21"]}],"bring":[{"value":"Clothing suited to the weather and sturdy shoes, sun or rain protection, a morning snack and lunch (detailed information will follow after registration), a drinking bottle filled with water (at least 1.5 litres).","nrs":["FCK 21"]}],"notes":[{"value":"Meeting point: at the Irchelpark entrance above the tram stop \"Zürich, Milchbuck\"","nrs":["FCK 21"]}]},"variants":[{"id":31445,"nr":"FCK 21","venue":31,"price":70,"weekId":"3-2","dates":"13 Oct – 15 Oct 2026","days":"Tuesday to Thursday","time":"09:00–16:00","start":9,"end":16,"from":"2026-10-13T09:00:00","to":"2026-10-15T16:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"","ageFrom":2014,"ageTo":2017,"age":"2014–2017","free":true}]},{"id":30078,"title":"Cheer- und Showdance für Mädchen","category":"Dance, music & stage","activity":"Dance (various)","ageFrom":2012,"ageTo":2016,"ageLabel":"2012–2016","mixedAges":false,"mixedLevels":false,"gender":"Girls only","level":"Beginners","details":{"texts":[{"value":"Let the Swiss champions in cheer dance show you the trendy moves. In the USA, cheer and show dance teams with their cheerleaders are an important part of the glamorous shows around sporting events. This athletic dance style with elements of jazz, hip hop, funk and classical ballet has long been popular here too. Learn choreographies to current hits and dance with the pompoms typical of cheer dance.","nrs":["CHES 21"]}],"bring":[{"value":"Sports clothing, gym slippers, lunch, drinks","nrs":["CHES 21"]}],"notes":[{"value":"You will be supervised over lunchtime, but you need to bring your lunch from home.","nrs":["CHES 21"]}]},"variants":[{"id":30078,"nr":"CHES 21","venue":32,"price":230,"weekId":"3-2","dates":"12 Oct – 16 Oct 2026","days":"Monday to Friday","time":"10:00–15:00","start":10,"end":15,"from":"2026-10-12T10:00:00","to":"2026-10-16T15:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners","ageFrom":2012,"ageTo":2016,"age":"2012–2016","free":true}]},{"id":30631,"title":"Circus Balloni - Zirkus selber erleben","category":"Dance, music & stage","activity":"Theatre and dance","ageFrom":2014,"ageTo":2019,"ageLabel":"2014–2019","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"","details":{"texts":[{"value":"Wanted: circus artists! Have you always wanted to be a clown, juggler, strongman, acrobat, magician or fakir? All this and much more awaits you in this circus week. For a whole week you will train together with the artist team from Circus Balloni. At the end you will surprise your parents, relatives and friends with a complete circus show. \u003cp>\nOn Friday the course does not start until 13:30 (dress rehearsal). The closing performance then takes place at 18:00.","nrs":["FCB 11"]}],"bring":[{"value":"Food for the whole day, enough to drink, sportswear, gym or indoor shoes, possibly rain protection","nrs":["FCB 11"]}],"notes":[{"value":"Please note: on Friday the course does not start until 13:30 (dress rehearsal).\nAt 18:00 there will then be a closing performance for parents and friends.","nrs":["FCB 11"]}]},"variants":[{"id":30631,"nr":"FCB 11","venue":33,"price":190,"weekId":"3-1","dates":"5 Oct – 9 Oct 2026","days":"Monday to Friday","time":"10:00–16:00","start":10,"end":16,"from":"2026-10-05T10:00:00","to":"2026-10-09T16:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"","ageFrom":2014,"ageTo":2019,"age":"2014–2019","free":true}]},{"id":31111,"title":"Code Camp: baue dein eigenes Game!","category":"Tech & crafts","activity":"Science and technology","ageFrom":2014,"ageTo":2018,"ageLabel":"2014–2018","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"Beginners","details":{"texts":[{"value":"Code Camp World takes you on a playful journey through drag & drop programming. \n\u003cbr>Thousands of children worldwide have already attended Code Camps with enthusiasm and programmed their own computer game under expert guidance. After the course you can keep developing the game at home at any time.","nrs":["FCC 11","FCC 21"]}],"bring":[{"value":"Drinks and food for the whole day","nrs":["FCC 11","FCC 21"]}],"notes":[{"value":"The course runs from 09:00-16:00, but children can be dropped off as early as 08:30 in the morning and picked up until 16:30 in the evening.","nrs":["FCC 11","FCC 21"]}]},"variants":[{"id":31111,"nr":"FCC 11","venue":34,"price":380,"weekId":"3-1","dates":"5 Oct – 7 Oct 2026","days":"Monday to Wednesday","time":"09:00–16:00","start":9,"end":16,"from":"2026-10-05T09:00:00","to":"2026-10-07T16:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners","ageFrom":2014,"ageTo":2018,"age":"2014–2018","free":true},{"id":31118,"nr":"FCC 21","venue":35,"price":380,"weekId":"3-2","dates":"14 Oct – 16 Oct 2026","days":"Wednesday to Friday","time":"09:00–16:00","start":9,"end":16,"from":"2026-10-14T09:00:00","to":"2026-10-16T16:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners","ageFrom":2014,"ageTo":2018,"age":"2014–2018","free":true}]},{"id":30958,"title":"Coding and Electronic Art/ Programmieren und Elektronische Kunst","category":"Tech & crafts","activity":"Science and technology","ageFrom":2014,"ageTo":2021,"ageLabel":"2014–2021","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"","details":{"texts":[{"value":"Our autumn camp combines art with creative technology and gives children the chance to create interactive mixed-media artworks. The focus is on experimental work with images and objects that are brought to life with electronics.\u003cbr>\nThe children work with microcontrollers, LEDs, sensors and small motors, combining them with drawing, painting and construction elements. This creates works that not only look good but also move, light up or react to their surroundings.\u003cbr>\nIn their projects they program sequences and controls with which light, movement and reactions are deliberately shaped. In this way, analogue design techniques and digital control combine into an overall artistic expression.\u003cbr>\nIn the process, the children discover how new forms of creating emerge from the combination of art, electronics and programming. The focus is on experimenting, trying things out for yourself and creatively implementing ideas in an open, inspiring way of working.","nrs":["FCO 21"]}],"bring":[{"value":"Morning snack, lunch, afternoon snack, drinks, weather-appropriate clothing","nrs":["FCO 21"]}],"notes":[{"value":"Short periods of supervision before or after course hours can be booked for a fee directly with the organiser before the course week.","nrs":["FCO 21"]}]},"variants":[{"id":30958,"nr":"FCO 21","venue":36,"price":590,"weekId":"3-2","dates":"12 Oct – 16 Oct 2026","days":"Monday to Friday","time":"09:30–16:00","start":9.5,"end":16,"from":"2026-10-12T09:30:00","to":"2026-10-16T16:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"","ageFrom":2014,"ageTo":2021,"age":"2014–2021","free":true}]},{"id":30938,"title":"Coding and Outdoor / Programmieren und Outdoor-Abenteuer","category":"Tech & crafts","activity":"Science and technology","ageFrom":2014,"ageTo":2021,"ageLabel":"2014–2021","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"","details":{"texts":[{"value":"Our autumn camp combines programming with exciting outdoor adventures and gives children the chance to discover technology in nature in a playful way. We spend a lot of time outside and use digital tools to create creative and interactive projects.\u003cp>\nThe children program their own GPS treasure hunts, placing digital clues and creating exciting puzzles with app development tools. They build weather stations with sensors to measure temperature, humidity or wind, and program the data analysis. In small teams they steer robots through outdoor courses, solve coding challenges or develop a digital map with interactive markers.\u003cp>\nIn addition, with basic programming skills they can plan drone flight missions, develop an app for identifying plants and animals, or program a digital compass application.\u003cp>\nWhile working on these projects, they experience nature in a new, digital way, train their logical thinking and teamwork – and have lots of fun! This combination of movement, creativity and coding makes learning exciting and hands-on.","nrs":["FCO 22"]}],"bring":[{"value":"Morning snack, lunch, afternoon snack, drinks, weather-appropriate clothing","nrs":["FCO 22"]}],"notes":[{"value":"Short periods of supervision before or after course hours can be booked for a fee directly with the organiser before the course week.","nrs":["FCO 22"]}]},"variants":[{"id":30938,"nr":"FCO 22","venue":36,"price":590,"weekId":"3-2","dates":"12 Oct – 16 Oct 2026","days":"Monday to Friday","time":"09:30–16:00","start":9.5,"end":16,"from":"2026-10-12T09:30:00","to":"2026-10-16T16:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"","ageFrom":2014,"ageTo":2021,"age":"2014–2021","free":true}]},{"id":30942,"title":"Creative Camp – Breakdance, Graffiti & Rap","category":"Dance, music & stage","activity":"Dance (various)","ageFrom":2011,"ageTo":2018,"ageLabel":"2011–2018","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"Beginners and advanced","details":{"texts":[{"value":"Do you want to dance, be creative and develop your own style?\u003cbr>\nThen you've come to the right place!\u003cbr>\nLearn the basics of breakdance (breaking), spray your own canvas and write your own rap rhymes together with the group. You can try things out, learn something new and put your ideas into practice creatively.\u003cbr>\nGet creative and try new things together with others! A varied week full of movement, creativity and hip-hop feeling awaits you.\u003cbr>\nTo round things off, we present our songs, show a breaking performance and exhibit our graffiti artworks.\u003cbr>\n*The final performance takes place on Friday at 15:15 (best to put it in your calendar right away).*","nrs":["GRDA 11","GRDA 21"]}],"bring":[{"value":"Clean indoor shoes, comfortable clothing, clothes that are allowed to get paint on them, an old bed sheet at least 120x140 cm (can also be bought on site for CHF 15), rain, sun and cold protection (graffiti takes place outdoors), water bottle, morning snack and lunch.\n*The final performance takes place on Friday at 15:15 (best to put it in your calendar right away).*","nrs":["GRDA 11","GRDA 21"]}],"notes":[{"value":"You will be supervised over lunchtime, but you need to bring your lunch from home. Drop-off/pick-up times 08:45-09:00 and 16:00-16:15. Please inform the person in charge of the camp directly and in advance about anything special as well as allergies and medication.","nrs":["GRDA 11","GRDA 21"]}]},"variants":[{"id":30942,"nr":"GRDA 11","venue":37,"price":370,"weekId":"3-1","dates":"5 Oct – 9 Oct 2026","days":"Monday to Friday","time":"09:00–16:00","start":9,"end":16,"from":"2026-10-05T09:00:00","to":"2026-10-09T16:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners and advanced","ageFrom":2011,"ageTo":2018,"age":"2011–2018","free":true},{"id":30957,"nr":"GRDA 21","venue":38,"price":370,"weekId":"3-2","dates":"12 Oct – 16 Oct 2026","days":"Monday to Friday","time":"09:00–16:00","start":9,"end":16,"from":"2026-10-12T09:00:00","to":"2026-10-16T16:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners and advanced","ageFrom":2011,"ageTo":2018,"age":"2011–2018","free":true}]},{"id":30934,"title":"CreativeLab Zürich im Naturhistorischen Museum","category":"Tech & crafts","activity":"Science and technology","ageFrom":2016,"ageTo":2018,"ageLabel":"2016–2018","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"","details":{"texts":[{"value":"Take a look behind the scenes at the Naturhistorisches Museum! The museum's collections are true treasure troves of knowledge that researchers use to unlock the secrets of the past. Here you can discover them for yourself.\u003cp>\nDiscover prehistoric sharks from 365 million years ago! You'll explore real fossils from the museum collection and create your own drawing of a shark reconstruction.\u003cp>\nThe next day you'll become a plant researcher! You'll build your own wooden flower press using a laser cutter, prepare your own plant samples and label them.\u003cp>\nA hands-on holiday course for all curious young naturalists!","nrs":["FCL 11"]}],"bring":[{"value":"Snack, drink","nrs":["FCL 11"]}],"notes":[]},"variants":[{"id":30934,"nr":"FCL 11","venue":39,"price":60,"weekId":"3-1","dates":"6 Oct – 8 Oct 2026","days":"Tuesday to Thursday","time":"09:00–12:00","start":9,"end":12,"from":"2026-10-06T09:00:00","to":"2026-10-08T12:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"","ageFrom":2016,"ageTo":2018,"age":"2016–2018","free":true}]},{"id":30187,"title":"CrossFit","category":"Movement & fitness","activity":"Fitness","ageFrom":2010,"ageTo":2015,"ageLabel":"2010–2015","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"Beginners and advanced","details":{"texts":[{"value":"CrossFit youth training focuses on improving young people's fitness, strength and mobility while paying attention to their safety and their individual physical needs. Playful elements are included to make the training entertaining and keep motivation high.","nrs":["CRF 21"]}],"bring":[{"value":"Sportswear, sports shoes, water bottle","nrs":["CRF 21"]}],"notes":[]},"variants":[{"id":30187,"nr":"CRF 21","venue":27,"price":100,"weekId":"3-2","dates":"12 Oct – 16 Oct 2026","days":"Monday to Friday","time":"13:00–14:30","start":13,"end":14.5,"from":"2026-10-12T13:00:00","to":"2026-10-16T14:30:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners and advanced","ageFrom":2010,"ageTo":2015,"age":"2010–2015","free":true}]},{"id":30143,"title":"Curling","category":"Ice sports","activity":"Curling","ageFrom":2010,"ageTo":2016,"ageLabel":"2010–2016","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"Beginners and advanced","details":{"texts":[{"value":"Curling, \"chess on ice\", is a team sport full of excitement, play and fun. In the course you not only learn the most important rules and strategies. You also practise the techniques for curling and sweeping precisely and successfully.","nrs":["CUR 21"]}],"bring":[{"value":"Warm sports clothing","nrs":["CUR 21"]}],"notes":[]},"variants":[{"id":30143,"nr":"CUR 21","venue":40,"price":100,"weekId":"3-2","dates":"12 Oct – 16 Oct 2026","days":"Monday to Friday","time":"10:00–12:00","start":10,"end":12,"from":"2026-10-12T10:00:00","to":"2026-10-16T12:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners and advanced","ageFrom":2010,"ageTo":2016,"age":"2010–2016","free":true}]},{"id":31471,"title":"Deine zauberhafte Wunschkiste","category":"Tech & crafts","activity":"Crafts and making","ageFrom":2014,"ageTo":2019,"ageLabel":"2014–2019","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"","details":{"texts":[{"value":"During a short fantasy journey we track down our greatest wishes and dreams and then give them lots of power with pencil, brush and paint. You can craft a special cardboard box - as unique as you are - to keep your drawn, painted or written wishes in. And you'll also learn how they can best come true. That's bound to be magical!\n\u003cbr> More information at: \n\u003ca href=\"https://www.malspielraum.ch/\" target=\"_blank\" rel=\"noopener noreferrer\">www.nuori.ch\u003c/a>","nrs":["FZW 21"]}],"bring":[{"value":"Morning snack","nrs":["FZW 21"]}],"notes":[{"value":"Painting aprons and shoes are available in the studio.","nrs":["FZW 21"]}]},"variants":[{"id":31471,"nr":"FZW 21","venue":17,"price":50,"weekId":"3-2","dates":"16 Oct 2026","days":"Friday","time":"10:00–12:00","start":10,"end":12,"from":"2026-10-16T10:00:00","to":"2026-10-16T12:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"","ageFrom":2014,"ageTo":2019,"age":"2014–2019","free":true}]},{"id":30891,"title":"Design ein Videospiel mit Candli","category":"Tech & crafts","activity":"Science and technology","ageFrom":2013,"ageTo":2017,"ageLabel":"2013–2017","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"Beginners and advanced","details":{"texts":[{"value":"Dive into the world of game design and create your own video game! In this creative holiday course you design your own game elements with the Swiss program Candli – not with complicated code, but simply with pencil and paper. Your drawn characters and worlds are integrated directly into the game using an iPad or laptop, so you create a unique, personal game world.\u003cp>\n\nNo prior knowledge needed – the focus is on creativity! The course concentrates on design, storytelling, animation and music/sounds. Programming is taught playfully via an intuitive \"click-and-drag\" interface, but it isn't the main focus. Along the way you learn the basics of game design – with lots of fun and room for creative ideas.\u003cp>\n\nAt the end of the course you can publish your finished game on the filmkids+ platform (official partner of Enlightware) and share it with your friends.\u003cp>\n\nIdeal for creative minds, young artists and game fans! If you enjoy drawing and inventing stories, this course is just right for you. Candli was developed on the basis of research at ETH Zürich and encourages creativity in a playful way.\u003cp>\n\nSign up now and become a game designer!","nrs":["FDV 11","FDV 12"]}],"bring":[{"value":"Your own tablet or laptop (if possible), a drink and snacks","nrs":["FDV 11"]},{"value":"Your own tablet (if possible), a drink and snacks","nrs":["FDV 12"]}],"notes":[{"value":"A 1-month Candli Premium licence is included in the course price.","nrs":["FDV 11","FDV 12"]}]},"variants":[{"id":30891,"nr":"FDV 11","venue":13,"price":250,"weekId":"3-1","dates":"5 Oct – 9 Oct 2026","days":"Monday to Friday","time":"09:00–12:00","start":9,"end":12,"from":"2026-10-05T09:00:00","to":"2026-10-09T12:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners and advanced","ageFrom":2013,"ageTo":2017,"age":"2013–2017","free":true},{"id":31428,"nr":"FDV 12","venue":13,"price":250,"weekId":"3-1","dates":"5 Oct – 9 Oct 2026","days":"Monday to Friday","time":"13:00–16:00","start":13,"end":16,"from":"2026-10-05T13:00:00","to":"2026-10-09T16:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners and advanced","ageFrom":2013,"ageTo":2017,"age":"2013–2017","free":true}]},{"id":30965,"title":"Design your Sneakers / Customizing Workshop","category":"Tech & crafts","activity":"Crafts and making","ageFrom":2010,"ageTo":2015,"ageLabel":"2010–2015","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"Beginners","details":{"texts":[{"value":"Fancy your own unique sneakers or fresh designs on your things? Then this is exactly your course!\u003cbr>\nBring your sneakers, a denim jacket, a fabric bag or something completely different such as a water bottle and give it your very own personal style.\u003cbr>\nWhether with stencils or completely freestyle: you design whatever you want – from graffiti lettering to cartoons to logos or colour gradients. Then we bring your ideas to life together using paints, markers and creative tools.\u003cbr>\nAt the end you take your self-designed one-of-a-kind pieces home with you. Our professionals will support you along the way.","nrs":["FDS 11","FDS 12","FDS 21","FDS 22"]}],"bring":[{"value":"Water bottle, morning snack, creative ideas and a bit of patience. (Painting materials and other supplies are provided.)","nrs":["FDS 11","FDS 12","FDS 21","FDS 22"]}],"notes":[{"value":"You don't need to bring anything on the first day. At the beginning we will discuss your idea and create the design for it.","nrs":["FDS 11","FDS 12","FDS 21","FDS 22"]}]},"variants":[{"id":31504,"nr":"FDS 11","venue":37,"price":260,"weekId":"3-1","dates":"5 Oct – 9 Oct 2026","days":"Monday to Friday","time":"09:00–12:00","start":9,"end":12,"from":"2026-10-05T09:00:00","to":"2026-10-09T12:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners","ageFrom":2010,"ageTo":2015,"age":"2010–2015","free":true},{"id":31505,"nr":"FDS 12","venue":37,"price":260,"weekId":"3-1","dates":"5 Oct – 9 Oct 2026","days":"Monday to Friday","time":"13:00–16:00","start":13,"end":16,"from":"2026-10-05T13:00:00","to":"2026-10-09T16:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners","ageFrom":2010,"ageTo":2015,"age":"2010–2015","free":true},{"id":30965,"nr":"FDS 21","venue":38,"price":260,"weekId":"3-2","dates":"12 Oct – 16 Oct 2026","days":"Monday to Friday","time":"09:00–12:00","start":9,"end":12,"from":"2026-10-12T09:00:00","to":"2026-10-16T12:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners","ageFrom":2010,"ageTo":2015,"age":"2010–2015","free":true},{"id":30966,"nr":"FDS 22","venue":38,"price":260,"weekId":"3-2","dates":"12 Oct – 16 Oct 2026","days":"Monday to Friday","time":"13:00–16:00","start":13,"end":16,"from":"2026-10-12T13:00:00","to":"2026-10-16T16:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners","ageFrom":2010,"ageTo":2015,"age":"2010–2015","free":true}]},{"id":31120,"title":"Digitale Illustration & Charakterdesign","category":"Tech & crafts","activity":"Science and technology","ageFrom":2012,"ageTo":2015,"ageLabel":"2012–2015","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"Beginners","details":{"texts":[{"value":"Do you like drawing and would you like to learn how digital drawing works? In this course you develop your own characters on the computer and bring them to life.\n\u003cp>What you create:\n\u003cbr>• Your own characters based on your ideas – from fantasy heroes to comic figures\n\u003cbr>• Various drawing styles and techniques\n\u003cbr>• Simple animations that make your characters move\n\u003cbr>• 3D renderings and AI-supported designs\n\u003cbr>• A digital gallery with all of your works\n\u003cp>Your tools:\nYou work with the professional software Krita and learn the basics of digital illustration. Through simple programming you set your characters in motion.\nAt the end you present your works in a virtual exhibition","nrs":["FDI 21"]}],"bring":[{"value":"Your own Google account","nrs":["FDI 21"]}],"notes":[]},"variants":[{"id":31120,"nr":"FDI 21","venue":7,"price":350,"weekId":"3-2","dates":"12 Oct – 16 Oct 2026","days":"Monday to Friday","time":"13:00–16:30","start":13,"end":16.5,"from":"2026-10-12T13:00:00","to":"2026-10-16T16:30:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners","ageFrom":2012,"ageTo":2015,"age":"2012–2015","free":true}]},{"id":31488,"title":"Drei Tage Rap & Beatbox!","category":"Dance, music & stage","activity":"Music","ageFrom":2010,"ageTo":2013,"ageLabel":"2010–2013","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"Beginners and advanced","details":{"texts":[{"value":"Do you want to write your own raps or develop a rap song together with others? Are you already rapping and would like some professional coaching? Would you like to get to know different rap styles? How can you improve your flow and find out which vocal range is best for your rapping? Or do you simply want to try something new and find out: how do I write my own raps?\n\u003cbr>With beatboxing we'll gain experience with the basic technique and imitate simple beats with our mouths. We'll also learn a kind of didgeridoo breathing technique that lets you produce a tone and a beat at the same time! \u003cp>At the end there's the chance to record the best lines and put them together into a song. You can take this home with you as a memento of the workshop.","nrs":["FRA 11"]}],"bring":[{"value":"Optional: an instrumental beat to rap or write over (YouTube link or mp3).\nAlternatively, you can choose one of the course leader's instrumentals.","nrs":["FRA 11"]}],"notes":[{"value":"The Galotti Musikwerkstatt is located directly under the Hardbrücke, near the Hardplatz bus stop.\nThe course leader is Chocolococolo. He also raps under the name Hansimoto.","nrs":["FRA 11"]}]},"variants":[{"id":31488,"nr":"FRA 11","venue":41,"price":150,"weekId":"3-1","dates":"5 Oct – 7 Oct 2026","days":"Monday to Wednesday","time":"10:00–13:00","start":10,"end":13,"from":"2026-10-05T10:00:00","to":"2026-10-07T13:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners and advanced","ageFrom":2010,"ageTo":2013,"age":"2010–2013","free":true}]},{"id":31477,"title":"Druck- und Malatelier","category":"Tech & crafts","activity":"Crafts and making","ageFrom":2013,"ageTo":2018,"ageLabel":"2013–2018","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"","details":{"texts":[{"value":"Let's dive into the fascinating world of printing techniques!\u003cbr>\nTogether we'll experiment with everyday materials that are easy to come by – for example natural materials, recycled materials or things you can find around the house. \u003cbr>\nWould you like to try Gelli printing and design your own little art print booklet? Do you fancy stamp printing, simple foil techniques or printing with Tetra Pak? And if the sun is shining, we'll try our hand at blueprinting (cyanotype).\nIn the painting studio we'll also take time to immerse ourselves in the painting process and discover colours in a playful way. Together we'll set off on a creative journey of discovery into the world of monotype – because every print and every picture is one of a kind.","nrs":["FDA 11"]}],"bring":[{"value":"Lunch","nrs":["FDA 11"]}],"notes":[{"value":"You will be supervised over lunchtime, but you need to bring your lunch from home.","nrs":["FDA 11"]}]},"variants":[{"id":31477,"nr":"FDA 11","venue":42,"price":175,"weekId":"3-1","dates":"5 Oct – 6 Oct 2026","days":"Monday to Tuesday","time":"09:30–15:30","start":9.5,"end":15.5,"from":"2026-10-05T09:30:00","to":"2026-10-06T15:30:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"","ageFrom":2013,"ageTo":2018,"age":"2013–2018","free":true}]},{"id":31423,"title":"Druckwerkstatt","category":"Tech & crafts","activity":"Crafts and making","ageFrom":2014,"ageTo":2020,"ageLabel":"2014–2020","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"","details":{"texts":[{"value":"You like drawing and painting and would like to print your designs on beautiful Japanese paper. In the printing workshop you get to know printing techniques such as foam rubber printing, polystyrene printing and frottage. You experiment with stamps, stencils and colours, enjoy your first test print and keep on trying. At the end you take your printed works home with you and may even decorate your room with them.","nrs":["FDW 21","FDW 22","FDW 23","FDW 24"]}],"bring":[{"value":"Snack","nrs":["FDW 21","FDW 22","FDW 23","FDW 24"]}],"notes":[]},"variants":[{"id":31423,"nr":"FDW 21","venue":43,"price":67,"weekId":"3-2","dates":"14 Oct 2026","days":"Wednesday","time":"09:00–12:00","start":9,"end":12,"from":"2026-10-14T09:00:00","to":"2026-10-14T12:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"","ageFrom":2014,"ageTo":2020,"age":"2014–2020","free":true},{"id":31425,"nr":"FDW 23","venue":43,"price":67,"weekId":"3-2","dates":"15 Oct 2026","days":"Thursday","time":"09:00–12:00","start":9,"end":12,"from":"2026-10-15T09:00:00","to":"2026-10-15T12:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"","ageFrom":2014,"ageTo":2020,"age":"2014–2020","free":true},{"id":31424,"nr":"FDW 22","venue":43,"price":67,"weekId":"3-2","dates":"14 Oct 2026","days":"Wednesday","time":"13:30–16:30","start":13.5,"end":16.5,"from":"2026-10-14T13:30:00","to":"2026-10-14T16:30:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"","ageFrom":2014,"ageTo":2020,"age":"2014–2020","free":true},{"id":31426,"nr":"FDW 24","venue":43,"price":67,"weekId":"3-2","dates":"15 Oct 2026","days":"Thursday","time":"13:30–16:30","start":13.5,"end":16.5,"from":"2026-10-15T13:30:00","to":"2026-10-15T16:30:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"","ageFrom":2014,"ageTo":2020,"age":"2014–2020","free":true}]},{"id":30969,"title":"Ein Tag als Tierarzt","category":"Nature & adventure","activity":"Nature and adventure","ageFrom":2014,"ageTo":2020,"ageLabel":"2014–2020","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"","details":{"texts":[{"value":"Have you always wanted to know how vets help animals when they are hurt or ill? On this day you will become a little vet yourself.\n\u003cbr>\nTogether we visit our Schöflis and learn in a playful way how to tell whether an animal is doing well. We listen to their heartbeat, examine the animals and look at what they need to be healthy and happy.\nUnder the guidance of a vet, you can practise bandaging and learn a lot along the way. We will also make our own natural medicine to take home.","nrs":["FTI 11"]}],"bring":[{"value":"Vegetarian lunch, weather-appropriate clothing that is allowed to get dirty, and good footwear. Please bring your own favourite cuddly toy that can be treated","nrs":["FTI 11"]}],"notes":[]},"variants":[{"id":30969,"nr":"FTI 11","venue":44,"price":80,"weekId":"3-1","dates":"7 Oct 2026","days":"Wednesday","time":"10:00–15:00","start":10,"end":15,"from":"2026-10-07T10:00:00","to":"2026-10-07T15:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"","ageFrom":2014,"ageTo":2020,"age":"2014–2020","free":true}]},{"id":30111,"title":"Eishockey für Mädchen","category":"Ice sports","activity":"Ice hockey","ageFrom":2016,"ageTo":2021,"ageLabel":"2016–2021","mixedAges":false,"mixedLevels":false,"gender":"Girls only","level":"Beginners","details":{"texts":[{"value":"Your game. Your fun. Your ice. A week of ice hockey for girls: you stand on the ice in full equipment for the first time, guide the puck with your stick, glide on one leg over the smooth ice surface, score goals and make new friends.","nrs":["EHG 11","EHG 21"]}],"bring":[{"value":"A snack for the break after the ice session (hockey makes you hungry), a drink (no sugary drinks). The protective hockey equipment including a stick is provided (anyone who has their own gear is welcome to bring it). Bring your own skates or rent them on site (CHF 6.00 per day; the rental fee is not included in the course fee).","nrs":["EHG 11","EHG 21"]}],"notes":[{"value":"On Monday the course starts at 08:45. The hockey equipment is provided by the Sports Office and must be collected in advance from the sports equipment administration (Ernastrasse 25, 8004 Zürich; Mon-Fri 07:30-12:00 and 13:30-17:00; tel. 044 413 53 93). If you have difficulties collecting it, please send a message to girls@lions-nachwuchs.ch. Beginners born in 2014/2015 and girls with hockey experience should register at girls@lions-nachwuchs.ch.","nrs":["EHG 11","EHG 21"]}]},"variants":[{"id":30111,"nr":"EHG 11","venue":45,"price":70,"weekId":"3-1","dates":"5 Oct – 9 Oct 2026","days":"Monday to Friday","time":"09:00–12:00","start":9,"end":12,"from":"2026-10-05T09:00:00","to":"2026-10-09T12:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners","ageFrom":2016,"ageTo":2021,"age":"2016–2021","free":true},{"id":31492,"nr":"EHG 21","venue":45,"price":70,"weekId":"3-2","dates":"12 Oct – 16 Oct 2026","days":"Monday to Friday","time":"09:00–12:00","start":9,"end":12,"from":"2026-10-12T09:00:00","to":"2026-10-16T12:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners","ageFrom":2016,"ageTo":2021,"age":"2016–2021","free":true}]},{"id":30112,"title":"Eislaufen","category":"Ice sports","activity":"Figure skating","ageFrom":2018,"ageTo":2021,"ageLabel":"2018–2021","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"Beginners and advanced","details":{"texts":[{"value":"In the ice-skating course you will learn in a playful way how to zip around safely on the ice. At the start of the course you must already be attending kindergarten and be able to move independently on skates on the ice.","nrs":["ESH 11","ESH 21"]}],"bring":[{"value":"Skates, gloves, helmet or hat, clothing suitable for the weather. Movement must not be restricted by the clothing. Skates can be rented on site. The skate rental (CHF 6 per day) is not included in the course fee.","nrs":["ESH 11","ESH 21"]}],"notes":[{"value":"The course takes place in the ice rink hall. Figure skates with toe picks are recommended as they provide better grip, but hockey skates are also possible. Participants must already be attending kindergarten and be able to move independently on skates on the ice. Otherwise participation is not possible.","nrs":["ESH 11","ESH 21"]}]},"variants":[{"id":30112,"nr":"ESH 11","venue":45,"price":65,"weekId":"3-1","dates":"5 Oct – 9 Oct 2026","days":"Monday to Friday","time":"09:30–10:30","start":9.5,"end":10.5,"from":"2026-10-05T09:30:00","to":"2026-10-09T10:30:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners and advanced","ageFrom":2018,"ageTo":2021,"age":"2018–2021","free":true},{"id":30145,"nr":"ESH 21","venue":45,"price":65,"weekId":"3-2","dates":"12 Oct – 16 Oct 2026","days":"Monday to Friday","time":"09:30–10:30","start":9.5,"end":10.5,"from":"2026-10-12T09:30:00","to":"2026-10-16T10:30:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners and advanced","ageFrom":2018,"ageTo":2021,"age":"2018–2021","free":true}]},{"id":30113,"title":"Eislaufen","category":"Ice sports","activity":"Figure skating","ageFrom":2015,"ageTo":2019,"ageLabel":"2015–2019","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"Beginners and advanced","details":{"texts":[{"value":"In the ice-skating course you will learn in a playful way how to zip around safely on the ice. At the start of the course you must be able to move independently on skates on the ice.","nrs":["ESH 12","ESH 22"]}],"bring":[{"value":"Skates, gloves, helmet or hat, clothing suitable for the weather. Movement must not be restricted by the clothing. Skates can be rented on site. The skate rental (CHF 6 per day) is not included in the course fee.","nrs":["ESH 12","ESH 22"]}],"notes":[{"value":"The course takes place in the ice rink hall. Figure skates with toe picks are recommended as they provide better grip, but hockey skates are also possible. Participants must already be attending kindergarten and be able to move independently on skates on the ice. Otherwise participation is not possible.","nrs":["ESH 12","ESH 22"]}]},"variants":[{"id":30113,"nr":"ESH 12","venue":45,"price":65,"weekId":"3-1","dates":"5 Oct – 9 Oct 2026","days":"Monday to Friday","time":"10:30–11:30","start":10.5,"end":11.5,"from":"2026-10-05T10:30:00","to":"2026-10-09T11:30:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners and advanced","ageFrom":2015,"ageTo":2019,"age":"2015–2019","free":true},{"id":30146,"nr":"ESH 22","venue":45,"price":65,"weekId":"3-2","dates":"12 Oct – 16 Oct 2026","days":"Monday to Friday","time":"10:30–11:30","start":10.5,"end":11.5,"from":"2026-10-12T10:30:00","to":"2026-10-16T11:30:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners and advanced","ageFrom":2015,"ageTo":2019,"age":"2015–2019","free":true}]},{"id":30147,"title":"Eislaufen","category":"Ice sports","activity":"Figure skating","ageFrom":2014,"ageTo":2021,"ageLabel":"2014–2021","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"Beginners and advanced","details":{"texts":[{"value":"Glide like the pros – in the Swiss Life Arena!\u003cp>\nDo you fancy spinning pirouettes on the ice, learning cool moves and feeling like a real skating star? Then come onto the ice with us – in the mega-cool Swiss Life Arena! In this exciting course you can expect 45 minutes of action-packed off-ice training (14:00-14:45) combined with 1 hour of on-ice training (15:00-16:00). In the off-ice session you prepare optimally for the training on the ice and practise jumps, rotation, balance, stability as well as fitness and strength. Join in and show what you can do on and off the ice!","nrs":["ESL 21","ESL 22"]}],"bring":[{"value":"Figure skates with toe picks are recommended as they give better grip, but hockey skates are also possible. Gloves are compulsory! Warm clothes, helmet or thick hat. Sports clothes and sports shoes for the off-ice training.\n\nSkates can be rented in advance for CHF 50 per week. Registration and shoe size details are required by 30.09.2026 to tk@kls-ecz.ch. The pre-ordered skates must be paid for by TWINT on the first day of the course.","nrs":["ESL 21","ESL 22"]}],"notes":[{"value":"Please be at the ice rink at least 20 minutes before the course starts so that there is enough time to collect the skates and change without rushing. Participants must already be attending kindergarten and be able to move independently on skates on the ice.","nrs":["ESL 21","ESL 22"]}]},"variants":[{"id":30147,"nr":"ESL 21","venue":46,"price":120,"weekId":"3-2","dates":"12 Oct – 16 Oct 2026","days":"Monday to Friday","time":"14:00–16:00","start":14,"end":16,"from":"2026-10-12T14:00:00","to":"2026-10-16T16:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners and advanced","ageFrom":2014,"ageTo":2021,"age":"2014–2021","free":true},{"id":30148,"nr":"ESL 22","venue":46,"price":120,"weekId":"3-2","dates":"12 Oct – 16 Oct 2026","days":"Monday to Friday","time":"15:15–17:15","start":15.25,"end":17.25,"from":"2026-10-12T15:15:00","to":"2026-10-16T17:15:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners and advanced","ageFrom":2014,"ageTo":2021,"age":"2014–2021","free":true}]},{"id":30114,"title":"Eislaufen","category":"Ice sports","activity":"Figure skating","ageFrom":2018,"ageTo":2021,"ageLabel":"2018–2021","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"Beginners","details":{"texts":[{"value":"In the ice-skating course you will learn in a playful way how to zip around safely on the ice. At the start of the course you must already be attending kindergarten and be able to move independently on skates on the ice.","nrs":["ESO 11","ESO 12","ESO 21","ESO 22"]}],"bring":[{"value":"Skates, gloves, helmet or hat, clothing suitable for the weather. Movement must not be restricted by the clothing. Skates can be rented on site. The skate rental (CHF 6 per day) is not included in the course fee.","nrs":["ESO 11","ESO 12","ESO 21","ESO 22"]}],"notes":[{"value":"The course takes place in any weather on the artificial ice rink. Figure skates with toe picks are recommended as they provide better grip, but hockey skates are also possible. Participants must already be attending kindergarten and be able to move independently on skates on the ice. Otherwise participation is not possible.","nrs":["ESO 11","ESO 12","ESO 21","ESO 22"]}]},"variants":[{"id":30114,"nr":"ESO 11","venue":47,"price":60,"weekId":"3-1","dates":"5 Oct – 9 Oct 2026","days":"Monday to Friday","time":"10:30–11:10","start":10.5,"end":11.166666666666666,"from":"2026-10-05T10:30:00","to":"2026-10-09T11:10:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners","ageFrom":2018,"ageTo":2021,"age":"2018–2021","free":true},{"id":30115,"nr":"ESO 12","venue":47,"price":60,"weekId":"3-1","dates":"5 Oct – 9 Oct 2026","days":"Monday to Friday","time":"11:10–11:50","start":11.166666666666666,"end":11.833333333333334,"from":"2026-10-05T11:10:00","to":"2026-10-09T11:50:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners","ageFrom":2018,"ageTo":2021,"age":"2018–2021","free":true},{"id":30149,"nr":"ESO 21","venue":47,"price":60,"weekId":"3-2","dates":"12 Oct – 16 Oct 2026","days":"Monday to Friday","time":"10:30–11:10","start":10.5,"end":11.166666666666666,"from":"2026-10-12T10:30:00","to":"2026-10-16T11:10:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners","ageFrom":2018,"ageTo":2021,"age":"2018–2021","free":true},{"id":30150,"nr":"ESO 22","venue":47,"price":60,"weekId":"3-2","dates":"12 Oct – 16 Oct 2026","days":"Monday to Friday","time":"11:10–11:50","start":11.166666666666666,"end":11.833333333333334,"from":"2026-10-12T11:10:00","to":"2026-10-16T11:50:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners","ageFrom":2018,"ageTo":2021,"age":"2018–2021","free":true}]},{"id":30939,"title":"Entdecke die Welt der Hunde","category":"Nature & adventure","activity":"Nature and adventure","ageFrom":2015,"ageTo":2019,"ageLabel":"2015–2019","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"","details":{"texts":[{"value":"Would you like to know more about dogs? Maybe you even dream of having a dog of your own? We think that's great!\u003cbr>\nWith us you'll learn a lot about responsibility, care, dog language, activities and dog breeds through fun and games. There will also be practical and entertaining exercises with our dogs.\u003cbr>\nWith a little tracking exercise we'll follow in the footsteps of wolves. Find out what still connects our dogs with their wild ancestors today.\u003cbr>\nAll participants receive a personal course certificate","nrs":["FHU 11","FHU 21"]}],"bring":[{"value":"Snacks/lunch, weatherproof clothing, sturdy shoes, sun protection, indoor slippers.","nrs":["FHU 11","FHU 21"]}],"notes":[{"value":"The course takes place outdoors and, depending on the weather, partly in the training room.","nrs":["FHU 11","FHU 21"]}]},"variants":[{"id":30939,"nr":"FHU 11","venue":48,"price":70,"weekId":"3-1","dates":"7 Oct 2026","days":"Wednesday","time":"10:00–14:30","start":10,"end":14.5,"from":"2026-10-07T10:00:00","to":"2026-10-07T14:30:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"","ageFrom":2015,"ageTo":2019,"age":"2015–2019","free":true},{"id":30959,"nr":"FHU 21","venue":48,"price":70,"weekId":"3-2","dates":"14 Oct 2026","days":"Wednesday","time":"10:00–14:30","start":10,"end":14.5,"from":"2026-10-14T10:00:00","to":"2026-10-14T14:30:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"","ageFrom":2015,"ageTo":2019,"age":"2015–2019","free":true}]},{"id":31493,"title":"Erlebnistag für kleine Naturheld*innen","category":"Nature & adventure","activity":"Nature and adventure","ageFrom":2014,"ageTo":2020,"ageLabel":"2014–2020","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"","details":{"texts":[{"value":"We'll take a closer look at fascinating nature and observe its inhabitants in order to understand what they need from their habitat. What actually is the difference between Maja the honeybee and Mia the wild bee? And what do they contribute to biodiversity?\u003cbr>\nWe'll look at how we can do nature some good, what each of us can contribute, and together we'll create something great to take home. We'll be accompanied by our dear little sheep, who will be spoiled by us with cuddles and treats.","nrs":["FEN 11"]}],"bring":[{"value":"Vegetarian lunch, weather-appropriate clothing that is allowed to get dirty, and sturdy, waterproof shoes.","nrs":["FEN 11"]}],"notes":[]},"variants":[{"id":31493,"nr":"FEN 11","venue":44,"price":80,"weekId":"3-1","dates":"8 Oct 2026","days":"Thursday","time":"09:00–14:00","start":9,"end":14,"from":"2026-10-08T09:00:00","to":"2026-10-08T14:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"","ageFrom":2014,"ageTo":2020,"age":"2014–2020","free":true}]},{"id":31464,"title":"Experimentieren mit Bild und Schrift (K’Werk Zürich)","category":"Tech & crafts","activity":"Crafts and making","ageFrom":2011,"ageTo":2016,"ageLabel":"2011–2016","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"","details":{"texts":[{"value":"With scissors, brushes, tape, glue sticks and paper we try out new ways of representing things and practise depicting motifs in a bold, poster-like way. It's not only about the image, but also about the world of letters. When does lettering seem loud, quiet or playful? How can I combine image and text? Our starting point is the year with its months - the especially hot, wild, dreamy and quiet ones. This turns our graphic experiments into a collection of monthly posters. At the end we print them as a calendar for the new year. \u003cp>\n\u003cstrong>K'Werk Zürich stands for high artistic quality. The children and young people are guided by experienced artists.\u003c/strong>","nrs":["FEB 11"]}],"bring":[{"value":"Lunch, snacks, a drink","nrs":["FEB 11"]}],"notes":[{"value":"Course leader: Marisa Zürcher, visual designer","nrs":["FEB 11"]}]},"variants":[{"id":31464,"nr":"FEB 11","venue":49,"price":560,"weekId":"3-1","dates":"5 Oct – 9 Oct 2026","days":"Monday to Friday","time":"10:00–15:00","start":10,"end":15,"from":"2026-10-05T10:00:00","to":"2026-10-09T15:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"","ageFrom":2011,"ageTo":2016,"age":"2011–2016","free":true}]},{"id":31437,"title":"Fashion Camp – Schneidere & präsentiere dein eigenes Outfit","category":"Tech & crafts","activity":"Crafts and making","ageFrom":2011,"ageTo":2017,"ageLabel":"2011–2017","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"Beginners and advanced","details":{"texts":[{"value":"Dive with us into the creative world of fashion and sew your own outfit together with us. On the first day you choose the fabric and the pattern. Over the next three days we help you to create and adjust your outfit. As the highlight at the end of the week, you then present your creation in a fashion show for family & friends.","nrs":["FFC 11"]}],"bring":[{"value":"All materials as well as the morning snack, lunch and afternoon snack are provided. Apart from a water bottle and possibly sunscreen, the children do not need to bring anything.","nrs":["FFC 11"]}],"notes":[{"value":"Together with the children we plan a simple, seasonal outfit that can be made within the week, and we help them create it (depending on age and skills). Each child sews at least one item of clothing that can be combined with a simple top or a pair of trousers/a skirt. The goal is not the perfectly tailored outfit, but a creative week with games, fun and some relaxation too.\nPlease send the following details by email to info@allegradesign.ch before the course: i) current clothing size, ii) sewing skills (beginner/advanced), iii) allergies/dietary restrictions, iv) may the child go home alone in the evening or will they be picked up, v) any other important information/special notes?\nThe fashion show takes place on Friday afternoon at 15:15 in the course room.","nrs":["FFC 11"]}]},"variants":[{"id":31437,"nr":"FFC 11","venue":50,"price":590,"weekId":"3-1","dates":"5 Oct – 9 Oct 2026","days":"Monday to Friday","time":"09:00–17:00","start":9,"end":17,"from":"2026-10-05T09:00:00","to":"2026-10-09T17:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners and advanced","ageFrom":2011,"ageTo":2017,"age":"2011–2017","free":true}]},{"id":30116,"title":"Fechten","category":"Martial arts","activity":"Fencing","ageFrom":2013,"ageTo":2018,"ageLabel":"2013–2018","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"Beginners","details":{"texts":[{"value":"In this course you will get to know this fast, dynamic sport. You will learn attacking and defensive techniques, practise reacting lightning-fast and moving nimbly. This gives you an insight into modern sport fencing.","nrs":["FEC 11","FEC 21"]}],"bring":[{"value":"Sports clothes (long training trousers are essential to protect the legs!), clean sports shoes with non-marking soles and a drink. Fencing equipment is provided.","nrs":["FEC 11","FEC 21"]}],"notes":[{"value":"Please note: the entrance to the fencing hall is opposite the Freestylepark Allmend.","nrs":["FEC 11","FEC 21"]}]},"variants":[{"id":30116,"nr":"FEC 11","venue":51,"price":110,"weekId":"3-1","dates":"5 Oct – 9 Oct 2026","days":"Monday to Friday","time":"14:30–16:30","start":14.5,"end":16.5,"from":"2026-10-05T14:30:00","to":"2026-10-09T16:30:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners","ageFrom":2013,"ageTo":2018,"age":"2013–2018","free":true},{"id":30151,"nr":"FEC 21","venue":51,"price":110,"weekId":"3-2","dates":"12 Oct – 16 Oct 2026","days":"Monday to Friday","time":"09:00–11:00","start":9,"end":11,"from":"2026-10-12T09:00:00","to":"2026-10-16T11:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners","ageFrom":2013,"ageTo":2018,"age":"2013–2018","free":true}]},{"id":31454,"title":"Ferien im Kräuterwald","category":"Nature & adventure","activity":"Nature and adventure","ageFrom":2015,"ageTo":2020,"ageLabel":"2015–2020","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"","details":{"texts":[{"value":"Imagine entering a mysterious world full of herbs and plants that bloom and thrive in autumn in forests, meadows and gardens. Together we collect various treasures from nature and use them to make one herbal delicacy or another. Now and then a folk tale accompanies us.\nIn addition, a large meadow or the quiet forest around the Pfadiheim is waiting for your playful and adventurous spirit.\nAt the fire pit on the grounds we light a fire if the weather allows, over which you can grill the food you have brought along.\n\u003cbr>\nYou can also attend further days, as the activities differ.\nIf possible we are outdoors all day. In bad weather we find shelter in the hut. Please dress according to the weather.\n\u003cbr>\nFor impressions visit \u003ca href=\"https://www.wildpflanzenkurse.ch/\" target=\"_blank\" rel=\"noopener noreferrer\">www.wildpflanzenkurse.ch\u003c/a>.\n\u003cp>\nIn the event of a strong storm, the course is cancelled on the day concerned.","nrs":["FKR 11","FKR 21","FKR 22"]}],"bring":[{"value":"Food/something to grill (weather permitting), own eating utensils, rubbish bag, weather-appropriate clothing, slippers/thick socks (only in rain and cold), possibly spare clothes, pocket knife (only for children who know how to use one, labelled if possible), possibly a table tennis bat or other outdoor games equipment","nrs":["FKR 11","FKR 21","FKR 22"]}],"notes":[{"value":"Please be sure to inform us of allergies, special eating habits and anything else requiring particular attention after the definitive course confirmation.","nrs":["FKR 11","FKR 21","FKR 22"]}]},"variants":[{"id":31454,"nr":"FKR 11","venue":52,"price":75,"weekId":"3-1","dates":"8 Oct 2026","days":"Thursday","time":"09:15–16:45","start":9.25,"end":16.75,"from":"2026-10-08T09:15:00","to":"2026-10-08T16:45:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"","ageFrom":2015,"ageTo":2020,"age":"2015–2020","free":true},{"id":31455,"nr":"FKR 21","venue":52,"price":75,"weekId":"3-2","dates":"15 Oct 2026","days":"Thursday","time":"09:15–16:45","start":9.25,"end":16.75,"from":"2026-10-15T09:15:00","to":"2026-10-15T16:45:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"","ageFrom":2015,"ageTo":2020,"age":"2015–2020","free":true},{"id":31456,"nr":"FKR 22","venue":52,"price":75,"weekId":"3-2","dates":"16 Oct 2026","days":"Friday","time":"09:15–16:45","start":9.25,"end":16.75,"from":"2026-10-16T09:15:00","to":"2026-10-16T16:45:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"","ageFrom":2015,"ageTo":2020,"age":"2015–2020","free":true}]},{"id":31451,"title":"Ferien im Märchenwald","category":"Nature & adventure","activity":"Nature and adventure","ageFrom":2016,"ageTo":2021,"ageLabel":"2016–2021","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"","details":{"texts":[{"value":"On this day, fairy tales and stories take us on a mysterious journey into hidden worlds that tell of enigmatic and many magical things. From finds from nature and other materials we craft a fairy-tale treasure to go with one story or another. In addition, a large meadow or the quiet forest around the Pfadiheim is waiting for your playful and adventurous spirit.\nAt the fire pit on the grounds we light a fire if the weather is good, over which you can grill the food you have brought along.\n\u003cbr>\nYou can also attend further days, as the activities and fairy tales differ.\nIf possible we are outdoors in any weather. In bad weather we find shelter in the hut. Please dress according to the weather.\n\u003cbr>\nFor impressions, follow us on Instagram (@maerchen_maerchen) or visit \u003ca href=\"https://www.susanne-michel.maerchen.ch/startseite/\" target=\"_blank\" rel=\"noopener noreferrer\">www.susanne-michel.maerchen.ch\u003c/a>.\n\u003cp>\nIn the event of a strong storm, the course is cancelled on the day concerned.","nrs":["FMW 11","FMW 12","FMW 21"]}],"bring":[{"value":"Food / something to grill (weather permitting), your own tableware, a small rubbish bag, weather-appropriate clothing, slippers/thick socks (in rain and cold), possibly a change of clothes, pocket knife (only for children experienced with pocket knives, labelled with their name if possible), possibly a table tennis bat or other outdoor games equipment","nrs":["FMW 11","FMW 12","FMW 21"]}],"notes":[{"value":"Please be sure to inform us of allergies, special dietary habits and anything else requiring particular attention after the definitive course confirmation.","nrs":["FMW 11","FMW 12","FMW 21"]}]},"variants":[{"id":31451,"nr":"FMW 11","venue":52,"price":75,"weekId":"3-1","dates":"6 Oct 2026","days":"Tuesday","time":"09:15–16:45","start":9.25,"end":16.75,"from":"2026-10-06T09:15:00","to":"2026-10-06T16:45:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"","ageFrom":2016,"ageTo":2021,"age":"2016–2021","free":true},{"id":31452,"nr":"FMW 12","venue":52,"price":75,"weekId":"3-1","dates":"7 Oct 2026","days":"Wednesday","time":"09:15–16:45","start":9.25,"end":16.75,"from":"2026-10-07T09:15:00","to":"2026-10-07T16:45:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"","ageFrom":2016,"ageTo":2021,"age":"2016–2021","free":true},{"id":31453,"nr":"FMW 21","venue":52,"price":75,"weekId":"3-2","dates":"14 Oct 2026","days":"Wednesday","time":"09:15–16:45","start":9.25,"end":16.75,"from":"2026-10-14T09:15:00","to":"2026-10-14T16:45:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"","ageFrom":2016,"ageTo":2021,"age":"2016–2021","free":true}]},{"id":30945,"title":"Ferientag bei den Schöflis","category":"Nature & adventure","activity":"Nature and adventure","ageFrom":2014,"ageTo":2020,"ageLabel":"2014–2020","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"","details":{"texts":[{"value":"We spend an adventurous day with great activities all about the sheep and nature. We stroke, brush and feed the sheep, muck out their stable and practise tricks with them. In doing so, we learn what they need for a happy life.","nrs":["FSC 11","FSC 12","FSC 21","FSC 22"]}],"bring":[{"value":"Vegetarian lunch, weather-appropriate clothing that is allowed to get dirty, and sturdy shoes.","nrs":["FSC 11","FSC 12","FSC 21","FSC 22"]}],"notes":[{"value":"Please register only one \"Holiday day with the sheep\" per child, so that as many children as possible can benefit from the programme.","nrs":["FSC 11","FSC 12","FSC 21","FSC 22"]}]},"variants":[{"id":30945,"nr":"FSC 11","venue":44,"price":80,"weekId":"3-1","dates":"5 Oct 2026","days":"Monday","time":"10:00–15:00","start":10,"end":15,"from":"2026-10-05T10:00:00","to":"2026-10-05T15:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"","ageFrom":2014,"ageTo":2020,"age":"2014–2020","free":true},{"id":31489,"nr":"FSC 12","venue":44,"price":80,"weekId":"3-1","dates":"6 Oct 2026","days":"Tuesday","time":"10:00–15:00","start":10,"end":15,"from":"2026-10-06T10:00:00","to":"2026-10-06T15:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"","ageFrom":2014,"ageTo":2020,"age":"2014–2020","free":true},{"id":31490,"nr":"FSC 21","venue":44,"price":80,"weekId":"3-2","dates":"15 Oct 2026","days":"Thursday","time":"10:00–15:00","start":10,"end":15,"from":"2026-10-15T10:00:00","to":"2026-10-15T15:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"","ageFrom":2014,"ageTo":2020,"age":"2014–2020","free":true},{"id":31491,"nr":"FSC 22","venue":44,"price":80,"weekId":"3-2","dates":"16 Oct 2026","days":"Friday","time":"10:00–15:00","start":10,"end":15,"from":"2026-10-16T10:00:00","to":"2026-10-16T15:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"","ageFrom":2014,"ageTo":2020,"age":"2014–2020","free":true}]},{"id":31465,"title":"Figuren aus Zeitung, Klebeband und Gips (K’Werk Zürich)","category":"Tech & crafts","activity":"Crafts and making","ageFrom":2016,"ageTo":2018,"ageLabel":"2016–2018","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"","details":{"texts":[{"value":"With a few newspapers and some tape you can make your own 3D figure! For example a self-portrait or a fantasy creature. Using plaster bandages or pulp, the three-dimensional figure gets extra details and is finally painted. Let your imagination run free - you'll be surprised what you can create! \u003cp>\n\u003cstrong>K'Werk Zürich stands for high artistic quality. The children and young people are guided by experienced artists.\u003c/strong>","nrs":["FZK 11"]}],"bring":[{"value":"Lunch, snacks, a drink","nrs":["FZK 11"]}],"notes":[{"value":"Course leader: Mirja Fiorentino, crafts teacher, stage designer","nrs":["FZK 11"]}]},"variants":[{"id":31465,"nr":"FZK 11","venue":49,"price":560,"weekId":"3-1","dates":"5 Oct – 9 Oct 2026","days":"Monday to Friday","time":"10:00–15:00","start":10,"end":15,"from":"2026-10-05T10:00:00","to":"2026-10-09T15:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"","ageFrom":2016,"ageTo":2018,"age":"2016–2018","free":true}]},{"id":30873,"title":"Film ab!","category":"Tech & crafts","activity":"Science and technology","ageFrom":2011,"ageTo":2016,"ageLabel":"2011–2016","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"Beginners","details":{"texts":[{"value":"Film acting, directing, camera, sound, editing – here you can try out anything you like about filmmaking. Together with professionals who work in film themselves, you can create your own short film in groups.\n\u003cp>\nOn Friday at 15:00 the big cinema premiere takes place, where all participants from the filmkids holiday courses Animation Film, Action! and Film Acting present their films and projects. Parents, siblings and friends are warmly invited.\n\u003cp>\nImportant: In order to take part in the course, an assignment of rights is required so that the film and photo recordings made during the course may afterwards be made available to everyone and posted on our platforms (YouTube channel filmkidsCH, Facebook page, Instagram, website). You can find examples on our platforms. Please contact us directly if you have any questions.\nMore about us at\n\u003ca href=\"http://filmkids.ch/\" target=\"_blank\" rel=\"noopener noreferrer\">www.filmkids.ch\u003c/a>\n\u003cp>\nOPTIONAL: 12 supervision places are available:\u003cp>\nMon – Fri from 08:00 – 10:00: CHF 75\u003cp>\nMon – Fri from 16:00 – 18:00: CHF 75\u003cp>\nThe supervision time is not teaching time, only drop-in care. Drawing materials, games and a supervisor are available on site. The children are welcome to bring homework, their own books, comics etc. Playing on a mobile phone and watching films are expressly allowed. Supervision can only take place if there are enough registrations.","nrs":["FFA 11"]},{"value":"Film acting, directing, camera, sound, editing – here you can try out everything about filmmaking that you like. Together with professionals who work in film themselves, you can make your own short film in groups.\n\n\u003cp>On Friday at 15:00 the big cinema premiere takes place, where all participants of the filmkids holiday courses Animationsfilm, Film ab and Filmschauspiel present their films and projects. Parents, siblings and friends are warmly invited.\u003cp>\n \n\u003cp>More about us at \n\u003ca href=\"http://filmkids.ch/\" target=\"_blank\" rel=\"noopener noreferrer\">www.filmkids.ch\u003c/a>.\n\u003cp>\nOPTIONAL: 12 supervision places are available: \u003cp>\nMon – Fri from 08:00-10:00: CHF 75 \u003cp>\nMon – Fri from 16:00-18:00: CHF 75 \u003cp>\nThe supervision time is not lesson time, only a time to be looked after. Painting materials, games and a supervisor are on site. Children are welcome to bring homework, their own books, comics etc. Playing on a mobile phone and watching films is expressly allowed. The supervision can only take place if there are enough registrations.","nrs":["FFA 21"]}],"bring":[{"value":"Drinks, food including lunch","nrs":["FFA 11","FFA 21"]}],"notes":[{"value":"When taking part in the course, an assignment of rights must be signed, as the filmed material cannot otherwise be used. For questions, please contact us at info@filmkids.ch. The assignment of rights can be downloaded at the following address: https://bit.ly/filmkids_rechtsabtretung_2020","nrs":["FFA 11","FFA 21"]}]},"variants":[{"id":30873,"nr":"FFA 11","venue":13,"price":420,"weekId":"3-1","dates":"5 Oct – 9 Oct 2026","days":"Monday to Friday","time":"10:00–16:00","start":10,"end":16,"from":"2026-10-05T10:00:00","to":"2026-10-09T16:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners","ageFrom":2011,"ageTo":2016,"age":"2011–2016","free":true},{"id":30877,"nr":"FFA 21","venue":13,"price":420,"weekId":"3-2","dates":"12 Oct – 16 Oct 2026","days":"Monday to Friday","time":"10:00–16:00","start":10,"end":16,"from":"2026-10-12T10:00:00","to":"2026-10-16T16:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners","ageFrom":2011,"ageTo":2016,"age":"2011–2016","free":true}]},{"id":30872,"title":"Filmschauspiel","category":"Tech & crafts","activity":"Science and technology","ageFrom":2011,"ageTo":2016,"ageLabel":"2011–2016","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"Beginners","details":{"texts":[{"value":"The course offers an introduction to the basics of acting and the particular features of acting for film. The children experiment playfully with their means of expression, slip into roles and try out their impact in front of the camera. Practice scenes are filmed and sent to the participants after the course.\nNo special prerequisites are needed to take part. What matters is curiosity and the desire to try things out.\n\u003cp>\nOn Friday at 15:00 the big cinema premiere takes place, where all participants from the filmkids holiday courses Animation Film, Action! and Film Acting present their films and projects. Parents, siblings and friends are warmly invited.\n\u003cp>\nImportant: In order to take part in the course, an assignment of rights is required so that the film and photo recordings made during the course may afterwards be made available to everyone and posted on our platforms (YouTube channel filmkidsCH, Facebook page, Instagram, website). You can find examples on our platforms. Please contact us directly if you have any questions.\nMore about us at \u003ca href=\"http://filmkids.ch/\" target=\"_blank\" rel=\"noopener noreferrer\">www.filmkids.ch\u003c/a>. \u003cp>\n\nOPTIONAL: 12 supervision places are available: \u003cp>\nMon – Fri from 08:00 – 10:00: CHF 75 \u003cp>\nMon – Fri from 16:00 – 18:00: CHF 75 \u003cp>\nThe supervision time is not teaching time, only drop-in care. Drawing materials, games and a supervisor are available on site. The children are welcome to bring homework, their own books, comics etc. Playing on a mobile phone and watching films are expressly allowed. Supervision can only take place if there are enough registrations.","nrs":["FSP 11","FSP 21"]}],"bring":[{"value":"Drinks, food including lunch","nrs":["FSP 11","FSP 21"]}],"notes":[{"value":"When taking part in the course, an assignment of rights must be signed, as the filmed material cannot otherwise be used. For questions, please contact us at info@filmkids.ch. The assignment of rights can be downloaded at the following address: https://bit.ly/filmkids_rechtsabtretung_2020","nrs":["FSP 11","FSP 21"]}]},"variants":[{"id":30872,"nr":"FSP 11","venue":13,"price":420,"weekId":"3-1","dates":"5 Oct – 9 Oct 2026","days":"Monday to Friday","time":"10:00–16:00","start":10,"end":16,"from":"2026-10-05T10:00:00","to":"2026-10-09T16:00:00","deadlin abtretung_2020","nrs":["FAF 12"]}]},"variants":[{"id":30875,"nr":"FAF 12","venue":13,"price":220,"weekId":"3-1","dates":"5 Oct – 9 Oct 2026","days":"Monday to Friday","time":"13:00–16:00","start":13,"end":16,"from":"2026-10-05T13:00:00","to":"2026-10-09T16:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners and advanced","ageFrom":2017,"ageTo":2020,"age":"2017–2020","free":true}]},{"id":31435,"title":"Freies Malen nach Arno Stern","category":"Tech & crafts","activity":"Crafts and making","ageFrom":2010,"ageTo":2020,"ageLabel":"2010–2020","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"","details":{"texts":[{"value":"This holiday course is aimed at children and young people who enjoy painting freely and experimenting with colours. The painting studio is run according to Arno Stern's theory. For painting, a large sheet of paper is hung on a wooden wall for each participant. In the middle there is a palette with 18 colours that everyone can use freely. This painting course is a place where you can give free rein to your own style and experiment with colours, shapes and different painting materials.\u003cp>\nThere is painting and a half-hour break outdoors. Painting without pressure and without assessment!\u003cp>\nMore information at: \u003ca href=\"http://decolor.ch/\" target=\"_blank\" rel=\"noopener noreferrer\">www.decolor.ch\u003c/a>","nrs":["FFM 11"]}],"bring":[{"value":"Slippers and a snack. Wear clothes that are allowed to get dirty, plus weather-appropriate clothing for the break.","nrs":["FFM 11"]}],"notes":[]},"variants":[{"id":31435,"nr":"FFM 11","venue":53,"price":260,"weekId":"3-1","dates":"5 Oct – 9 Oct 2026","days":"Monday to Friday","time":"09:00–12:00","start":9,"end":12,"from":"2026-10-05T09:00:00","to":"2026-10-09T12:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"","ageFrom":2010,"ageTo":2020,"age":"2010–2020","free":true}]},{"id":30060,"title":"Functional Training / Ninja-Camp","category":"Movement & fitness","activity":"Multi-sport","ageFrom":2012,"ageTo":2017,"ageLabel":"2012–2017","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"Beginners and advanced","details":{"texts":[{"value":"The morning starts with yoga and stretching exercises to improve your flexibility and mobility. After the warm-up, the programme includes team games, obstacle courses, high jump and long jump to promote physical fitness, teamwork and sporting ambition.\nThe afternoon is reserved for functional training with child-friendly weights as well as your own body weight. Stability and strength are developed. The ninja park provides variety and fun.","nrs":["NIMA 11","NIMA 21"]}],"bring":[{"value":"Sportswear, indoor shoes, morning snack, lunch and water","nrs":["NIMA 11","NIMA 21"]}],"notes":[{"value":"On the first day of the course, different age groups are formed on site so that the training can be adapted to the age.\nYou will be supervised over lunchtime, but you have to bring your lunch from home.\nThere are no changing rooms available; we ask you to arrive at the course already changed.","nrs":["NIMA 11","NIMA 21"]}]},"variants":[{"id":30060,"nr":"NIMA 11","venue":54,"price":250,"weekId":"3-1","dates":"5 Oct – 9 Oct 2026","days":"Monday to Friday","time":"10:00–15:00","start":10,"end":15,"from":"2026-10-05T10:00:00","to":"2026-10-09T15:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners and advanced","ageFrom":2012,"ageTo":2017,"age":"2012–2017","free":true},{"id":30088,"nr":"NIMA 21","venue":54,"price":250,"weekId":"3-2","dates":"12 Oct – 16 Oct 2026","days":"Monday to Friday","time":"10:00–15:00","start":10,"end":15,"from":"2026-10-12T10:00:00","to":"2026-10-16T15:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners and advanced","ageFrom":2012,"ageTo"
