<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zurich holiday courses</title>
<style>:root {
  color-scheme: light dark;
  --bg: #f6f7f9;
  --panel: #fff;
  --ink: #16181d;
  --muted: #666e7a;
  --line: #dfe3e8;
  --accent: #0b6bcb;
  --accent-soft: #e7f0fb;
  --star: #e8a317;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14161a;
    --panel: #1c1f25;
    --ink: #e8eaed;
    --muted: #9aa3ae;
    --line: #2c313a;
    --accent: #64a8f0;
    --accent-soft: #1d2c3d;
  }
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--ink);
}

h1 { font-size: 1.25rem; margin: 0; }

.topbar {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
  justify-content: space-between;
  padding: 12px 20px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
}
.sub { margin: 2px 0 0; color: var(--muted); font-size: .8rem; }
.topbar-stats { display: flex; align-items: center; gap: 12px; }
.count { font-variant-numeric: tabular-nums; color: var(--muted); font-size: .85rem; }

.layout {
  display: grid;
  grid-template-columns: 280px minmax(0, 1fr);
  gap: 20px;
  padding: 20px;
  align-items: start;
}
@media (max-width: 900px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .filters { position: static !important; }
}

.filters {
  position: sticky;
  top: 76px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding: 16px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  max-height: calc(100vh - 96px);
  overflow: auto;
}

.field { display: flex; flex-direction: column; gap: 5px; border: 0; padding: 0; margin: 0; min-width: 0; }
.field > span, .field > legend, .field label > span {
  font-size: .75rem;
  font-weight: 600;
  letter-spacing: .02em;
  text-transform: uppercase;
  color: var(--muted);
  padding: 0;
}
.field.two { flex-direction: row; gap: 10px; }
.field.two label { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 0; }

input[type=search], input[type=number], select {
  width: 100%;
  padding: 7px 9px;
  font: inherit;
  font-size: .9rem;
  color: var(--ink);
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 7px;
}
input[type=range] { width: 100%; accent-color: var(--accent); }
output { font-weight: 400; text-transform: none; color: var(--ink); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font: inherit;
  font-size: .8rem;
  padding: 4px 10px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--bg);
  color: var(--ink);
  cursor: pointer;
}
.chip[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: #fff; }
.chip .n { opacity: .6; margin-left: 4px; font-variant-numeric: tabular-nums; }
.chip[aria-pressed=true] .n { opacity: .8; }

.check { display: flex; align-items: center; gap: 8px; font-size: .85rem; }
.check input { accent-color: var(--accent); }
.badge-count {
  display: inline-block;
  min-width: 20px;
  text-align: center;
  padding: 0 6px;
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: .75rem;
  font-weight: 600;
}

.ghost {
  font: inherit;
  font-size: .82rem;
  padding: 6px 12px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--panel);
  color: var(--ink);
  cursor: pointer;
}
.ghost:hover { border-color: var(--accent); color: var(--accent); }

.toolbar {
  display: flex;
  align-items: end;
  gap: 12px;
  margin-bottom: 14px;
}
.toolbar label { display: flex; flex-direction: column; gap: 5px; }
.toolbar label span {
  font-size: .75rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .02em;
  color: var(--muted);
}
.toolbar select { width: auto; }

.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  margin-bottom: 10px;
  overflow: hidden;
}
.card.fav { border-color: var(--star); }

.card-head {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  gap: 12px;
  cursor: pointer;
  align-items: start;
  padding: 12px 14px;
}
.star {
  border: 0;
  background: none;
  font-size: 1.2rem;
  line-height: 1;
  cursor: pointer;
  padding: 2px;
  color: var(--line);
}
.star[aria-pressed=true] { color: var(--star); }

.card-title { margin: 0; font-size: 1rem; font-weight: 650; }
.card-title button {
  font: inherit;
  text-align: left;
  border: 0;
  background: none;
  padding: 0;
  color: inherit;
  cursor: pointer;
}
.card-title button:hover { color: var(--accent); }

.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.tag {
  font-size: .72rem;
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--accent);
  white-space: nowrap;
}
.tag.plain { background: var(--bg); color: var(--muted); }
.tag.girls { background: #fbe7f3; color: #a3266f; }
@media (prefers-color-scheme: dark) { .tag.girls { background: #3b2131; color: #f0a8cf; } }

.card-facts {
  text-align: right;
  font-size: .82rem;
  color: var(--muted);
  white-space: nowrap;
}
.card-facts strong { display: block; font-size: .95rem; color: var(--ink); font-variant-numeric: tabular-nums; }

.card-body { padding: 0 14px 14px; border-top: 1px solid var(--line); margin-top: 2px; overflow-x: auto; }
.desc { font-size: .88rem; color: var(--muted); margin: 10px 0; }
.desc p { margin: 0 0 .5em; }
.desc a { color: var(--accent); }
.note { font-size: .82rem; margin: 6px 0; }
.note b { color: var(--ink); }

.desc + .desc { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line); }

table.slots tr.expandable { cursor: pointer; }
table.slots tr.expandable:hover > td { background: var(--accent-soft); }
.caret { color: var(--muted); }
tr.detail-row > td { background: var(--bg); padding: 4px 12px 12px; }
tr.detail-row .desc { margin: 6px 0; }
table.slots tr.closed > td { opacity: .5; }

table.slots { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: .84rem; }
table.slots th {
  text-align: left;
  font-size: .7rem;
  text-transform: uppercase;
  letter-spacing: .02em;
  color: var(--muted);
  padding: 4px 8px 4px 0;
  border-bottom: 1px solid var(--line);
}
table.slots td { padding: 7px 8px 7px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
table.slots tr:last-child td { border-bottom: 0; }
table.slots .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
table.slots a { color: var(--accent); }
.venue-sub { color: var(--muted); font-size: .78rem; }
.empty p { margin: 0 0 6px; }
.empty-detail { font-size: .85rem; }
.empty .ghost { margin-top: 10px; }

.empty { padding: 40px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-main">
    <h1>Zurich holiday courses</h1>
    <p class="sub">Straight-line distance from <strong id="home-label"></strong></p>
  </div>
  <div class="topbar-stats">
    <span id="count" class="count"></span>
    <button id="reset" class="ghost" type="button">Clear filters <span id="active-count" class="badge-count"></span></button>
  </div>
</header>

<div class="layout">
  <aside class="filters" id="filters">
    <label class="field">
      <span>Search</span>
      <input type="search" id="f-q" placeholder="Title, venue, description, course no.">
    </label>

    <fieldset class="field">
      <legend>Holiday week</legend>
      <div id="f-weeks" class="chips"></div>
    </fieldset>

    <fieldset class="field">
      <legend>Category</legend>
      <div id="f-cats" class="chips"></div>
    </fieldset>

    <label class="field">
      <span>Activity</span>
      <select id="f-activity"></select>
    </label>

    <label class="field">
      <span>Child's year of birth</span>
      <input type="number" id="f-year" min="2000" max="2026" step="1" placeholder="e.g. 2016" list="years">
      <datalist id="years"></datalist>
    </label>

    <label class="field">
      <span>Max. distance <output id="o-km"></output></span>
      <input type="range" id="f-km" min="0" max="10" step="0.5" value="10">
    </label>

    <label class="field">
      <span>Max. price <output id="o-price"></output></span>
      <input type="range" id="f-price" min="0" max="700" step="10" value="700">
    </label>

    <div class="field two">
      <label>
        <span>Starts at or after</span>
        <select id="f-start"></select>
      </label>
      <label>
        <span>Ends by</span>
        <select id="f-end"></select>
      </label>
    </div>

    <label class="field">
      <span>Level</span>
      <select id="f-level"></select>
    </label>

    <label class="field">
      <span>Who it's for</span>
      <select id="f-gender">
        <option value="">Anyone</option>
        <option value="Girls only">Girls only</option>
        <option value="Girls and boys">Mixed groups</option>
      </select>
    </label>

    <label class="check">
      <input type="checkbox" id="f-bookable">
      <span>Only dates still open</span>
    </label>

    <label class="check">
      <input type="checkbox" id="f-fav">
      <span>Only favourites <span id="fav-count" class="badge-count"></span></span>
    </label>
  </aside>

  <main>
    <div class="toolbar">
      <label>
        <span>Sort by</span>
        <select id="f-sort">
          <option value="distance">Distance</option>
          <option value="price-asc">Price, low to high</option>
          <option value="price-desc">Price, high to low</option>
          <option value="date">Start date</option>
          <option value="title">Title</option>
          <option value="category">Category</option>
          <option value="age">Age (youngest first)</option>
        </select>
      </label>
      <button id="expand-all" class="ghost" type="button">Show all dates</button>
    </div>
    <div id="results"></div>
  </main>
</div>

16:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"","ageFrom":2014,"ageTo":2017,"age":"2014–2017","free":true}]},{"id":30892,"title":"Abenteuer Fotografie – Deine kreative Reise mit der Kamera","category":"Tech & crafts","activity":"Science and technology","ageFrom":2014,"ageTo":2019,"ageLabel":"2014–2019","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"Beginners and advanced","details":{"texts":[{"value":"Do you want to become a photo pro? For a whole week a real photo studio is yours. With big spotlights, colourful lights, wind machines, soap bubbles and crazy props you can experiment creatively and conjure up exciting photos. Every day you learn something new: How does light change your photo? What makes a cool perspective? How do you tell stories with pictures? You train your eye and learn how to handle professional cameras and lenses. Always there too: Charlie, our studio dog. In your own photo learning booklet you collect everything you learn and take it home with you at the end.\n\u003cp>In the afternoons we head out and the city becomes your personal photo safari. We visit the costume department of the Opernhaus Zürich: there you see where the costumes for the big stage productions are made, photograph them – and get to know a building that hardly anyone else is allowed to look inside. Another day is all about mobility: we take a look inside a real VBZ tram depot and photograph the trams up close.\n\u003cp>Then there are the animals on the farm, close-ups in the Botanical Garden and portraits. You can even approach people in the street who will spontaneously model for you – real street photography. In between we play, laugh a lot and get moving outdoors. So that you are well looked after, there is always one leader for every 5 children.\n\u003cp>By the end of the week you are a real photo pro. You present your favourite picture at a proper vernissage for your whole family, with your own diploma.\n\u003cp>Whether you already have experience or are just starting out, all children are welcome. And you will meet lots of new people.","nrs":["FLO 11","FLO 21"]}],"bring":[{"value":"Your own camera (mobile phone or digital camera); if you don't have one, please contact the course leader (verein@fotokids.ch ).","nrs":["FLO 11","FLO 21"]}],"notes":[{"value":"Early and late care is available (from 08:00 to 18:00). Healthy, balanced snacks, morning and afternoon snacks and a fresh warm vegetarian lunch are included.","nrs":["FLO 11","FLO 21"]}]},"variants":[{"id":30892,"nr":"FLO 11","venue":1,"price":490,"weekId":"3-1","dates":"5 Oct – 9 Oct 2026","days":"Monday to Friday","time":"10:00–16:00","start":10,"end":16,"from":"2026-10-05T10:00:00","to":"2026-10-09T16:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners and advanced","ageFrom":2014,"ageTo":2019,"age":"2014–2019","free":true},{"id":30893,"nr":"FLO 21","venue":1,"price":490,"weekId":"3-2","dates":"12 Oct – 16 Oct 2026","days":"Monday to Friday","time":"10:00–16:00","start":10,"end":16,"from":"2026-10-12T10:00:00","to":"2026-10-16T16:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners and advanced","ageFrom":2014,"ageTo":2019,"age":"2014–2019","free":true}]},{"id":30637,"title":"Abenteuer Herbstwald","category":"Nature & adventure","activity":"Nature and adventure","ageFrom":2018,"ageTo":2021,"ageLabel":"2018–2021","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"","details":{"texts":[{"value":"\u003cstrong> A colourful autumn full of adventures in the forest \u003c/strong>\n\u003cp>\nDo you love nature and are you looking for exciting experiences? Countless possibilities await you in the autumn forest: whittle with a pocket knife, craft with natural materials or build your own hut. Every day we light a campfire and cook a tasty lunch on it together.\u003cp>\nBesides all the creative activities, there is plenty of time to enjoy the colourful autumn forest to the full – playing, listening to stories or simply letting the calm of nature work its magic. \u003cp>\nWith the experienced nature educators of the Woodruff association, we will experience three varied days full of adventure and discovery. \u003cp>\nThis course is aimed at children from the second year of kindergarten up to and including 3rd grade.","nrs":["FHW 11"]}],"bring":[{"value":"Clothing suited to the weather and sturdy shoes. Bring your own morning snack; we will cook lunch and the afternoon snack together over the fire. Your own plate/Tupperware + cutlery. Thermos flask filled with ready-to-drink tea/punch. A pocket knife if you have one. Detailed information will follow by e-mail after registration, about 1 week before the camp starts.","nrs":["FHW 11"]}],"notes":[{"value":"This course is aimed at children born in 2021 who have already completed the first year of kindergarten.","nrs":["FHW 11"]}]},"variants":[{"id":30637,"nr":"FHW 11","venue":2,"price":260,"weekId":"3-1","dates":"5 Oct – 7 Oct 2026","days":"Monday to Wednesday","time":"09:00–16:00","start":9,"end":16,"from":"2026-10-05T09:00:00","to":"2026-10-07T16:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"","ageFrom":2018,"ageTo":2021,"age":"2018–2021","free":true}]},{"id":30967,"title":"Abenteuerspielplatz Buntspecht: Aus Alt mach Neu!","category":"Tech & crafts","activity":"Crafts and making","ageFrom":2014,"ageTo":2019,"ageLabel":"2014–2019","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"","details":{"texts":[{"value":"Do you like being outdoors and deciding for yourself how you want to spend your time? Then you've come to the right place.\u003cbr>\nOur theme: Turning old into new!\u003cbr>\nTogether we will give our garden house a fresh, colourful look. With paints, brushes and lots of creativity, we will redesign the old hut and make it shine in new splendour. You can contribute your ideas, design patterns and actively help shape it. Step by step, a unique communal work of art will emerge. As always, we will keep building our big communal ship. Are you ready?\u003cbr>\nYou can also climb, relax and build sandcastles. It will definitely be exciting. We will make a fire on which you can cook the food you bring along, weather permitting. Snacks are provided.","nrs":["FBU 21"]}],"bring":[{"value":"Your lunch, your own water bottle, clothing suited to the weather, sturdy shoes (e.g. trekking shoes)","nrs":["FBU 21"]}],"notes":[{"value":"The meeting point is directly at the Buntspecht adventure playground. The course officially runs from 09:30-16:00. However, drop-off and pick-up times from 09:00-09:30 and 16:00-17:00 are available. Please inform the course leaders in good time about any illnesses or allergies relevant to the course.","nrs":["FBU 21"]}]},"variants":[{"id":30967,"nr":"FBU 21","venue":3,"price":250,"weekId":"3-2","dates":"13 Oct – 15 Oct 2026","days":"Tuesday to Thursday","time":"09:30–16:00","start":9.5,"end":16,"from":"2026-10-13T09:30:00","to":"2026-10-15T16:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"","ageFrom":2014,"ageTo":2019,"age":"2014–2019","free":true}]},{"id":30630,"title":"Abenteuerspielplatz Wald","category":"Nature & adventure","activity":"Nature and adventure","ageFrom":2015,"ageTo":2018,"ageLabel":"2015–2018","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"","details":{"texts":[{"value":"Have you ever struck sparks and started a fire with them, without any newspaper or lighter? Or would you like to explore the forest from the perspective of a wild boar or a millipede? Maybe you want to build a hut out of branches between the trees? Or simply let off steam with a fun game of tag? We are out and about all week long: we whittle and build, investigate and play together in the forest. You will experience an exciting week in the forest led by nature educators and forest experts from the Rucksackschule Zürich.","nrs":["FAW 11"]}],"bring":[{"value":"Weather-appropriate clothing and good footwear. Sun or rain protection. Morning snack. Drinking bottle filled with water (at least 0.5 litres). Depending on the daily programme, lunch (detailed information will follow after registration).","nrs":["FAW 11"]}],"notes":[{"value":"Meeting point: tram stop \"Zoo Zürich\" (transport: tram number 6 and bus 39 to the \"Zoo Zürich\" stop).\nChildren born in 2019 who already have experience in the forest can also take part in the course. If you are interested, please contact the Sportamt.","nrs":["FAW 11"]}]},"variants":[{"id":30630,"nr":"FAW 11","venue":4,"price":305,"weekId":"3-1","dates":"5 Oct – 9 Oct 2026","days":"Monday to Friday","time":"09:00–16:00","start":9,"end":16,"from":"2026-10-05T09:00:00","to":"2026-10-09T16:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"","ageFrom":2015,"ageTo":2018,"age":"2015–2018","free":true}]},{"id":30940,"title":"ACADEMICUS Olympische Spiele auf Deutsch und Englisch","category":"Movement & fitness","activity":"Multi-sport","ageFrom":2018,"ageTo":2021,"ageLabel":"2018–2021","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"Beginners and advanced","details":{"texts":[{"value":"Academicus is running an exciting course about the Olympic Games for children aged 5-8!\nAt our Olympia camp we'll learn a lot about the Olympic Games, in theory and in practice, in German and in English. Every day we'll discover new sports and compete in friendly contests. Badminton, mini golf, football, races as well as Olympic torches, friendship bracelets, medals and much more await you. Sport, culture and crafts, in English and in German. Join our bilingual camp this autumn and become a gold medallist every day while practising two languages and many sports.","nrs":["FOS 11"]}],"bring":[{"value":"Children bring their own lunch, snacks and water bottles, as well as comfortable clothing and a change of clothes.","nrs":["FOS 11"]}],"notes":[{"value":"Basic knowledge of English is required.","nrs":["FOS 11"]}]},"variants":[{"id":30940,"nr":"FOS 11","venue":5,"price":400,"weekId":"3-1","dates":"5 Oct – 9 Oct 2026","days":"Monday to Friday","time":"10:00–16:00","start":10,"end":16,"from":"2026-10-05T10:00:00","to":"2026-10-09T16:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners and advanced","ageFrom":2018,"ageTo":2021,"age":"2018–2021","free":true}]},{"id":30937,"title":"Adventures in Robotics","category":"Tech & crafts","activity":"Science and technology","ageFrom":2019,"ageTo":2021,"ageLabel":"2019–2021","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"Beginners","details":{"texts":[{"value":"These workshops are aimed at children aged 5 to 7 and are perfect for introducing girls and boys to the concepts of robotics and technology! They are taught in German and English. The children work with Thymio II learning robots to discover how robots work and how they use sensors to explore the world around them.","nrs":["FRO 11","FRO 12"]}],"bring":[{"value":"Children must bring their own snack and their own water bottle. Food and drinks are not provided.\nWe take a break at the Engetreff playground every day. All breaks take place outdoors in any weather, so suitable clothing is required. Indoor shoes are recommended.","nrs":["FRO 11","FRO 12"]}],"notes":[]},"variants":[{"id":30937,"nr":"FRO 11","venue":6,"price":340,"weekId":"3-1","dates":"5 Oct – 9 Oct 2026","days":"Monday to Friday","time":"08:30–12:00","start":8.5,"end":12,"from":"2026-10-05T08:30:00","to":"2026-10-09T12:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners","ageFrom":2019,"ageTo":2021,"age":"2019–2021","free":true},{"id":30944,"nr":"FRO 12","venue":6,"price":340,"weekId":"3-1","dates":"5 Oct – 9 Oct 2026","days":"Monday to Friday","time":"13:00–16:30","start":13,"end":16.5,"from":"2026-10-05T13:00:00","to":"2026-10-09T16:30:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners","ageFrom":2019,"ageTo":2021,"age":"2019–2021","free":true}]},{"id":31113,"title":"AI Creator Lab","category":"Tech & crafts","activity":"Science and technology","ageFrom":2014,"ageTo":2017,"ageLabel":"2014–2017","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"Beginners","details":{"texts":[{"value":"How are logos, websites and digital ideas created – and how can artificial intelligence help? In this camp, children discover the creative side of AI and digital design.\n\u003cp>In the first half of the week, everyone works together on the project «Climate Action for Kids»: they design logos, titles and visual worlds, learn the basics of colour, typography and layout, and try out AI-supported design tools. After that, the children realise their own idea – from the first sketch to the finished, self-published website.\n\u003cp>Along the way, they learn to handle AI and their own content responsibly: What is reliable? What am I allowed to show? At the end, every child presents their project – and takes home lots of new skills.","nrs":["FKI 11"]}],"bring":[],"notes":[]},"variants":[{"id":31113,"nr":"FKI 11","venue":7,"price":350,"weekId":"3-1","dates":"5 Oct – 9 Oct 2026","days":"Monday to Friday","time":"09:00–12:30","start":9,"end":12.5,"from":"2026-10-05T09:00:00","to":"2026-10-09T12:30:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners","ageFrom":2014,"ageTo":2017,"age":"2014–2017","free":true}]},{"id":30901,"title":"Aikido","category":"Martial arts","activity":"Aikido","ageFrom":2010,"ageTo":2016,"ageLabel":"2010–2016","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"Beginners and advanced","details":{"texts":[{"value":"Feel your strength, find your balance and discover how much power there is in working together! In our week-long Aikido course you learn to move with calm, concentration and suppleness – entirely without competition or violence. Aikido is a modern Japanese martial art that gets you physically fit and mentally strong. Whether you already have martial arts experience or are completely new: this week is full of movement, fun and pure team spirit!\u003cp>\n What awaits you: \n• Dynamic Aikido exercises and safe falling techniques\n• Partner training built on trust and respect\n• Games and coordination exercises for body awareness and stamina\n• Insights into the philosophy and attitude of Aikido","nrs":["AIK 11"]}],"bring":[{"value":"Sports clothing, a drink and a morning snack","nrs":["AIK 11"]}],"notes":[]},"variants":[{"id":30901,"nr":"AIK 11","venue":8,"price":150,"weekId":"3-1","dates":"5 Oct – 9 Oct 2026","days":"Monday to Friday","time":"09:00–12:00","start":9,"end":12,"from":"2026-10-05T09:00:00","to":"2026-10-09T12:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners and advanced","ageFrom":2010,"ageTo":2016,"age":"2010–2016","free":true}]},{"id":30133,"title":"Akrobatik","category":"Movement & fitness","activity":"Acrobatics","ageFrom":2014,"ageTo":2020,"ageLabel":"2014–2020","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"Beginners and advanced","details":{"texts":[{"value":"Dive roll, cartwheel, pyramids. We train acrobatics for a whole week. You learn great tricks or can improve the skills you already have. Games, fun and training await you! No previous experience is needed – your interest in acrobatics is all you have to bring.","nrs":["AKR 21","AKR 22"]}],"bring":[{"value":"Sports clothing, gym slippers, socks or barefoot. Drink and afternoon snack","nrs":["AKR 21","AKR 22"]}],"notes":[]},"variants":[{"id":30133,"nr":"AKR 21","venue":9,"price":100,"weekId":"3-2","dates":"12 Oct – 16 Oct 2026","days":"Monday to Friday","time":"10:00–12:00","start":10,"end":12,"from":"2026-10-12T10:00:00","to":"2026-10-16T12:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners and advanced","ageFrom":2014,"ageTo":2020,"age":"2014–2020","free":true},{"id":30134,"nr":"AKR 22","venue":9,"price":100,"weekId":"3-2","dates":"12 Oct – 16 Oct 2026","days":"Monday to Friday","time":"13:00–15:00","start":13,"end":15,"from":"2026-10-12T13:00:00","to":"2026-10-16T15:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners and advanced","ageFrom":2014,"ageTo":2020,"age":"2014–2020","free":true}]},{"id":30103,"title":"Akrobatik / Jonglage / Diabolo","category":"Movement & fitness","activity":"Acrobatics","ageFrom":2017,"ageTo":2020,"ageLabel":"2017–2020","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"Beginners and advanced","details":{"texts":[{"value":"You will get to know the basics of floor and partner acrobatics and practise various human pyramids, juggling and diabolo. Every beginning is hard, but practice makes perfect.","nrs":["AKR 11","AKR 12"]}],"bring":[{"value":"Close-fitting gym clothes (leggings and possibly a leotard), gymnastics shoes and a drink.","nrs":["AKR 11","AKR 12"]}],"notes":[]},"variants":[{"id":30103,"nr":"AKR 11","venue":10,"price":100,"weekId":"3-1","dates":"5 Oct – 9 Oct 2026","days":"Monday to Friday","time":"10:00–12:00","start":10,"end":12,"from":"2026-10-05T10:00:00","to":"2026-10-09T12:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners and advanced","ageFrom":2017,"ageTo":2020,"age":"2017–2020","free":true},{"id":30104,"nr":"AKR 12","venue":10,"price":100,"weekId":"3-1","dates":"5 Oct – 9 Oct 2026","days":"Monday to Friday","time":"13:00–15:00","start":13,"end":15,"from":"2026-10-05T13:00:00","to":"2026-10-09T15:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners and advanced","ageFrom":2017,"ageTo":2020,"age":"2017–2020","free":true}]},{"id":31032,"title":"Akrobatik / Tonen","category":"Combined courses","activity":"—","ageFrom":2017,"ageTo":2020,"ageLabel":"2017–2020","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"Beginners","details":{"texts":[{"value":"In the morning, after a short warm-up plus strength and stretching exercises, you get to know floor acrobatics and practise rolls, headstands and handstands. In the afternoon you can give free rein to your ideas for creations in clay.","nrs":["AKTO 11"]}],"bring":[{"value":"Close-fitting gym clothes, gymnastics shoes (gym slippers), apron (not a plastic one), lunch and a drink.","nrs":["AKTO 11"]}],"notes":[{"value":"Firing the clay works is up to the participants and is not included in the course. You will be supervised over lunchtime, but you need to bring your lunch from home.","nrs":["AKTO 11"]}]},"variants":[{"id":31032,"nr":"AKTO 11","venue":10,"price":250,"weekId":"3-1","dates":"5 Oct – 9 Oct 2026","days":"Monday to Friday","time":"10:00–14:30","start":10,"end":14.5,"from":"2026-10-05T10:00:00","to":"2026-10-09T14:30:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners","ageFrom":2017,"ageTo":2020,"age":"2017–2020","free":true}]},{"id":30048,"title":"Akrobatik & Clownerie","category":"Movement & fitness","activity":"Acrobatics","ageFrom":2017,"ageTo":2020,"ageLabel":"2017–2020","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"Beginners and advanced","details":{"texts":[{"value":"In the morning we roll, hop and dance through the room together, we do cartwheels, learn handstands and build human pyramids. In a playful, dance-like way we will try out acrobatic movement sequences and put them together. In the afternoon you play the clown, laugh during improv theatre games and invent new, colourful sketches.","nrs":["AKCL 11","AKCL 21"]}],"bring":[{"value":"Close-fitting gym clothes, gymnastics shoes (gym slippers), morning snack, lunch and a drink","nrs":["AKCL 11"]},{"value":"Close-fitting gym clothes, gymnastics shoes (gym slippers)\nFor food: a morning snack, lunch and a drink.","nrs":["AKCL 21"]}],"notes":[{"value":"You will be supervised over lunchtime, but you need to bring your lunch from home.","nrs":["AKCL 11","AKCL 21"]}]},"variants":[{"id":30048,"nr":"AKCL 11","venue":11,"price":220,"weekId":"3-1","dates":"5 Oct – 9 Oct 2026","days":"Monday to Friday","time":"10:00–15:00","start":10,"end":15,"from":"2026-10-05T10:00:00","to":"2026-10-09T15:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners and advanced","ageFrom":2017,"ageTo":2020,"age":"2017–2020","free":true},{"id":30074,"nr":"AKCL 21","venue":10,"price":220,"weekId":"3-2","dates":"12 Oct – 16 Oct 2026","days":"Monday to Friday","time":"10:00–15:00","start":10,"end":15,"from":"2026-10-12T10:00:00","to":"2026-10-16T15:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners and advanced","ageFrom":2017,"ageTo":2020,"age":"2017–2020","free":true}]},{"id":30950,"title":"Alles über die Bienen","category":"Nature & adventure","activity":"Nature and adventure","ageFrom":2014,"ageTo":2019,"ageLabel":"2014–2019","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"","details":{"texts":[{"value":"Experience the fascinating world of bees and find out more about their secrets!\u003cp>\n \nWith games and fun you will learn all about bees. Wearing a protective suit, you can get really close to the bees, help out at the hive and experience the different bees in the colony. We will show you the queen, the workers and the drones. Together we will make a lip balm and candles from beeswax that you can take home with you. To finish, there will be a tasty honey-bread afternoon snack.","nrs":["FWB 11"]}],"bring":[{"value":"Lunch (tap water is available on site), weather-appropriate clothing, long trousers - e.g. jeans, closed shoes - e.g. trainers","nrs":["FWB 11"]}],"notes":[]},"variants":[{"id":30950,"nr":"FWB 11","venue":12,"price":55,"weekId":"3-1","dates":"6 Oct 2026","days":"Tuesday","time":"10:00–15:00","start":10,"end":15,"from":"2026-10-06T10:00:00","to":"2026-10-06T15:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"","ageFrom":2014,"ageTo":2019,"age":"2014–2019","free":true}]},{"id":30874,"title":"Animationsfilm","category":"Tech & crafts","activity":"Science and technology","ageFrom":2013,"ageTo":2019,"ageLabel":"2013–2019","mixedAges":true,"mixedLevels":false,"gender":"Girls and boys","level":"Beginners and advanced","details":{"texts":[{"value":"In this course you will find out how animated images are created and learn various animation techniques such as cut-out animation, puppet animation and pixilation. We work magic with paints, paper, plasticine and objects – even with our own bodies – and thus create a short film story. After the workshop you will also be able to create your own animated films on your own phone or tablet.\n\u003cp>\nImportant: In order to take part in the course, an assignment of rights is required so that the animated films made during the course may afterwards be made available to everyone and posted on our platforms (YouTube channel filmkidsCH, Facebook page, Instagram, website). Please contact us directly if you have any questions.\n\u003cp>\nMore about us at \u003ca href=\"http://filmkids.ch/\" target=\"_blank\" rel=\"noopener noreferrer\">www.filmkids.ch\u003c/a>.\n\u003cp>\nOPTIONAL: 12 supervision places are available: \u003cp>\nMon – Fri from 08:00 – 10:00: CHF 75 \u003cp>\n\nThe supervision time is not teaching time, only drop-in care. Drawing materials, games and a supervisor are available on site. The children are welcome to bring homework, their own books, comics etc. Playing on a mobile phone and watching films are expressly allowed. Supervision can only take place if there are enough registrations.","nrs":["FAF 11","FAF 21","FAF 22"]}],"bring":[{"value":"Drink, snack","nrs":["FAF 11","FAF 21","FAF 22"]}],"notes":[{"value":"When taking part in the course, an assignment of rights must be signed, as the filmed material cannot otherwise be used. For questions, please contact us at info@filmkids.ch. The assignment of rights can be downloaded at the following address: https://bit.ly/filmkids_rechtsabtretung_2020","nrs":["FAF 11","FAF 21","FAF 22"]}]},"variants":[{"id":30874,"nr":"FAF 11","venue":13,"price":220,"weekId":"3-1","dates":"5 Oct – 9 Oct 2026","days":"Monday to Friday","time":"09:00–12:00","start":9,"end":12,"from":"2026-10-05T09:00:00","to":"2026-10-09T12:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners and advanced","ageFrom":2013,"ageTo":2019,"age":"2013–2019","free":true},{"id":30879,"nr":"FAF 21","venue":13,"price":220,"weekId":"3-2","dates":"12 Oct – 16 Oct 2026","days":"Monday to Friday","time":"09:00–12:00","start":9,"end":12,"from":"2026-10-12T09:00:00","to":"2026-10-16T12:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners and advanced","ageFrom":2013,"ageTo":2018,"age":"2013–2018","free":true},{"id":30880,"nr":"FAF 22","venue":13,"price":220,"weekId":"3-2","dates":"12 Oct – 16 Oct 2026","days":"Monday to Friday","time":"13:30–16:30","start":13.5,"end":16.5,"from":"2026-10-12T13:30:00","to":"2026-10-16T16:30:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners and advanced","ageFrom":2013,"ageTo":2018,"age":"2013–2018","free":true}]},{"id":30135,"title":"Artistic Swimming (Synchronschwimmen)","category":"Water sports","activity":"Synchronised swimming","ageFrom":2018,"ageTo":2020,"ageLabel":"2018–2020","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"Beginners","details":{"texts":[{"value":"Are you a water baby who loves moving to music in the water? Then artistic swimming (synchronised swimming) is just right for you. During the course you get to know the basics of this sport in a playful way.","nrs":["ASW 21"]}],"bring":[{"value":"Swimwear, bath towel, swimming cap, goggles","nrs":["ASW 21"]}],"notes":[{"value":"Participants must meet the swimming goals of the 1st grade (Frosch test badge).","nrs":["ASW 21"]}]},"variants":[{"id":30135,"nr":"ASW 21","venue":14,"price":90,"weekId":"3-2","dates":"12 Oct – 16 Oct 2026","days":"Monday to Friday","time":"09:30–11:00","start":9.5,"end":11,"from":"2026-10-12T09:30:00","to":"2026-10-16T11:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners","ageFrom":2018,"ageTo":2020,"age":"2018–2020","free":true}]},{"id":31486,"title":"Artworkshop: Entdecken, Experimentieren & Gestalten im Malatelier","category":"Tech & crafts","activity":"Crafts and making","ageFrom":2015,"ageTo":2018,"ageLabel":"2015–2018","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"","details":{"texts":[{"value":"In this art workshop we set off on a creative journey of discovery. Instead of working towards a finished end product, playful experimentation is at the heart of what we do. We experiment with different themes and materials in the painting studio, on the wall or at the table. You'll be given concrete impulses, but you'll always have the freedom to realise your own ideas or to spend longer on a theme that particularly fascinates you. Depending on the weather, we'll move our studio outdoors: we'll work in the open air and discover together which works of art are hidden nearby in public space. \u003cp>\nThe joy of creative work is always the top priority. Throughout the workshop you will be supported individually and professionally by the artist Laura Badertscher.","nrs":["FGM 11"]}],"bring":[{"value":"Picnic lunch, water bottle, painting apron, clothes that are allowed to get dirty and are suitable for the weather so that we can also spend time outdoors","nrs":["FGM 11"]}],"notes":[]},"variants":[{"id":31486,"nr":"FGM 11","venue":15,"price":480,"weekId":"3-2","dates":"13 Oct – 16 Oct 2026","days":"Tuesday to Friday","time":"09:00–15:00","start":9,"end":15,"from":"2026-10-13T09:00:00","to":"2026-10-16T15:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"","ageFrom":2015,"ageTo":2018,"age":"2015–2018","free":true}]},{"id":31416,"title":"Auf dem Huebhof mit Kuh, Ziege, Ente & Huhn","category":"Nature & adventure","activity":"Nature and adventure","ageFrom":2017,"ageTo":2021,"ageLabel":"2017–2021","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"","details":{"texts":[{"value":"The Huebhof invites all animal-loving children to experience the colourful life on a farm up close. The children help out in the stable, feed the animals, watch and pet them, and learn about life on a farm along the way.","nrs":["FHH 11"]}],"bring":[{"value":"Afternoon snack, water bottle, weather-appropriate clothing that is allowed to get dirty.","nrs":["FHH 11"]}],"notes":[]},"variants":[{"id":31416,"nr":"FHH 11","venue":16,"price":45,"weekId":"3-1","dates":"6 Oct 2026","days":"Tuesday","time":"14:00–17:00","start":14,"end":17,"from":"2026-10-06T14:00:00","to":"2026-10-06T17:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"","ageFrom":2017,"ageTo":2021,"age":"2017–2021","free":true}]},{"id":31472,"title":"Auf der magischen Insel","category":"Tech & crafts","activity":"Crafts and making","ageFrom":2014,"ageTo":2022,"ageLabel":"2014–2022","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"","details":{"texts":[{"value":"On this afternoon you can discover a magical island during a short fantasy journey. Afterwards you can paint what you experienced on this adventurous journey with paints on large sheets of paper. And you can design your island out of clay and other materials, as imaginatively as you like. If there are also pirates, animals or mermaids there, for example, we can craft those too. At the end you can take your works home and dream of further adventures.\u003cbr>\nMore information at: \n\u003ca href=\"https://www.malspielraum.ch/\" target=\"_blank\" rel=\"noopener noreferrer\">www.nuori.ch\u003c/a> \n\u003cp> To take part in this course you must already be attending kindergarten.","nrs":["FMI 21"]}],"bring":[{"value":"Afternoon snack","nrs":["FMI 21"]}],"notes":[{"value":"To take part in this course you must already be attending kindergarten.\nPainting aprons and shoes are available in the studio","nrs":["FMI 21"]}]},"variants":[{"id":31472,"nr":"FMI 21","venue":17,"price":50,"weekId":"3-2","dates":"16 Oct 2026","days":"Friday","time":"14:00–16:00","start":14,"end":16,"from":"2026-10-16T14:00:00","to":"2026-10-16T16:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"","ageFrom":2014,"ageTo":2022,"age":"2014–2022","free":true}]},{"id":30050,"title":"Badminton-Camp","category":"Ball sports","activity":"Badminton","ageFrom":2012,"ageTo":2018,"ageLabel":"2012–2018","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"Beginners","details":{"texts":[{"value":"Badminton is the fastest racket sport in the world - learn this dynamic game with our experienced coaching team led by coach Andrew Dabeka, former world number 20 and Olympic participant.\nYou spend half the day in the hall playing badminton and the other half with various other sports, outdoors too.\nBadminton is incredibly good fun and, especially for children, very quick to learn - so sign up now for this great camp from Badminton Club ":"2026-10-05T09:30:00","to":"2026-10-09T10:30:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners","ageFrom":2018,"ageTo":2021,"age":"2018–2021","free":true}]},{"id":30049,"title":"Basketball-Camp","category":"Ball sports","activity":"Basketball","ageFrom":2010,"ageTo":2019,"ageLabel":"2010–2019","mixedAges":true,"mixedLevels":false,"gender":"Girls and boys","level":"Beginners and advanced","details":{"texts":[{"value":"Boost your basketball skills at the GC Zürich Basketball Akademie! Whether you're just starting out or already advanced – our top coaches from the Swiss Basketball League and the national junior leagues are committed to increasing your enjoyment of the game and perfecting your technique.","nrs":["BACA 11","BACA 21"]},{"value":"The BÖLLE camp is not only about training and improving basketball skills, but also about strengthening self-confidence, team spirit and perseverance. You will be encouraged to grow beyond your limits and to present yourself as a strong and confident athlete.\u003cbr>Follow us on Instagram for an insight into the world of BÖLLE \u003ca href=\"http://boelleischlebe.com/\" target=\"_blank\" rel=\"noopener noreferrer\">www.boelleischlebe.com\u003c/a>","nrs":["BASC 11"]},{"value":"With our coaches from the USA with college basketball experience, as well as international professional basketball players, everyone will improve their skills! Whether beginner or advanced, everyone benefits from the full-day camp. Follow us\non Instagram for an insight into the world of BÖLLE \u003ca href=\"http://boelleischlebe.com/\" target=\"_blank\" rel=\"noopener noreferrer\">www.boelleischlebe.com\u003c/a>","nrs":["BASC 21"]}],"bring":[{"value":"Sports clothing, indoor shoes, basketball, drinking bottle (lunch is included in the course price)","nrs":["BACA 11","BACA 21"]},{"value":"Sports clothing, indoor shoes, lunch, water bottle","nrs":["BASC 11","BASC 21"]}],"notes":[{"value":"Lunch and ":"Bauspielplatz Zürich Affoltern: Bauen, Spiel und Spass","category":"Nature & adventure","activity":"Nature and adventure","ageFrom":2015,"ageTo":2020,"ageLabel":"2015–2020","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"","details":{"texts":[{"value":"Would you like to build great huts out of wood? Then come and join us at the adventure building playground during the holidays. Under the guidance of our playground leaders, you will learn how to handle real tools. Besides sawing and hammering, there is plenty of time for games and fun. We are outdoors in the fresh air all day.","nrs":["FTB 21"]}],"bring":[{"value":"Lunch. Sturdy shoes and clothing","nrs":["FTB 21"]}],"notes":[{"value":"We provide the morning snack and the afternoon snack. Please bring your own lunch. You can grill sausages/bread on a stick etc. over our fire pit. Please let us know about any food intolerances.","nrs":["FTB 21"]}]},"variants":[{"id":30951,"nr":"FTB 21","venue":22,"price":130,"weekId":"3-2","dates":"15 Oct – 16 Oct 2026","days":"Thursday to Friday","time":"09:00–16:00","start":9,"end":16,"from":"2026-10-15T09:00:00","to":"2026-10-16T16:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"","ageFrom":2015,"ageTo":2020,"age":"2015–2020","free":true}]},{"id":30118,"title":"BJJ Super Hero Fight, Selbstverteidigung & sanfte Kampfkunst","category":"Martial arts","activity":"Ju-jitsu","ageFrom":2014,"ageTo":2020,"ageLabel":"2014–2020","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"Beginners and advanced","details":{"texts":[{"value":"We awaken your new superpower in you. You learn how to defend yourself against a stronger and bigger opponent. Our martial art is also called \"the gentle martial art\" because we manage entirely without punches and kicks. We show you techniques for setting boundaries using your voice alone. This new self-confidence makes you more balanced and enables you to stand up for yourself and others. We complement the self-defence training with sporty games. Lots of fun guaranteed.","nrs":["JJF 11"]}],"bring":[{"value":"Comfortable sports clothes (e.g. tracksuit bottoms or shorts and a T-shirt), plenty of morning snack and a water bottle. Training on the mat is done barefoot.","nrs":["JJF 11"]}],"notes":[]},"variants":[{"id":30118,"nr":"JJF 11","venue":23,"price":195,"weekId":"3-1","dates":"5 Oct – 9 Oct 2026","days":"Monday to Friday","time":"08:30–12:00","start":8.5,"end":12,"from":"2026-10-05T08:30:00","to":"2026-10-09T12:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners and advanced","ageFrom":2014,"ageTo":2020,"age":"2014–2020","free":true}]},{"id":30139,"title":"Bogenschiessen","category":"Nature & adventure","activity":"Archery","ageFrom":2009,"ageTo":2016,"ageLabel":"2009–2016","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"Beginners","details":{"texts":[{"value":"Do you want to aim and hit the target like Robin Hood, Katniss Everdeen and William Tell? In this course you train the necessary powers of concentration, patience and safe handling of bow and arrow. In exercises and small competitions we work on the practical side together with lots of fun.","nrs":["BOS 21","BOS 22","BOS 23"]}],"bring":[{"value":"Bring your own drink; all other material is provided. No sports clothes are needed.","nrs":["BOS 21","BOS 22","BOS 23"]}],"notes":[{"value":"Strong young people can also try out the crossbow.","nrs":["BOS 21","BOS 22","BOS 23"]}]},"variants":[{"id":30139,"nr":"BOS 21","venue":24,"price":140,"weekId":"3-2","dates":"12 Oct – 16 Oct 2026","days":"Monday to Friday","time":"10:00–12:00","start":10,"end":12,"from":"2026-10-12T10:00:00","to":"2026-10-16T12:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners","ageFrom":2009,"ageTo":2016,"age":"2009–2016","free":true},{"id":30140,"nr":"BOS 22","venue":24,"price":140,"weekId":"3-2","dates":"12 Oct – 16 Oct 2026","days":"Monday to Friday","time":"13:00–15:00","start":13,"end":15,"from":"2026-10-12T13:00:00","to":"2026-10-16T15:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners","ageFrom":2009,"ageTo":2016,"age":"2009–2016","free":true},{"id":30141,"nr":"BOS 23","venue":24,"price":140,"weekId":"3-2","dates":"12 Oct – 16 Oct 2026","days":"Monday to Friday","time":"15:30–17:30","start":15.5,"end":17.5,"from":"2026-10-12T15:30:00","to":"2026-10-16T17:30:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners","ageFrom":2009,"ageTo":2016,"age":"2009–2016","free":true}]},{"id":31494,"title":"Botanischer Garten UZH: Nature Remix – mach Musik mit Pflanzen","category":"Nature & adventure","activity":"Nature and adventure","ageFrom":2014,"ageTo":2018,"ageLabel":"2014–2018","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"","details":{"texts":[{"value":"The Botanical Garden UZH and the tropical greenhouses turn into a sound studio! What does nature sound like? Which sounds are hidden between and inside the leaves, stems and roots?\u003cbr>\n\nTogether we set out on sound expeditions, record natural sounds and explore the acoustic diversity of plants and their surroundings. We build our own sound tools, visit researchers at ETH and the University of Zürich and discover the fascinating world of bioacoustics.\u003cbr>\n\nYou turn the sounds you have collected into your own plant song. Kate Lim (artist & professional musician/DJ) accompanies and coaches you along the way. You don't need any previous knowledge – just curiosity and a love of music.\u003cbr>\n\nThe songs created will then be presented as part of an exhibition in summer 2027 at the Botanical Garden UZH.\u003cbr>\n\nA varied holiday programme that combines art, music and science and opens up a new view of the fascinating world of plants.","nrs":["FBO 21"]}],"bring":[{"value":"Lunch, drink","nrs":["FBO 21"]}],"notes":[{"value":"Meeting point: Cafeteria of the Botanical Garden UZH","nrs":["FBO 21"]}]},"variants":[{"id":31494,"nr":"FBO 21","venue":25,"price":200,"weekId":"3-2","dates":"12 Oct – 16 Oct 2026","days":"Monday to Friday","time":"10:00–17:00","start":10,"end":17,"from":"2026-10-12T10:00:00","to":"2026-10-16T17:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"","ageFrom":2014,"ageTo":2018,"age":"2014–2018","free":true}]},{"id":30108,"title":"Bouldern","category":"Nature & adventure","activity":"Sport climbing","ageFrom":2013,"ageTo":2016,"ageLabel":"2013–2016","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"Beginners","details":{"texts":[{"value":"Bouldering is climbing without a rope or harness at jump-down height. You will have lots of fun learning the most important bouldering rules and will have time to gain your first climbing and bouldering experience under the guidance of the coach. There are great challenges even for children who are afraid of heights!","nrs":["BOU 11"]}],"bring":[{"value":"Sports clothing with sports shorts that go over the knee, clean indoor shoes, morning snack, water bottle","nrs":["BOU 11"]}],"notes":[{"value":"So that the course can start on time, please be on site 15 minutes before the course begins. Supervision of participants starts when the course starts.","nrs":["BOU 11"]}]},"variants":[{"id":30108,"nr":"BOU 11","venue":26,"price":140,"weekId":"3-1","dates":"5 Oct – 9 Oct 2026","days":"Monday to Friday","time":"09:00–10:30","start":9,"end":10.5,"from":"2026-10-05T09:00:00","to":"2026-10-09T10:30:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners","ageFrom":2013,"ageTo":2016,"age":"2013–2016","free":true}]},{"id":30109,"title":"Bouldern","category":"Nature & adventure","activity":"Sport climbing","ageF
