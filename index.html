2016–2020","free":true}]},{"id":31031,"title":"Fussball / Schach","category":"Combined courses","activity":"—","ageFrom":2015,"ageTo":2019,"ageLabel":"2015–2019","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"Beginners and advanced","details":{"texts":[{"value":"In the morning you learn football from the ground up: dribbling, passing and shooting. In the afternoon we turn to chess. Would you like to get to know this game better or deepen your knowledge? You will be introduced to the secrets of chess in a playful way and learn tricks and tips for checkmating your opponent.","nrs":["FUSC 11"]}],"bring":[{"value":"Sports clothes, indoor shoes (with white soles), shin guards if available, lunch and a drink.","nrs":["FUSC 11"]}],"notes":[{"value":"You will be supervised over lunchtime, but you need to bring your lunch from home.","nrs":["FUSC 11"]}]},"variants":[{"id":31031,"nr":"FUSC 11","venue":56,"price":280,"weekId":"3-1","dates":"5 Oct – 9 Oct 2026","days":"Monday to Friday","time":"10:00–16:00","start":10,"end":16,"from":"2026-10-05T10:00:00","to":"2026-10-09T16:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners and advanced","ageFrom":2015,"ageTo":2019,"age":"2015–2019","free":true}]},{"id":30053,"title":"Fussball-Camp für Anfänger und Fortgeschrittene","category":"Ball sports","activity":"Football","ageFrom":2014,"ageTo":2021,"ageLabel":"2014–2021","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"Beginners and advanced","details":{"texts":[{"value":"In this football camp you'll learn the basic techniques of football. You'll experience a whole week of fun, exercise, team feeling and football fever.","nrs":["FUCA 11","FUCA 21"]}],"bring":[{"value":"Sports shoes and sportswear and shin guards; studded boots are not permitted. The course takes place in all weather. Please bring clothing suited to the weather.","nrs":["FUCA 11","FUCA 21"]}],"notes":[{"value":"Lunch, snacks and a T-shirt are included in the price. In bad weather, training takes place in the hall.","nrs":["FUCA 11","FUCA 21"]}]},"variants":[{"id":30053,"nr":"FUCA 11","venue":57,"price":350,"weekId":"3-1","dates":"5 Oct – 9 Oct 2026","days":"Monday to Friday","time":"09:45–16:30","start":9.75,"end":16.5,"from":"2026-10-05T09:45:00","to":"2026-10-09T16:30:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners and advanced","ageFrom":2014,"ageTo":2021,"age":"2014–2021","free":true},{"id":30080,"nr":"FUCA 21","venue":57,"price":350,"weekId":"3-2","dates":"12 Oct – 16 Oct 2026","days":"Monday to Friday","time":"09:45–16:30","start":9.75,"end":16.5,"from":"2026-10-12T09:45:00","to":"2026-10-16T16:30:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners and advanced","ageFrom":2014,"ageTo":2021,"age":"2014–2021","free":true}]},{"id":30055,"title":"Fussball-Camp Indoor","category":"Ball sports","activity":"Football","ageFrom":2011,"ageTo":2020,"ageLabel":"2011–2020","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"Beginners and advanced","details":{"texts":[{"value":"Does your heart beat for football? Would you like to experience an unforgettable week of sport under the guidance of active and former top footballers? Then you've come to the right place! Our varied activities focusing on technique and athleticism promise not only progress, but also lots of fun! Social skills and self-confidence are specifically encouraged, while team spirit and fair play take centre stage.\nAll girls and boys aged 6 and over are welcome – regardless of prior knowledge or football experience.","nrs":["INFU 11","INFU 21"]}],"bring":[{"value":"Sportswear and sports shoes. Street shoes for the lunch break.","nrs":["INFU 11","INFU 21"]}],"notes":[{"value":"Lunch and snacks, a FABRIK 11 T-shirt and a drinking bottle are included in the course fee. Extra supervision from 08:30-17:30 can be booked for CHF 20 per day.","nrs":["INFU 11","INFU 21"]}]},"variants":[{"id":30055,"nr":"INFU 11","venue":58,"price":390,"weekId":"3-1","dates":"5 Oct – 9 Oct 2026","days":"Monday to Friday","time":"10:00–16:00","start":10,"end":16,"from":"2026-10-05T10:00:00","to":"2026-10-09T16:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners and advanced","ageFrom":2011,"ageTo":2020,"age":"2011–2020","free":true},{"id":30083,"nr":"INFU 21","venue":58,"price":390,"weekId":"3-2","dates":"12 Oct – 16 Oct 2026","days":"Monday to Friday","time":"10:00–16:00","start":10,"end":16,"from":"2026-10-12T10:00:00","to":"2026-10-16T16:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners and advanced","ageFrom":2011,"ageTo":2020,"age":"2011–2020","free":true}]},{"id":26797,"title":"GC Unihockey Kids Camp","category":"Ball sports","activity":"Floorball","ageFrom":2013,"ageTo":2019,"ageLabel":"2013–2019","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"Beginners and advanced","details":{"texts":[{"value":"The floorball camp offers you a varied week of sport full of movement, team spirit and fun. Under the guidance of experienced coaches, you'll get to know the basics and the joy of playing floorball – from technique and coordination through to exciting match formats.\u003cp>\nThe camp is suitable for beginners and advanced players alike and playfully develops motor skills, self-confidence and fair play.\u003cp>\nAfter registering through the Sportamt Zürich, we ask all registered participants to fill in the \u003ca href=\"https://www.gc-unihockey.ch/kids-camps/formular-kids-camps/\" target=\"_blank\" rel=\"noopener noreferrer\">form on our website\u003c/a>. The form can be used to order the free shirt, book the extra supervision and provide further information that helps us prepare the Kids Camp as well as possible.","nrs":["UNIC 21"]}],"bring":[{"value":"Sportswear, indoor shoes, water bottle and floorball equipment if you have it","nrs":["UNIC 21"]}],"notes":[{"value":"Extra supervision is available daily from 08:00 to 09:30 for CHF 10 per day and child.\nLunch and a T-shirt are included in the camp price. To order the free shirt, book the extra supervision and provide further information (e.g. dietary habits), please fill in the form in the course description.","nrs":["UNIC 21"]}]},"variants":[{"id":26797,"nr":"UNIC 21","venue":59,"price":360,"weekId":"3-2","dates":"12 Oct – 16 Oct 2026","days":"Monday to Friday","time":"09:30–16:00","start":9.5,"end":16,"from":"2026-10-12T09:30:00","to":"2026-10-16T16:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners and advanced","ageFrom":2013,"ageTo":2019,"age":"2013–2019","free":true}]},{"id":30054,"title":"Girlskick","category":"Ball sports","activity":"Football","ageFrom":2011,"ageTo":2019,"ageLabel":"2011–2019","mixedAges":false,"mixedLevels":false,"gender":"Girls only","level":"Beginners and advanced","details":{"texts":[{"value":"Would you like to spend five days getting a taste of football together with other girls? It doesn't matter whether you already belong to a club or not. You will be trained by qualified coaches and players.","nrs":["GIRL 11","GIRL 21"]}],"bring":[{"value":"Football/studded boots and/or sports shoes, long spare clothing (tracksuit bottoms and jumper), rain protection (depending on the weather), shower kit.","nrs":["GIRL 11"]},{"value":"Football boots and/or sports shoes, long spare clothing (tracksuit bottoms and jumper), rain protection (depending on the weather).","nrs":["GIRL 21"]}],"notes":[{"value":"On Monday the Girlskick only starts at 13:00. Lunch, a training set, a gym bag and a water bottle are included in the price.","nrs":["GIRL 11","GIRL 21"]}]},"variants":[{"id":30054,"nr":"GIRL 11","venue":60,"price":350,"weekId":"3-1","dates":"5 Oct – 9 Oct 2026","days":"Monday to Friday","time":"09:15–16:00","start":9.25,"end":16,"from":"2026-10-05T09:15:00","to":"2026-10-09T16:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners and advanced","ageFrom":2011,"ageTo":2019,"age":"2011–2019","free":true},{"id":30081,"nr":"GIRL 21","venue":61,"price":350,"weekId":"3-2","dates":"12 Oct – 16 Oct 2026","days":"Monday to Friday","time":"09:15–16:00","start":9.25,"end":16,"from":"2026-10-12T09:15:00","to":"2026-10-16T16:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners and advanced","ageFrom":2011,"ageTo":2019,"age":"2011–2019","free":true}]},{"id":30082,"title":"Handball-Camp","category":"Ball sports","activity":"Handball","ageFrom":2012,"ageTo":2018,"ageLabel":"2012–2018","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"Beginners and advanced","details":{"texts":[{"value":"At this camp, games and training sessions led by top players from GC Amicitia await you. In between there is a hot lunch, entertainment, video analysis, nutrition theory, ball speed measurement and many other attractions. More about GC Amicitia at \u003ca href=\"http://gc-amicitia.ch/\" target=\"_blank\" rel=\"noopener noreferrer\">www.gc-amicitia.ch\u003c/a>.","nrs":["HAND 21"]}],"bring":[{"value":"Sports clothing and shower things","nrs":["HAND 21"]}],"notes":[{"value":"Meals, a ball, a T-shirt and a visit to a GC Amicitia championship game, as well as further souvenirs, are included in the price. New: additional supervision from 08:30 - 09:30 can be booked. The cost of the additional supervision is CHF 90 per week.","nrs":["HAND 21"]}]},"variants":[{"id":30082,"nr":"HAND 21","venue":62,"price":360,"weekId":"3-2","dates":"12 Oct – 16 Oct 2026","days":"Monday to Friday","time":"09:30–16:00","start":9.5,"end":16,"from":"2026-10-12T09:30:00","to":"2026-10-16T16:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners and advanced","ageFrom":2012,"ageTo":2018,"age":"2012–2018","free":true}]},{"id":30117,"title":"Hip Hop / Streetdance","category":"Dance, music & stage","activity":"Hip hop / street dance","ageFrom":2014,"ageTo":2018,"ageLabel":"2014–2018","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"Beginners","details":{"texts":[{"value":"Hip hop / streetdance is a modern dance style from America. During this week you learn cool moves and rehearse a choreography to catchy music.","nrs":["HIP 11"]}],"bring":[{"value":"Loose clothing, indoor shoes and drinks","nrs":["HIP 11"]}],"notes":[{"value":"On the last day you present the dance to your parents in a great performance. The course instructor speaks English and broken German.","nrs":["HIP 11"]}]},"variants":[{"id":30117,"nr":"HIP 11","venue":63,"price":90,"weekId":"3-1","dates":"5 Oct – 9 Oct 2026","days":"Monday to Friday","time":"15:15–16:45","start":15.25,"end":16.75,"from":"2026-10-05T15:15:00","to":"2026-10-09T16:45:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners","ageFrom":2014,"ageTo":2018,"age":"2014–2018","free":true}]},{"id":30876,"title":"Hörspiel","category":"Tech & crafts","activity":"Science and technology","ageFrom":2011,"ageTo":2017,"ageLabel":"2011–2017","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"Beginners and advanced","details":{"texts":[{"value":"Dive into the world of audio plays with us! \nYou come up with stories, speak different voices and slip into a variety of roles. In groups you develop your own audio play, which is then professionally recorded in the mobile sound studio. You speak all the roles yourself and add different accents to your audio play with noises and sound effects. You can create and record the sounds yourself like creative noise makers, so-called Foley Artists, or you can use sounds from a sound library. \u003cp>\n\nOn Friday at 11:30 the big premiere takes place, where all participants of the filmkids holiday course Hörspiel present their projects. Parents, siblings and friends are warmly invited.\u003cp>\n\nImportant: In order to take part in the course, an assignment of rights is required so that the photo, film and voice recordings made during the course are afterwards available to everyone and may be used on our platforms (youtube channel filmkidsCH, facebook page, instagram, website). Please contact us directly if you have any questions. More about us at \u003ca href=\"http://filmkids.ch/\" target=\"_blank\" rel=\"noopener noreferrer\">www.filmkids.ch\u003c/a>.\u003cp>\n\nOPTIONAL: 12 supervision places are available: \u003cp>\nMon – Fri from 16:00-18:00: CHF 75 \u003cp>\nThe supervision time is not lesson time, only a time to be looked after. Painting materials, games and a supervisor are on site. Children are welcome to bring homework, their own books, comics etc. Playing on a mobile phone and watching films is expressly allowed. The supervision can only take place if there are enough registrations.","nrs":["FHS 11"]}],"bring":[{"value":"Drink, food","nrs":["FHS 11"]}],"notes":[{"value":"When taking part in the course, an assignment of rights must be signed, as the filmed material cannot otherwise be used. For questions, please contact us at info@filmkids.ch. The assignment of rights can be downloaded at the following address: https://bit.ly/filmkids_rechtsabtretung_2020","nrs":["FHS 11"]}]},"variants":[{"id":30876,"nr":"FHS 11","venue":13,"price":200,"weekId":"3-1","dates":"5 Oct – 9 Oct 2026","days":"Monday to Friday","time":"13:00–16:00","start":13,"end":16,"from":"2026-10-05T13:00:00","to":"2026-10-09T16:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners and advanced","ageFrom":2011,"ageTo":2017,"age":"2011–2017","free":true}]},{"id":31468,"title":"Im bunten Reich der Gefühle","category":"Tech & crafts","activity":"Crafts and making","ageFrom":2014,"ageTo":2019,"ageLabel":"2014–2019","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"","details":{"texts":[{"value":"Feelings can be like colours - from brightly glowing to dully fading. Just as there are moments when things suddenly get too colourful for us, or days when it feels as if there is only grey. There are feelings we would rather get rid of and others that make our heart jump. And many feelings at once can create a real muddle inside us.\nWe paint and craft imaginative feeling-figures and playfully explore how we can deal with our feelings, understand them and express them. All feelings are important and valuable, all of them may be there - however colourful they are. \u003cbr>\nMore information at: \n\u003ca href=\"https://www.malspielraum.ch/\" target=\"_blank\" rel=\"noopener noreferrer\">www.nuori.ch\u003c/a>","nrs":["FID 21"]}],"bring":[{"value":"Afternoon snack","nrs":["FID 21"]}],"notes":[{"value":"Painting aprons and shoes are available in the studio","nrs":["FID 21"]}]},"variants":[{"id":31468,"nr":"FID 21","venue":17,"price":50,"weekId":"3-2","dates":"14 Oct 2026","days":"Wednesday","time":"14:00–16:00","start":14,"end":16,"from":"2026-10-14T14:00:00","to":"2026-10-14T16:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"","ageFrom":2014,"ageTo":2019,"age":"2014–2019","free":true}]},{"id":31469,"title":"Im Wundergarten","category":"Tech & crafts","activity":"Crafts and making","ageFrom":2014,"ageTo":2022,"ageLabel":"2014–2022","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"","details":{"texts":[{"value":"This course strengthens your creativity and lets your imagination truly unfold. To get us in the mood, we create a magical garden together using the play boxes and inspiring materials. Afterwards you can design your own wonderful garden on a large piece of cardboard that you have painted - with paints, colourful fabric flowers, natural materials, wood, cardboard, paper with flower motifs and much more. Perhaps you'd also like to make fairy-tale figures or animals to go with it? I have plenty of ideas ready for you, but I will also accompany and support you in realising your own ideas. In any case, you can take your creative works home at the end, where you can go on playing with them for a long time.\n\u003cbr> More information at: \n\u003ca href=\"https://www.malspielraum.ch/\" target=\"_blank\" rel=\"noopener noreferrer\">www.nuori.ch\u003c/a> \n\u003cp> To take part in this course you must already be attending the first year of kindergarten.","nrs":["FWU 21"]}],"bring":[{"value":"Morning snack","nrs":["FWU 21"]}],"notes":[{"value":"Painting aprons and shoes are available in the studio.\nTo take part in this course you must already be attending the first year of kindergarten.","nrs":["FWU 21"]}]},"variants":[{"id":31469,"nr":"FWU 21","venue":17,"price":50,"weekId":"3-2","dates":"15 Oct 2026","days":"Thursday","time":"10:00–12:00","start":10,"end":12,"from":"2026-10-15T10:00:00","to":"2026-10-15T12:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"","ageFrom":2014,"ageTo":2022,"age":"2014–2022","free":true}]},{"id":31463,"title":"Impro -Theater im Garten","category":"Nature & adventure","activity":"Nature and adventure","ageFrom":2015,"ageTo":2019,"ageLabel":"2015–2019","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"","details":{"texts":[{"value":"In the holiday course \"Improv Theatre in the Garden\", the Garten am Grenzsteig, a community garden in Zürich-Wollishofen, becomes our stage. Together we discover plants, trees and hidden corners in the garden and let them inspire us to create exciting theatre scenes. We play, improvise and invent imaginative characters. Will you become a tree fairy, a flower gnome or a completely different garden character? We make props for our scenes and rehearse in the fresh air. What might have happened in the tree house by the big poplar? What secrets are hidden between the beds? On Friday afternoon we invite parents and siblings to a short performance and present our self-developed garden theatre scenes. The garden becomes our stage and you are right in the middle of it!","nrs":["FGA 21"]}],"bring":[{"value":"Water bottle, morning snack, lunch and afternoon snack, weatherproof clothing that can get dirty, a pencil case with scissors, glue and writing materials","nrs":["FGA 21"]}],"notes":[]},"variants":[{"id":31463,"nr":"FGA 21","venue":64,"price":330,"weekId":"3-2","dates":"13 Oct – 16 Oct 2026","days":"Tuesday to Friday","time":"09:30–16:00","start":9.5,"end":16,"from":"2026-10-13T09:30:00","to":"2026-10-16T16:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"","ageFrom":2015,"ageTo":2019,"age":"2015–2019","free":true}]},{"id":31438,"title":"Improtheater! *Sek*","category":"Dance, music & stage","activity":"Theatre and dance","ageFrom":2010,"ageTo":2013,"ageLabel":"2010–2013","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"Beginners","details":{"texts":[{"value":"In this three-day course you will learn the basics of improvised theatre. There is no right or wrong here: you can give your imagination free rein and act out the stories that interest you.\n\u003cp>We start with some basic principles of improvised theatre, such as accepting your own ideas and those of others, or allowing mistakes to happen. Building on this, we will soon start playing improvised scenes.\nImprov theatre also offers a playful approach to comedy. Spontaneous storytelling, unexpected twists and sudden ideas create funny and surprising moments.\n\u003cp> What you learn in improv theatre helps you not only on stage, but also in everyday life. Through this form of theatre you become braver and more assertive, and you learn to respond better to the people around you.\nTowards the end of the course we get to know a few theatre sports games that the professionals also play regularly on stage.\n\u003ca href=\"http://www.pfirsi.ch\" target=\"_blank\" rel=\"noopener noreferrer\">www.pfirsi.ch\u003c/a>","nrs":["FIM 21"]}],"bring":[{"value":"Comfortable clothing, water bottle","nrs":["FIM 21"]}],"notes":[]},"variants":[{"id":31438,"nr":"FIM 21","venue":65,"price":140,"weekId":"3-2","dates":"12 Oct – 14 Oct 2026","days":"Monday to Wednesday","time":"10:00–13:00","start":10,"end":13,"from":"2026-10-12T10:00:00","to":"2026-10-14T13:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners","ageFrom":2010,"ageTo":2013,"age":"2010–2013","free":true}]},{"id":31033,"title":"Jiu-Jitsu / Code Camp","category":"Combined courses","activity":"—","ageFrom":2013,"ageTo":2018,"ageLabel":"2013–2018","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"Beginners","details":{"texts":[{"value":"In the morning, the coaches from House of Gentle Arts introduce you to the world of the martial art jiu-jitsu. You learn how to defend yourself against a stronger and bigger opponent. \u003cp>\nIn the afternoon, Code Camp takes you on a playful journey through drag & drop programming. Under expert guidance, you programme your very own first game. After the course you can keep developing the game at home at any time\nand share it with your friends and family.\u003cp>\n\nBody & Mind: fighting in the morning, programming in the afternoon. Plenty of variety and\nlots of fun guaranteed.","nrs":["JJCC 21"]}],"bring":[{"value":"Drinks and food for the whole day, comfortable sports clothing, flip-flops or\nslippers","nrs":["JJCC 21"]}],"notes":[{"value":"You will be supervised over lunchtime, but you need to bring your lunch from home. / Please bring the children to the morning course venue and pick them up again at the afternoon course venue. The course runs from 09:00-16:00. Children can be dropped off at 08:30 in the morning and picked up until 16:30 in the evening. \nThe venue for the extended care times is Code Camp, which is right next to the Sporthalle Allmend.","nrs":["JJCC 21"]}]},"variants":[{"id":31033,"nr":"JJCC 21","venue":66,"price":470,"weekId":"3-2","dates":"12 Oct – 16 Oct 2026","days":"Monday to Friday","time":"09:00–16:00","start":9,"end":16,"from":"2026-10-12T09:00:00","to":"2026-10-16T16:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners","ageFrom":2013,"ageTo":2018,"age":"2013–2018","free":true}]},{"id":30156,"title":"Ju Jitsu","category":"Martial arts","activity":"Self-defence","ageFrom":2011,"ageTo":2017,"ageLabel":"2011–2017","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"Beginners","details":{"texts":[{"value":"In this course you get to know the variety of Ju Jitsu. Sport, play, competition and self-defence - that is all Ju Jitsu. After this week you will know the basics of the samurai martial art for defending yourself without weapons.","nrs":["JJU 21"]}],"bring":[{"value":"Light sportswear (training is done barefoot)","nrs":["JJU 21"]}],"notes":[]},"variants":[{"id":30156,"nr":"JJU 21","venue":29,"price":90,"weekId":"3-2","dates":"12 Oct – 16 Oct 2026","days":"Monday to Friday","time":"10:30–12:00","start":10.5,"end":12,"from":"2026-10-12T10:30:00","to":"2026-10-16T12:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners","ageFrom":2011,"ageTo":2017,"age":"2011–2017","free":true}]},{"id":30056,"title":"Kampfsport-Camp","category":"Martial arts","activity":"Martial arts (various)","ageFrom":2013,"ageTo":2020,"ageLabel":"2013–2020","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"Beginners and advanced","details":{"texts":[{"value":"Experience the fascination of martial arts in a safe and instructive environment! This camp offers an insight into the basics of various martial arts such as judo, karate, self-defence and much more. You will learn different punching, kicking and self-defence techniques, train your concentration and learn to fight with respect.\u003cp>\nEarly and late supervision can be booked via the following link \u003ca href=\"https://anmeldung.kinder-camps.ch/anmeldung/kurs/320374?kursCode=kam-zurich-bl-2610&modulId=6533\" target=\"_blank\" rel=\"noopener noreferrer\">Book early and late supervision\u003c/a>\u003cp>\nVia this link you book only the additional supervision. Registration for the camp is a prerequisite and is done through the Sports Office of the City of Zürich.","nrs":["KAMP 11"]}],"bring":[{"value":"Sports clothing, trainers, water bottle, morning snack and afternoon snack","nrs":["KAMP 11"]}],"notes":[{"value":"The price includes lunch with drinks and a T-shirt. In addition, early and late care from 08:00-09:30 and/or 16:00-17:30 can be booked with the provider via the link in the online listing. Registration for the camp is required and is done through the Sports Office of the City of Zürich. Early care on the first day of camp and late care on the last day of camp cannot be booked. Cost per additional care session: CHF 15.","nrs":["KAMP 11"]}]},"variants":[{"id":30056,"nr":"KAMP 11","venue":67,"price":320,"weekId":"3-1","dates":"5 Oct – 9 Oct 2026","days":"Monday to Friday","time":"09:30–16:00","start":9.5,"end":16,"from":"2026-10-05T09:30:00","to":"2026-10-09T16:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners and advanced","ageFrom":2013,"ageTo":2020,"age":"2013–2020","free":true}]},{"id":30119,"title":"Karate","category":"Martial arts","activity":"Karate","ageFrom":2011,"ageTo":2019,"ageLabel":"2011–2019","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"Beginners and advanced","details":{"texts":[{"value":"During this week you learn fascinating basic techniques of Karate Do. With them you can fight in a sporty, effective and fair way, and channel your energy with concentration and lots of fun. You also learn various self-defence techniques. This strengthens your self-confidence so that you can hold your own in different situations.","nrs":["KAR 11"]}],"bring":[{"value":"Sports clothes, skipping rope, towel, water bottle and snacks","nrs":["KAR 11"]}],"notes":[]},"variants":[{"id":30119,"nr":"KAR 11","venue":68,"price":120,"weekId":"3-1","dates":"5 Oct – 9 Oct 2026","days":"Monday to Friday","time":"10:00–12:00","start":10,"end":12,"from":"2026-10-05T10:00:00","to":"2026-10-09T12:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners and advanced","ageFrom":2011,"ageTo":2019,"age":"2011–2019","free":true}]},{"id":30157,"title":"Karate für Mädchen","category":"Martial arts","activity":"Karate","ageFrom":2011,"ageTo":2019,"ageLabel":"2011–2019","mixedAges":false,"mixedLevels":false,"gender":"Girls only","level":"Beginners and advanced","details":{"texts":[{"value":"During this week you learn fascinating basic techniques of Karate Do. With them you can fight in a sporty, effective and fair way, and channel your energy with concentration and lots of fun. You also learn various self-defence techniques. This strengthens your self-confidence so that you can hold your own in different situations.","nrs":["KAR 21"]}],"bring":[{"value":"Sports clothes, skipping rope, towel, water bottle and snacks","nrs":["KAR 21"]}],"notes":[]},"variants":[{"id":30157,"nr":"KAR 21","venue":68,"price":120,"weekId":"3-2","dates":"12 Oct – 16 Oct 2026","days":"Monday to Friday","time":"10:00–12:00","start":10,"end":12,"from":"2026-10-12T10:00:00","to":"2026-10-16T12:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners and advanced","ageFrom":2011,"ageTo":2019,"age":"2011–2019","free":true}]},{"id":30941,"title":"Keine Angst mehr vor Hunden","category":"Nature & adventure","activity":"Nature and adventure","ageFrom":2016,"ageTo":2020,"ageLabel":"2016–2020","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"","details":{"texts":[{"value":"Would you rather cross to the other side of the street when a dog comes towards you? Do you feel uncomfortable or unsure when meeting dogs? This course will give you a lot of confidence in handling and meeting dogs and help you overcome your fear. In this course you will learn the right rules of behaviour around dogs, how dogs communicate and how they can become your friends. You will have the chance to approach very friendly dogs at your own pace and make friends with them.","nrs":["FAH 21"]}],"bring":[{"value":"Snacks and a drink, weather- and cold-proof clothing, sturdy shoes, rain protection","nrs":["FAH 21"]}],"notes":[{"value":"The event takes place outdoors.\nMeeting point: Albisgütli tram stop","nrs":["FAH 21"]}]},"variants":[{"id":30941,"nr":"FAH 21","venue":69,"price":70,"weekId":"3-2","dates":"13 Oct 2026","days":"Tuesday","time":"13:00–17:00","start":13,"end":17,"from":"2026-10-13T13:00:00","to":"2026-10-13T17:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"","ageFrom":2016,"ageTo":2020,"age":"2016–2020","free":true}]},{"id":31357,"title":"Kids-Actory im Kulturmarkt: Theaterworkshop","category":"Dance, music & stage","activity":"Theatre and dance","ageFrom":2011,"ageTo":2017,"ageLabel":"2011–2017","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"","details":{"texts":[{"value":"Movement and dance theatre \u003cp>\nAll children know that you can create complex worlds with the simplest of means. Everyday objects such as plastic sheeting or cardboard boxes are used to create costumes, and scenarios are brought to life with dance and movement, words and music. There are no limits to the imagination. At the end of the workshop there is a public performance that the whole week is spent working towards. In this way, a large-scale movement theatre piece emerges from a variety of small elements \u003cp>\nCourse leader: Kathrine Ramseier, actress, theatre and music educator","nrs":["FKM 11"]}],"bring":[{"value":"Detailed information will be sent by email after the registration deadline.","nrs":["FKM 11"]}],"notes":[{"value":"Meeting point: Restaurant Kulturmarkt /\nSupervised lunch at Restaurant Kulturmarkt as well as snacks are included in the course fee.","nrs":["FKM 11"]}]},"variants":[{"id":31357,"nr":"FKM 11","venue":70,"price":320,"weekId":"3-1","dates":"5 Oct – 9 Oct 2026","days":"Monday to Friday","time":"09:00–16:00","start":9,"end":16,"from":"2026-10-05T09:00:00","to":"2026-10-09T16:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"","ageFrom":2011,"ageTo":2017,"age":"2011–2017","free":true}]},{"id":31498,"title":"Kinderkochkurs","category":"Movement & fitness","activity":"Health and nutrition","ageFrom":2015,"ageTo":2018,"ageLabel":"2015–2018","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"Beginners and advanced","details":{"texts":[{"value":"In this varied cooking course children discover the joy of cooking and baking.\n\u003cp> Together we prepare simple, healthy and tasty dishes, learn how to handle kitchen utensils safely and find out exciting things about food. Teamwork, creativity and, of course, fun are at the heart of it all. At the end we enjoy the delicacies we have made together – and every child takes home new ideas and recipes. \n\n\u003cp>Together we visit the Helvetiaplatz market, discover fresh, seasonal fruit and vegetables and learn what to look out for when shopping. The children can ask questions, choose ingredients and experience where our food comes from.","nrs":["FKK 21"]}],"bring":[{"value":"Weather-appropriate clothing and comfortable shoes (for the visit to the Helvetiaplatz market). A drinking bottle \nA tin or container for any leftovers","nrs":["FKK 21"]}],"notes":[{"value":"Please inform the course leader of any food allergies or intolerances on the first day.","nrs":["FKK 21"]}]},"variants":[{"id":31498,"nr":"FKK 21","venue":71,"price":500,"weekId":"3-2","dates":"12 Oct – 16 Oct 2026","days":"Monday to Friday","time":"09:00–16:00","start":9,"end":16,"from":"2026-10-12T09:00:00","to":"2026-10-16T16:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners and advanced","ageFrom":2015,"ageTo":2018,"age":"2015–2018","free":true}]},{"id":30084,"title":"KinderOutdoorWoche","category":"Nature & adventure","activity":"Nature and adventure","ageFrom":2014,"ageTo":2022,"ageLabel":"2014–2022","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"Beginners and advanced","details":{"texts":[{"value":"The KinderOutdoorWoche is a sport- and movement-oriented week and at the same time an adventure-education training. Sport meets Pfadi with a field game, an expedition day and at least two outdoor sports. At the start of the camp you must already be attending kindergarten. \u003cp>\nPlease provide further information about your child, such as group preferences, allergies, shirt sizes, etc., at the following link:\n\u003ca href=\"https://docs.google.com/forms/d/\" target=\"_blank\" rel=\"noopener noreferrer\">Further information about your child\u003c/a>","nrs":["KOWZ 21"]},{"value":"The KinderOutdoorWoche is a sport- and movement-oriented week and at the same time an adventure-education training. Sport meets Pfadi with a field game, an expedition day and at least two outdoor sports. To take part in this course, you must already be attending kindergarten.\u003cp>\n\nPlease provide further information (group preferences, allergies, shirt sizes, etc.) about your child at the following link:\n\u003ca>Further information about your child\u003c/a>","nrs":["KOWZ 22"]}],"bring":[{"value":"Weatherproof clothing, hiking boots, backpack, drinking bottle, trainers and sportswear","nrs":["KOWZ 21","KOWZ 22"]}],"notes":[{"value":"The price includes the morning snack, lunch and the afternoon snack. Detailed information about the camp schedule will be sent to you directly by the camp organisers by e-mail. Optional supervision outside core hours (08:00-09:00 and 16:00-18:00) is available. It can be booked via a link after you receive the final course confirmation, or on site. Please provide further information about your child, such as group preferences, allergies, shirt sizes etc., via the link in the online course description.","nrs":["KOWZ 21","KOWZ 22"]}]},"variants":[{"id":30084,"nr":"KOWZ 21","venue":72,"price":360,"weekId":"3-2","dates":"12 Oct – 16 Oct 2026","days":"Monday to Friday","time":"09:00–16:00","start":9,"end":16,"from":"2026-10-12T09:00:00","to":"2026-10-16T16:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners and advanced","ageFrom":2014,"ageTo":2022,"age":"2014–2022","free":true},{"id":30085,"nr":"KOWZ 22","venue":73,"price":360,"weekId":"3-2","dates":"12 Oct – 16 Oct 2026","days":"Monday to Friday","time":"09:00–16:00","start":9,"end":16,"from":"2026-10-12T09:00:00","to":"2026-10-16T16:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners and advanced","ageFrom":2014,"ageTo":2022,"age":"2014–2022","free":true}]},{"id":31030,"title":"Kochen / Hip Hop","category":"Combined courses","activity":"—","ageFrom":2013,"ageTo":2016,"ageLabel":"2013–2016","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"Beginners and advanced","details":{"texts":[{"value":"A whole week of cooking and hip hop dancing.\u003cbr> In hip hop you learn cool moves and rehearse a choreography to rousing music. You can take the recipes home with you after the course. On the last day, everything you have learned is presented to parents and friends.","nrs":["KOHI 11"]}],"bring":[{"value":"Sports clothes, indoor shoes, cooking apron","nrs":["KOHI 11"]}],"notes":[{"value":"Lunch and an afternoon snack are included in the course price. Vegetarian options are available and lactose intolerance can be taken into account. Unfortunately, other diets or allergies cannot be catered for.","nrs":["KOHI 11"]}]},"variants":[{"id":31030,"nr":"KOHI 11","venue":74,"price":510,"weekId":"3-1","dates":"5 Oct – 9 Oct 2026","days":"Monday to Friday","time":"09:30–16:00","start":9.5,"end":16,"from":"2026-10-05T09:30:00","to":"2026-10-09T16:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners and advanced","ageFrom":2013,"ageTo":2016,"age":"2013–2016","free":true}]},{"id":31115,"title":"Kodu Game Lab: Entwickle deine eigenen Spiele","category":"Tech & crafts","activity":"Science and technology","ageFrom":2016,"ageTo":2019,"ageLabel":"2016–2019","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"Beginners","details":{"texts":[{"value":"Would you like to create your own computer games? With Microsoft Kodu Game Lab you build 3D worlds and program your game ideas.\n\u003cp>What you develop:\n\u003cbr>• Your own 3D landscapes with mountains, lakes and forests\n\u003cbr>• Game characters that behave according to your rules\n\u003cbr>• Tricky mazes and adventure games\n\u003cbr>• Different game types – from racing games to puzzles\n\u003cbr>• Your complete computer games to take home\n\u003cp>What you learn:\nYou program with visual building blocks instead of complicated code. In the process you develop logical thinking and learn how to solve problems step by step.\n\u003cp>Your projects:\nFrom a simple turtle hunt to a complex adventure game – you put your ideas into practice and can share them with friends and family.\nSign up and become a game designer!","nrs":["FKU 22"]}],"bring":[],"notes":[{"value":"For this course, confident use of the keyboard and mouse is required.","nrs":["FKU 22"]}]},"variants":[{"id":31115,"nr":"FKU 22","venue":7,"price":350,"weekId":"3-2","dates":"12 Oct – 16 Oct 2026","days":"Monday to Friday","time":"09:00–12:30","start":9,"end":12.5,"from":"2026-10-12T09:00:00","to":"2026-10-16T12:30:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners","ageFrom":2016,"ageTo":2019,"age":"2016–2019","free":true}]},{"id":30646,"title":"Kreativ durch die Herbstzeit","category":"Tech & crafts","activity":"Crafts and making","ageFrom":2016,"ageTo":2019,"ageLabel":"2016–2019","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"","details":{"texts":[{"value":"The colours, shapes and treasures of autumn inspire us to create a wide variety of art projects. If the weather is nice we head outdoors, collect leaves and other natural materials and discover the autumn atmosphere in our surroundings. \u003cp>\nIn the studio and outdoors we draw, paint, design and experiment with different materials and techniques. We print with leaves, paint autumn landscapes and atmospheric nature pictures and turn our finds into imaginative works of art. \u003cp>\nIn a small group of no more than 10 children there is plenty of room for your own ideas, creativity and the joy of making things","nrs":["FKH 11","FKH 21"]}],"bring":[{"value":"Lunch, clothing suited to the weather","nrs":["FKH 11","FKH 21"]}],"notes":[]},"variants":[{"id":30646,"nr":"FKH 11","venue":75,"price":400,"weekId":"3-1","dates":"5 Oct – 8 Oct 2026","days":"Monday to Thursday","time":"09:30–15:30","start":9.5,"end":15.5,"from":"2026-10-05T09:30:00","to":"2026-10-08T15:30:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"","ageFrom":2016,"ageTo":2019,"age":"2016–2019","free":true},{"id":31446,"nr":"FKH 21","venue":75,"price":400,"weekId":"3-2","dates":"12 Oct – 15 Oct 2026","days":"Monday to Thursday","time":"09:30–15:30","start":9.5,"end":15.5,"from":"2026-10-12T09:30:00","to":"2026-10-15T15:30:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"","ageFrom":2016,"ageTo":2019,"age":"2016–2019","free":true}]},{"id":31473,"title":"Kreatives Schmuckatelier Albisrieden","category":"Tech & crafts","activity":"Crafts and making","ageFrom":2012,"ageTo":2017,"ageLabel":"2012–2017","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"","details":{"texts":[{"value":"Did you know that you can create beautiful pendants, earrings or bracelets with tiny glass beads? All you need is a little patience, a steady hand and a love of creative work. \u003cbr>\nI'll show you the knotting technique using fine Miyuki beads. Together we'll make fruit, animals or other imaginative jewellery creations. Step by step, unique pieces of jewellery will come into being – to give away or to keep for yourself.","nrs":["FSM 11"]}],"bring":[{"value":"Lunch","nrs":["FSM 11"]}],"notes":[{"value":"You will be supervised over lunchtime, but you need to bring your lunch from home.","nrs":["FSM 11"]}]},"variants":[{"id":31473,"nr":"FSM 11","venue":42,"price":95,"weekId":"3-1","dates":"7 Oct 2026","days":"Wednesday","time":"09:30–15:30","start":9.5,"end":15.5,"from":"2026-10-07T09:30:00","to":"2026-10-07T15:30:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"","ageFrom":2012,"ageTo":2017,"age":"2012–2017","free":true}]},{"id":31474,"title":"Kreatives Schmuckatelier Wollishofen","category":"Tech & crafts","activity":"Crafts and making","ageFrom":2012,"ageTo":2017,"ageLabel":"2012–2017","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"","details":{"texts":[{"value":"Did you know that you can create beautiful pendants, earrings or bracelets with tiny glass beads? All you need is a little patience, a steady hand and a love of creative work. \u003cbr>\nI'll show you the knotting technique using fine Miyuki beads. Together we'll make fruit, animals or other imaginative jewellery creations. Step by step, unique pieces of jewellery will come into being – to give away or to keep for yourself.","nrs":["FSM 12"]}],"bring":[{"value":"Lunch","nrs":["FSM 12"]}],"notes":[{"value":"You will be supervised over lunchtime, but you need to bring your lunch from home.","nrs":["FSM 12"]}]},"variants":[{"id":31474,"nr":"FSM 12","venue":76,"price":95,"weekId":"3-1","dates":"8 Oct 2026","days":"Thursday","time":"09:30–15:30","start":9.5,"end":15.5,"from":"2026-10-08T09:30:00","to":"2026-10-08T15:30:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"","ageFrom":2012,"ageTo":2017,"age":"2012–2017","free":true}]},{"id":30952,"title":"Kreatives Schreiben für Kinder mit Gabriela & Franz Kasperski","category":"Tech & crafts","activity":"Crafts and making","ageFrom":2012,"ageTo":2016,"ageLabel":"2012–2016","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"Beginners and advanced","details":{"texts":[{"value":"Whether fantasy, ghost story, crime story or short story - at the GeschichtenBäckerei you will learn how stories work and what it takes to tell them in an exciting way. The structure, the characters, the words: you can try all of it out. You can also draw your characters. Samira Kasperski will help you with this; she knows a lot about it and is a very good artist.\u003cbr>\nEvery day we take a walk through the old town. It is full of exciting stories that are guaranteed to give you ideas. You can make the letters dance, and anyone who likes can read aloud.\u003cbr>\nHelping you with this is Gabriela Kasperski, crime and children's book author. She has won the Zurich Crime Fiction Prize.\u003cbr>\nFranz Kasperski is an author and cultural journalist.","nrs":["FKS 11"]}],"bring":[{"value":"Notepad, something to write with (pen and colours), a small lunch.","nrs":["FKS 11"]}],"notes":[]},"variants":[{"id":30952,"nr":"FKS 11","venue":77,"price":300,"weekId":"3-1","dates":"5 Oct – 9 Oct 2026","days":"Monday to Friday","time":"09:00–13:00","start":9,"end":13,"from":"2026-10-05T09:00:00","to":"2026-10-09T13:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners and advanced","ageFrom":2012,"ageTo":2016,"age":"2012–2016","free":true}]},{"id":30885,"title":"Kreativküche und Gestaltungsfreude","category":"Tech & crafts","activity":"Crafts and making","ageFrom":2015,"ageTo":2019,"ageLabel":"2015–2019","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"","details":{"texts":[{"value":"Do you feel like being creative? In the morning we bake and in the afternoon we discover new creative possibilities. With various games in the fresh air, there is plenty of movement too. We also spend a day in the forest and, in dry weather, make a fire. Shared fun and the joy of experimenting are at the heart of it all!","nrs":["FKG 11"]}],"bring":[{"value":"Lunch, drink, apron, slippers","nrs":["FKG 11"]}],"notes":[{"value":"You will be supervised over lunchtime, but you need to bring your lunch from home.","nrs":["FKG 11"]}]},"variants":[{"id":30885,"nr":"FKG 11","venue":78,"price":360,"weekId":"3-1","dates":"5 Oct – 9 Oct 2026","days":"Monday to Friday","time":"09:00–16:00","start":9,"end":16,"from":"2026-10-05T09:00:00","to":"2026-10-09T16:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"","ageFrom":2015,"ageTo":2019,"age":"2015–2019","free":true}]},{"id":30947,"title":"Kultur, Kunst & Bewegungswoche - Blow my Mind Retreat","category":"Nature & adventure","activity":"Nature and adventure","ageFrom":2014,"ageTo":2021,"ageLabel":"2014–2021","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"Beginners and advanced","details":{"texts":[{"value":"Culture, fun and sports activities of all kinds to promote agility, endurance, togetherness, coordination and enjoyment of movement and culture.\u003cbr>\nWe combine daily outings to various child-friendly cultural places in Zürich with indoor and outdoor sports activities as well as creative work.\u003cbr>\nOur exciting, nature-oriented, cultural and family-friendly destinations include, for example, the Bächlihof and the Elefantenbach.\u003cp>\nOur spacious, central and beautiful Mindful Tree Education children's centre is located at Kreuzplatz, just a 5-minute walk from Stadelhofen station.\u003cbr>\nNo special prerequisites are needed to take part.\u003cbr>\nSnacks, admission and transport are all included.\u003cbr>\nThe programme is run by an expert in children's education and upbringing.","nrs":["FRE 11","FRE 21"]}],"bring":[{"value":"Weather-appropriate clothing and footwear, drinking water and lunch","nrs":["FRE 11","FRE 21"]}],"notes":[{"value":"This course is aimed at children who are already attending the first year of kindergarten. Additional care before and/or after the course, from 08:00-10:00 and/or 16:00-18:00, can be booked with the organiser at mindfultreeeducation@gmail.com or by WhatsApp (076 328 75 33).","nrs":["FRE 11","FRE 21"]}]},"variants":[{"id":30947,"nr":"FRE 11","venue":79,"price":500,"weekId":"3-1","dates":"5 Oct – 9 Oct 2026","days":"Monday to Friday","time":"10:00–16:00","start":10,"end":16,"from":"2026-10-05T10:00:00","to":"2026-10-09T16:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners and advanced","ageFrom":2014,"ageTo":2021,"age":"2014–2021","free":true},{"id":30961,"nr":"FRE 21","venue":79,"price":500,"weekId":"3-2","dates":"12 Oct – 16 Oct 2026","days":"Monday to Friday","time":"10:00–16:00","start":10,"end":16,"from":"2026-10-12T10:00:00","to":"2026-10-16T16:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners and advanced","ageFrom":2014,"ageTo":2021,"age":"2014–2021","free":true}]},{"id":30120,"title":"Kung Fu","category":"Martial arts","activity":"Kung fu","ageFrom":2016,"ageTo":2021,"ageLabel":"2016–2021","mixedAges":true,"mixedLevels":false,"gender":"Girls and boys","level":"Beginners","details":{"texts":[{"value":"In Kung Fu, targeted exercises strengthen agility, concentration, dexterity, coordination and self-confidence. The focus is not on combat, but on the healthy physical and mental development of the children. Consideration for others and discipline are an essential part of the training.","nrs":["KUF 11"]},{"value":"Children's kung fu is a tailor-made form of kung fu training that supports children's physical and mental development. It places particular emphasis on improving physical fitness, coordination, balance, concentration and self-confidence. A central part of children's kung fu is also teaching important values such as respect, discipline and self-control.","nrs":["KUF 21"]}],"bring":[{"value":"Loose sports clothing","nrs":["KUF 11"]},{"value":"Loose training clothes, light indoor shoes and a drink.","nrs":["KUF 21"]}],"notes":[{"value":"Detailed directions at www.skema.ch/zuerich.","nrs":["KUF 11"]}]},"variants":[{"id":30120,"nr":"KUF 11","venue":80,"price":75,"weekId":"3-1","dates":"5 Oct – 9 Oct 2026","days":"Monday to Friday","time":"09:00–10:00","start":9,"end":10,"from":"2026-10-05T09:00:00","to":"2026-10-09T10:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners","ageFrom":2016,"ageTo":2021,"age":"2016–2021","free":true},{"id":30159,"nr":"KUF 21","venue":81,"price":75,"weekId":"3-2","dates":"12 Oct – 16 Oct 2026","days":"Monday to Friday","time":"09:00–10:00","start":9,"end":10,"from":"2026-10-12T09:00:00","to":"2026-10-16T10:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners","ageFrom":2016,"ageTo":2020,"age":"2016–2020","free":true}]},{"id":31501,"title":"Kunsthalle Zürich: Normal gibt's nicht","category":"Tech & crafts","activity":"Crafts and making","ageFrom":2013,"ageTo":2019,"ageLabel":"2013–2019","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"","details":{"texts":[{"value":"\u003cstrong>Open studio\u003c/strong>\u003cbr>\nWe look at the artworks in the Kunsthalle Zürich with curiosity and an inquiring eye. Together we browse through current and past exhibitions and try out various creative techniques: printing processes, jewellery design, photocopy experiments, upcycling and recycling, collage, drawing with coffee, weaving or light installations. \nIn the studio you can pursue your own interests, develop ideas further and try out new things. \u003cbr>\n \nWe also take a look behind the scenes and visit places that normally remain hidden from visitors. On walks through the surrounding area in Kreis 5 we let off steam performatively and creatively. \u003cbr>\n \nWe record our discoveries in our colourful diary, which we design and bind ourselves. Perhaps an exhibition of our own with a vernissage will emerge at the end - as ourselves or in our alter egos. \n\u003cbr> Either way: to finish we raise a glass of cordial together.","nrs":["FNO 21"]}],"bring":[{"value":"Food (morning snack and lunch), comfortable clothes that are allowed to get dirty","nrs":["FNO 21"]}],"notes":[{"value":"You will be supervised over lunchtime, but you need to bring your lunch from home.","nrs":["FNO 21"]}]},"variants":[{"id":31501,"nr":"FNO 21","venue":82,"price":350,"weekId":"3-2","dates":"12 Oct – 16 Oct 2026","days":"Monday to Friday","time":"09:00–15:00","start":9,"end":15,"from":"2026-10-12T09:00:00","to":"2026-10-16T15:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"","ageFrom":2013,"ageTo":2019,"age":"2013–2019","free":true}]},{"id":30930,"title":"Landhockey und Mannschaftsspiele","category":"Ball sports","activity":"Field hockey","ageFrom":2016,"ageTo":2020,"ageLabel":"2016–2020","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"Beginners","details":{"texts":[{"value":"You'll mainly play field hockey, but also various other team games. It's all about plenty of movement, team spirit, tactics and technique. All outdoors on the Hardhof hockey pitch, right by the Limmat.","nrs":["LAN 11","LAN 21"]}],"bring":[{"value":"Sports clothing, sports shoes and a drink. Equipment is provided.","nrs":["LAN 11","LAN 21"]}],"notes":[]},"variants":[{"id":30930,"nr":"LAN 11","venue":60,"price":130,"weekId":"3-1","dates":"5 Oct – 9 Oct 2026","days":"Monday to Friday","time":"09:00–12:00","start":9,"end":12,"from":"2026-10-05T09:00:00","to":"2026-10-09T12:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners","ageFrom":2016,"ageTo":2020,"age":"2016–2020","free":true},{"id":30931,"nr":"LAN 21","venue":60,"price":130,"weekId":"3-2","dates":"12 Oct – 16 Oct 2026","days":"Monday to Friday","time":"09:00–12:00","start":9,"end":12,"from":"2026-10-12T09:00:00","to":"2026-10-16T12:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners","ageFrom":2016,"ageTo":2020,"age":"2016–2020","free":true}]},{"id":30665,"title":"Malatelier","category":"Tech & crafts","activity":"Crafts and making","ageFrom":2011,"ageTo":2020,"ageLabel":"2011–2020","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"","details":{"texts":[{"value":"With plenty of enjoyment in experimenting and trying things out, give your creativity free rein on a large format. Develop your own visual language further. Find the beginning, the form and your rhythm while painting. The big paint buffet is available to you. While you work, you will receive individual, professional support. The pictures are neither graded nor interpreted. \u003cp> More information at: \u003ca href=\"https://www.begleitetesmalen.com/\" target=\"_blank\" rel=\"noopener noreferrer\">www.begleitetesmalen.com\u003c/a>","nrs":["FMA 21"]}],"bring":[{"value":"a snack, a drink","nrs":["FMA 21"]}],"notes":[]},"variants":[{"id":30665,"nr":"FMA 21","venue":83,"price":50,"weekId":"3-2","dates":"13 Oct 2026","days":"Tuesday","time":"09:00–11:00","start":9,"end":11,"from":"2026-10-13T09:00:00","to":"2026-10-13T11:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"","ageFrom":2011,"ageTo":2020,"age":"2011–2020","free":true}]},{"id":31121,"title":"Minecraft City of Heroes","category":"Tech & crafts","activity":"Science and technology","ageFrom":2016,"ageTo":2019,"ageLabel":"2016–2019","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"Beginners","details":{"texts":[{"value":"You become a superhero engineer and build a secret base with high-tech equipment!\n\u003cp>Your mission:\nYou are part of a team building a superhero city. Everyone gets their own building plot on our server, where you develop your structures.\n\u003cp>What you build:\n\u003cbr>• Your own superhero headquarters with secret rooms\n\u003cbr>• Sophisticated security systems and traps\n\u003cbr>• Redstone machines that work automatically\n\u003cbr>• Logic gates for clever devices and computers\n\u003cbr>• Vehicles and equipment for your superheroes\n\u003cp>What you learn:\nYou work with redstone technology and gain an understanding of the basics of digital logic. Your machines help the superheroes on their missions.\nSign up and become part of the superhero team!","nrs":["FHE 21"]}],"bring":[],"notes":[]},"variants":[{"id":31121,"nr":"FHE 21","venue":7,"price":350,"weekId":"3-2","dates":"12 Oct – 16 Oct 2026","days":"Monday to Friday","time":"08:45–12:15","start":8.75,"end":12.25,"from":"2026-10-12T08:45:00","to":"2026-10-16T12:15:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners","ageFrom":2016,"ageTo":2019,"age":"2016–2019","free":true}]},{"id":31107,"title":"Minecraft Mars Mission Kurs: Überlebe auf dem roten Planeten","category":"Tech & crafts","activity":"Science and technology","ageFrom":2016,"ageTo":2019,"ageLabel":"2016–2019","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"Beginners","details":{"texts":[{"value":"You become a Mars colonist and build your own survival base on the red planet! You get your own building plot on our server and start with redstone engineering right away.\n\u003cp>Your Mars mission:\n\u003cbr>• Build a space base that withstands extreme conditions\n\u003cbr>• Build solar panels for the power supply\n\u003cbr>• Construct vending machines to generate energy from food\n\u003cbr>• Create robots for exploration and settlement\n\u003cbr>• Develop survival strategies for Mars\n\u003cp>What you learn:\n\u003cbr>• You work with complex redstone technology and develop real survival strategies along the way\n\u003cbr>• Logical thinking and creative problem-solving are the focus - every challenge on Mars calls for well-thought-out solutions.\n\u003cp> Pack your virtual space suit and start your Mars mission!","nrs":["FMC 11"]}],"bring":[],"notes":[]},"variants":[{"id":31107,"nr":"FMC 11","venue":7,"price":350,"weekId":"3-1","dates":"5 Oct – 9 Oct 2026","days":"Monday to Friday","time":"08:45–12:15","start":8.75,"end":12.25,"from":"2026-10-05T08:45:00","to":"2026-10-09T12:15:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners","ageFrom":2016,"ageTo":2019,"age":"2016–2019","free":true}]},{"id":31108,"title":"Minecraft Maze: Erschaffe deine eigene Escape Room-Welt!","category":"Tech & crafts","activity":"Science and technology","ageFrom":2012,"ageTo":2016,"ageLabel":"2012–2016","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"Advanced","details":{"texts":[{"value":"Create your own escape room adventure in Minecraft! You learn how to build exciting puzzles, traps and secret doors.\n\u003cp>What you develop:\n\u003cbr>• Your own escape room game with various rooms and puzzles\n\u003cbr>• Redstone circuits for automatic doors and mechanisms\n\u003cbr>• Tricky mazes with hidden clues\n\u003cbr>• Logic puzzles that challenge other players\n\u003cbr>• A treasure chamber as a reward for solved tasks\n\u003cp>How it works:\n\u003cbr>• Step by step you learn advanced techniques you don't know yet - from complex redstone circuits to clever puzzle mechanics. Even experienced Minecraft players discover new tricks!\n\u003cbr>• You work in your own Minecraft world and at the end you test the other participants' escape rooms","nrs":["FMZ 11"]}],"bring":[],"notes":[]},"variants":[{"id":31108,"nr":"FMZ 11","venue":7,"price":350,"weekId":"3-1","dates":"5 Oct – 9 Oct 2026","days":"Monday to Friday","time":"12:45–16:15","start":12.75,"end":16.25,"from":"2026-10-05T12:45:00","to":"2026-10-09T16:15:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Advanced","ageFrom":2012,"ageTo":2016,"age":"2012–2016","free":true}]},{"id":31119,"title":"Minecraft Modding","category":"Tech & crafts","activity":"Science and technology","ageFrom":2013,"ageTo":2015,"ageLabel":"2013–2015","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"","details":{"texts":[{"value":"Have you been playing Minecraft for a while? Then learn how to develop your own mods and expand your game with new content!\n\u003cp>What you create:\n\u003cbr>• Your own characters such as Herobrine or completely new creatures\n\u003cbr>• Special weapons and tools with unique abilities\n\u003cbr>• Vehicles and other useful items\n\u003cbr>• A complete mod pack for your Minecraft\n\u003cp>Your tools:\nYou work with Blockbench for 3D models and MCreator for programming. Along the way you get to know the basics of coding – variables, loops and branches are explained in an easy-to-understand way.\n\u003cp>Why take part:\nYou put your ideas into practice and develop programming skills at the same time. Instead of just playing, you reshape Minecraft the way you imagine it.\nSign up and take
