,"time":"13:00–15:00","start":13,"end":15,"from":"2026-10-05T13:00:00","to":"2026-10-07T15:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners and advanced","ageFrom":2017,"ageTo":2019,"age":"2017–2019","free":true},{"id":30162,"nr":"MTB 15","venue":88,"price":85,"weekId":"3-1","dates":"8 Oct – 10 Oct 2026","days":"Thursday to Saturday","time":"13:00–15:00","start":13,"end":15,"from":"2026-10-08T13:00:00","to":"2026-10-10T15:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners and advanced","ageFrom":2017,"ageTo":2019,"age":"2017–2019","free":true}]},{"id":30124,"title":"Mountainbike","category":"Nature & adventure","activity":"Mountain biking","ageFrom":2013,"ageTo":2017,"ageLabel":"2013–2017","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"Advanced","details":{"texts":[{"value":"Level Ibex: You already have experience riding over obstacles. To control your bike even better, you learn demanding balance exercises, drops and jumps. You learn to master moderately steep sections/trails on your bike. Fun and enjoyment of biking are the main focus.","nrs":["MTB 13","MTB 16"]}],"bring":[{"value":"Sports clothes, shoes with flat soles, bike gloves, small backpack with an energy bar and a drink. Bikes and\nprotective gear must be brought along.","nrs":["MTB 13","MTB 16"]}],"notes":[{"value":"The course takes place from Monday to Wednesday.","nrs":["MTB 13"]},{"value":"The course takes place from Thursday to Saturday.","nrs":["MTB 16"]}]},"variants":[{"id":30124,"nr":"MTB 13","venue":88,"price":85,"weekId":"3-1","dates":"5 Oct – 7 Oct 2026","days":"Monday to Wednesday","time":"15:00–17:00","start":15,"end":17,"from":"2026-10-05T15:00:00","to":"2026-10-07T17:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Advanced","ageFrom":2013,"ageTo":2017,"age":"2013–2017","free":true},{"id":30163,"nr":"MTB 16","venue":88,"price":85,"weekId":"3-1","dates":"8 Oct – 10 Oct 2026","days":"Thursday to Saturday","time":"15:00–17:00","start":15,"end":17,"from":"2026-10-08T15:00:00","to":"2026-10-10T17:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Advanced","ageFrom":2013,"ageTo":2017,"age":"2013–2017","free":true}]},{"id":30650,"title":"Musik- und Bewegungswoche: Der Nordwind und die Sonne","category":"Dance, music & stage","activity":"Theatre and dance","ageFrom":2019,"ageTo":2021,"ageLabel":"2019–2021","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"","details":{"texts":[{"value":"The wind and the sun play \"topsy-turvy world\" with people! Together they even mix up the seasons. What nobody knows: the wind and the sun have made a bet. Who is the stronger one and can better prove their power? Lots of movement and dancing, musical experiences and acting out the story await the children in this varied week. \n\u003cp>\nThis course is aimed at children who are already attending the second year of kindergarten.","nrs":["FMB 11","FMB 12"]}],"bring":[{"value":"comfortable clothing, gym shoes, a snack, a drink","nrs":["FMB 11","FMB 12"]}],"notes":[{"value":"This course is aimed at children who are already attending the second year of kindergarten.","nrs":["FMB 11","FMB 12"]}]},"variants":[{"id":30650,"nr":"FMB 11","venue":89,"price":160,"weekId":"3-1","dates":"5 Oct – 9 Oct 2026","days":"Monday to Friday","time":"09:00–12:00","start":9,"end":12,"from":"2026-10-05T09:00:00","to":"2026-10-09T12:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"","ageFrom":2019,"ageTo":2021,"age":"2019–2021","free":true},{"id":31479,"nr":"FMB 12","venue":89,"price":160,"weekId":"3-1","dates":"5 Oct – 9 Oct 2026","days":"Monday to Friday","time":"13:30–16:30","start":13.5,"end":16.5,"from":"2026-10-05T13:30:00","to":"2026-10-09T16:30:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"","ageFrom":2019,"ageTo":2021,"age":"2019–2021","free":true}]},{"id":31487,"title":"Mutig wie ein Löwe und eine Löwin - Waldabenteuer für starke Kinder","category":"Nature & adventure","activity":"Nature and adventure","ageFrom":2017,"ageTo":2020,"ageLabel":"2017–2020","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"","details":{"texts":[{"value":"Do you fancy an exciting holiday week full of games, nature and adventure?\nWould you like to discover what you're really capable of?\nIn this special holiday week we'll go on a journey together to our inner superpowers and strengthen our resilience. Outdoors in the forest, while playing, crafting, storytelling and exploring, you'll learn how to deal with difficult situations, how to become brave, stay calm or come up with new ideas.\nYour personal power animal will accompany you throughout the whole week!\nMaybe it's a brave lion, a patient tortoise or an attentive deer? Your power animal will help you get to know your own strengths better and use them in everyday life. \u003cp>\n\nHere's what awaits you: \u003cbr>\n• fun games and creative tasks \u003cbr>\n• lots of time outdoors in the forest \u003cbr>\n• crafting, painting and fantasy journeys \u003cbr>\n• laughing, discovering and making friends together \u003cbr>\n• small exercises for relaxing and feeling good \u003cp>\n\nAnd along the way you'll learn:\u003cbr>\n• to understand your feelings better \u003cbr>\n• to solve problems creatively \u003cbr>\n• to believe in yourself \u003cbr>\n• to work well with others \u003cbr>\n• to find calm and recharge your energy \u003cp>\n\nThe course is aimed at children aged about 5–9 who enjoy movement, games and nature.\nYou don't need any previous experience, just curiosity and a desire for adventure!\nWe're looking forward to a colourful, cheerful week full of discoveries,\nbecause every child has a great strength inside! \u003cp>\n\n\u003cp> This course is run by a team of experienced educators from Schulinnovation GmbH (\u003ca href=\"https://www.schulinnovation.ch\" target=\"_blank\" rel=\"noopener noreferrer\">www.schulinnovation.ch\u003c/a>).","nrs":["FML 11"]}],"bring":[{"value":"Weather-appropriate clothing and sturdy shoes, lunch and a morning snack, water bottle filled with water","nrs":["FML 11"]}],"notes":[{"value":"The adventure takes place in the forest adjoining the Segetenhaus. If the weather doesn't cooperate, we have the option of holding the activities in the beautiful rooms of the Segetenhaus.","nrs":["FML 11"]}]},"variants":[{"id":31487,"nr":"FML 11","venue":90,"price":395,"weekId":"3-1","dates":"5 Oct – 8 Oct 2026","days":"Monday to Thursday","time":"09:00–16:00","start":9,"end":16,"from":"2026-10-05T09:00:00","to":"2026-10-08T16:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"","ageFrom":2017,"ageTo":2020,"age":"2017–2020","free":true}]},{"id":30949,"title":"Naturtage bei den Schöflis","category":"Nature & adventure","activity":"Nature and adventure","ageFrom":2014,"ageTo":2020,"ageLabel":"2014–2020","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"","details":{"texts":[{"value":"We spend two adventurous days with great activities all about the Schöflis and nature. We stroke, brush and feed the Schöflis and learn what they need for a happy life and what their needs are. With us they are not kept as farm animals, but\n are part of the family.\nThere is also plenty of exciting things to discover in the nature workshop: we do crafts with natural materials, harvest fruit and much more!","nrs":["FNS 21"]}],"bring":[{"value":"Vegetarian lunch, weather-appropriate clothing that is allowed to get dirty, and sturdy shoes.","nrs":["FNS 21"]}],"notes":[]},"variants":[{"id":30949,"nr":"FNS 21","venue":44,"price":160,"weekId":"3-2","dates":"12 Oct – 13 Oct 2026","days":"Monday to Tuesday","time":"10:00–15:00","start":10,"end":15,"from":"2026-10-12T10:00:00","to":"2026-10-13T15:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"","ageFrom":2014,"ageTo":2020,"age":"2014–2020","free":true}]},{"id":31470,"title":"Nuori Wunderkurs Krafttiere","category":"Tech & crafts","activity":"Crafts and making","ageFrom":2015,"ageTo":2022,"ageLabel":"2015–2022","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"","details":{"texts":[{"value":"In the Wonder Courses we enter magical worlds together around particular themes:\nPower animals are helpful companions in everyday life. Which one supports you personally? In this workshop you can find out and connect with it. A story will lead you to your own power animal, which you can then paint and craft using a wide variety of materials. And further wonderful opportunities to play and create are waiting for you.\n\u003cbr>\nMore information at: \n\u003ca href=\"https://www.malspielraum.ch/\" target=\"_blank\" rel=\"noopener noreferrer\">www.nuori.ch\u003c/a> \n\u003cp> To take part in this course you must already be attending the first year of kindergarten.","nrs":["FWT 21"]}],"bring":[{"value":"Afternoon snack","nrs":["FWT 21"]}],"notes":[{"value":"Painting aprons and shoes are available in the studio\nTo take part in this course you must already be attending the first year of kindergarten.","nrs":["FWT 21"]}]},"variants":[{"id":31470,"nr":"FWT 21","venue":17,"price":50,"weekId":"3-2","dates":"15 Oct 2026","days":"Thursday","time":"14:00–16:00","start":14,"end":16,"from":"2026-10-15T14:00:00","to":"2026-10-15T16:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"","ageFrom":2015,"ageTo":2022,"age":"2015–2022","free":true}]},{"id":31467,"title":"Nuori Wunderkurs Kristalle","category":"Tech & crafts","activity":"Crafts and making","ageFrom":2014,"ageTo":2022,"ageLabel":"2014–2022","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"","details":{"texts":[{"value":"In the Wonder Courses we dive together into magical worlds around particular themes:\nIn this course we explore the nature of gemstones and crystals. We will discover the colours and energies of individual stones and learn more about their effects. You can listen to the story of a journey into the inside of a crystal and let your own images of the wonderful things to be found there come to life. Afterwards you can paint this and turn it into creative work. As always, accompanied by sounds as well as enchanting opportunities to play and create.\nMore information at: \n\u003ca href=\"https://www.malspielraum.ch/\" target=\"_blank\" rel=\"noopener noreferrer\">www.nuori.ch\u003c/a> \n\u003cp> To take part in this course you must already be attending kindergarten.","nrs":["FWK 21"]}],"bring":[{"value":"Afternoon snack","nrs":["FWK 21"]}],"notes":[{"value":"To take part in this course you must already be attending kindergarten.\nPainting aprons and shoes are available in the studio","nrs":["FWK 21"]}]},"variants":[{"id":31467,"nr":"FWK 21","venue":17,"price":50,"weekId":"3-2","dates":"13 Oct 2026","days":"Tuesday","time":"14:00–16:00","start":14,"end":16,"from":"2026-10-13T14:00:00","to":"2026-10-13T16:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"","ageFrom":2014,"ageTo":2022,"age":"2014–2022","free":true}]},{"id":30136,"title":"Padel","category":"Ball sports","activity":"Tennis","ageFrom":2016,"ageTo":2019,"ageLabel":"2016–2019","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"Beginners and advanced","details":{"texts":[{"value":"A week full of movement, play and enthusiasm: padel is a beginner-friendly mix of tennis and squash and is fun right from the first lesson.\u003cp>\nDuring the course week you learn the technique in a playful way and gain a clever understanding of tactics. Speed and coordination are trained along the way.\nExperience team spirit and fair play and put what you have learned to the test in great matches.","nrs":["PAD 21"]}],"bring":[{"value":"Sports clothes, clean tennis or indoor shoes. Water bottle. Rackets and balls are provided.","nrs":["PAD 21"]}],"notes":[]},"variants":[{"id":30136,"nr":"PAD 21","venue":91,"price":125,"weekId":"3-2","dates":"12 Oct – 16 Oct 2026","days":"Monday to Friday","time":"09:00–10:30","start":9,"end":10.5,"from":"2026-10-12T09:00:00","to":"2026-10-16T10:30:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners and advanced","ageFrom":2016,"ageTo":2019,"age":"2016–2019","free":true}]},{"id":31430,"title":"Padel","category":"Ball sports","activity":"Tennis","ageFrom":2012,"ageTo":2015,"ageLabel":"2012–2015","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"Beginners and advanced","details":{"texts":[{"value":"A week full of movement, play and enthusiasm: padel is a beginner-friendly mix of tennis and squash and is fun right from the first lesson.\u003cp>\nDuring the course week you learn the technique in a playful way and gain a clever understanding of tactics. Speed and coordination are trained along the way.\nExperience team spirit and fair play and put what you have learned to the test in great matches.","nrs":["PAD 22"]}],"bring":[{"value":"Sports clothes, clean tennis or indoor shoes. Water bottle. Rackets and balls are provided.","nrs":["PAD 22"]}],"notes":[]},"variants":[{"id":31430,"nr":"PAD 22","venue":91,"price":125,"weekId":"3-2","dates":"12 Oct – 16 Oct 2026","days":"Monday to Friday","time":"10:30–12:00","start":10.5,"end":12,"from":"2026-10-12T10:30:00","to":"2026-10-16T12:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners and advanced","ageFrom":2012,"ageTo":2015,"age":"2012–2015","free":true}]},{"id":30125,"title":"Parkour nach TRUST","category":"Movement & fitness","activity":"Parkour","ageFrom":2013,"ageTo":2019,"ageLabel":"2013–2019","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"Beginners and advanced","details":{"texts":[{"value":"In this course, experienced coaches from ParkourONE teach you the basics of the art of efficient movement – parkour. Participants learn to safely overcome obstacles such as walls, bars and stairs, experience the philosophy and values such as respect and self-confidence, and are encouraged physically, mentally and creatively.\u003cp>\nAs a response to social challenges such as lack of exercise, excessive mobile phone use or stress and pressure to perform, parkour motivates children to move outdoors, explore their surroundings and overcome limits.","nrs":["PAR 11","PAR 12"]}],"bring":[{"value":"Drinks and good shoes (running shoes, sports shoes). Sporty clothing that is allowed to get dirty. Training generally takes place outdoors, so please dress according to the weather conditions.","nrs":["PAR 11","PAR 12"]}],"notes":[{"value":"TRUST comprises the three educational goals of unfolding potential, values and health promotion. Parkour according to TRuST therefore goes beyond the physical component and strengthens holistic learning, personal development and social interaction.","nrs":["PAR 11","PAR 12"]}]},"variants":[{"id":30125,"nr":"PAR 11","venue":37,"price":150,"weekId":"3-1","dates":"5 Oct – 9 Oct 2026","days":"Monday to Friday","time":"10:00–12:00","start":10,"end":12,"from":"2026-10-05T10:00:00","to":"2026-10-09T12:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners and advanced","ageFrom":2013,"ageTo":2019,"age":"2013–2019","free":true},{"id":30126,"nr":"PAR 12","venue":37,"price":150,"weekId":"3-1","dates":"5 Oct – 9 Oct 2026","days":"Monday to Friday","time":"13:00–15:00","start":13,"end":15,"from":"2026-10-05T13:00:00","to":"2026-10-09T15:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners and advanced","ageFrom":2013,"ageTo":2019,"age":"2013–2019","free":true}]},{"id":31466,"title":"Pinsel, Stift und Farbe (K’Werk Zürich)","category":"Tech & crafts","activity":"Crafts and making","ageFrom":2014,"ageTo":2017,"ageLabel":"2014–2017","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"","details":{"texts":[{"value":"We paint, draw, cut and glue! We try things out, experiment with brush, pencil and paint and invent new characters, faces and stories.\nMake your own little comic story with collages, drawings and text. How the story is told is up to you - with several small pictures or a few larger ones... \u003cbr>\nAt the end of the course you take home your own little booklet with your creations.\u003cp>\n\u003cstrong>K'Werk Zürich stands for high artistic quality. The children and young people are guided by experienced artists.\u003c/strong>","nrs":["FPS 21"]}],"bring":[{"value":"a snack, a drink","nrs":["FPS 21"]}],"notes":[{"value":"Course leader: Sarah Parsons, graphic designer and illustrator","nrs":["FPS 21"]}]},"variants":[{"id":31466,"nr":"FPS 21","venue":49,"price":350,"weekId":"3-2","dates":"12 Oct – 16 Oct 2026","days":"Monday to Friday","time":"09:00–12:00","start":9,"end":12,"from":"2026-10-12T09:00:00","to":"2026-10-16T12:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"","ageFrom":2014,"ageTo":2017,"age":"2014–2017","free":true}]},{"id":31029,"title":"Polysport / Code Camp","category":"Combined courses","activity":"—","ageFrom":2013,"ageTo":2018,"ageLabel":"2013–2018","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"Beginners","details":{"texts":[{"value":"Depending on the weather, we spend the morning in the Turnhalle Allmend gym or on the sports field with a wide variety of mixed sports, with fun and games taking centre stage. Each afternoon, Code Camp takes you on a playful journey through drag & drop programming. Under expert guidance, you programme your very own first game. After the course you can keep developing the game at home at any time and share it with your friends and family. An exciting and varied holiday camp!","nrs":["POCC 11"]}],"bring":[{"value":"Sports clothes, indoor shoes, lunch and a drink","nrs":["POCC 11"]}],"notes":[{"value":"You will be supervised over lunchtime, but you need to bring your lunch from home. / The meeting and pick-up point is at Maneggpatz 44, 8041 Zürich. The course runs from 10:00-16:00; however, children can be dropped off as early as 09:30 in the morning and picked up until 16:30 in the evening.","nrs":["POCC 11"]}]},"variants":[{"id":31029,"nr":"POCC 11","venue":66,"price":380,"weekId":"3-1","dates":"5 Oct – 9 Oct 2026","days":"Monday to Friday","time":"10:00–16:00","start":10,"end":16,"from":"2026-10-05T10:00:00","to":"2026-10-09T16:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners","ageFrom":2013,"ageTo":2018,"age":"2013–2018","free":true}]},{"id":31427,"title":"Polysport-Schwimmen-Camp","category":"Movement & fitness","activity":"Multi-sport","ageFrom":2013,"ageTo":2020,"ageLabel":"2013–2020","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"Beginners and advanced","details":{"texts":[{"value":"Sporting variety in the water and on land: this camp offers you a perfect mix of multi-sports and swimming. You will experience varied sports games and exciting sports such as football, floorball, parkour and much more. Added to this are refreshing sessions in the water, where you can playfully improve your swimming technique and build up your stamina. About half of the lessons take place in the water, providing intensive but playful development of swimming skills. Whether in the water or on land: what counts here is movement, fun and the shared experience. A camp full of energy, variety and unforgettable moments.\u003cp>\nBefore- and after-care can be booked via the following link \u003ca href=\"https://anmeldung.kinder-camps.ch/anmeldung/kurs/370969?kursCode=kombi-polysport-schwimmen-zurich-sb-2610&modulId=6533\" target=\"_blank\" rel=\"noopener noreferrer\">Book before- and after-care\u003c/a>\u003cp>\nVia this link you book the additional care only. Registration for the camp is required and is done through the Sports Office of the City of Zürich.","nrs":["POLS 21"]}],"bring":[{"value":"Sportswear, trainers, swimwear, towel, shower gel, water bottle, morning snack and afternoon snack","nrs":["POLS 21"]}],"notes":[{"value":"The price includes lunch with drinks and a T-shirt. The organiser also offers before- and after-care from 08:00-09:30 and/or 16:00-17:30, bookable via the link in the online course description. Registration for the camp is required and is done through the Sports Office of the City of Zürich. Before-care on the first day of camp and after-care on the last day of camp cannot be booked. Cost per additional care session: CHF 15.00. No minimum swimming ability is required to take part in the camp.","nrs":["POLS 21"]}]},"variants":[{"id":31427,"nr":"POLS 21","venue":92,"price":400,"weekId":"3-2","dates":"12 Oct – 16 Oct 2026","days":"Monday to Friday","time":"09:30–16:00","start":9.5,"end":16,"from":"2026-10-12T09:30:00","to":"2026-10-16T16:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners and advanced","ageFrom":2013,"ageTo":2020,"age":"2013–2020","free":true}]},{"id":30057,"title":"Polysportive Woche","category":"Movement & fitness","activity":"Multi-sport","ageFrom":2014,"ageTo":2022,"ageLabel":"2014–2022","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"Beginners and advanced","details":{"texts":[{"value":"During this week you will experience games, fun and action in your neighbourhood with old and new friends. A varied, multi-sport week with five different indoor and outdoor sports awaits you. To take part in this course, you must already be attending kindergarten. \u003cp>Please provide further information about your child (group requests, allergies, shirt sizes, etc.) via the following link:\n\u003ca>Further information about your child\u003c/a>","nrs":["KSWZ 11"]}],"bring":[{"value":"Sportswear for indoor and outdoor sports. Rain jacket and rain trousers, trainers, indoor shoes, water bottle","nrs":["KSWZ 11"]}],"notes":[{"value":"The price includes the morning snack, lunch and the afternoon snack. Detailed information about how the camp runs will be sent to you directly by the camp organisers by e-mail. Optional supervision at the edges of the day (08:00-09:00 and 16:00-18:00 in the foyer) is available. It can be booked via a link after you receive the final course confirmation, or on site. Please provide further information about your child, such as group requests, allergies, shirt sizes etc., via the link in the online listing.","nrs":["KSWZ 11"]}]},"variants":[{"id":30057,"nr":"KSWZ 11","venue":93,"price":360,"weekId":"3-1","dates":"5 Oct – 9 Oct 2026","days":"Monday to Friday","time":"09:00–16:00","start":9,"end":16,"from":"2026-10-05T09:00:00","to":"2026-10-09T16:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners and advanced","ageFrom":2014,"ageTo":2022,"age":"2014–2022","free":true}]},{"id":30090,"title":"Polysportive Woche - Fun & Action Camp","category":"Movement & fitness","activity":"Multi-sport","ageFrom":2013,"ageTo":2020,"ageLabel":"2013–2020","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"Beginners and advanced","details":{"texts":[{"value":"Fun, games and sporting variety – all in one camp! These camps offer you a colourful sports programme under professional guidance (e.g. football, floorball, self-defence, hip-hop, acrobatics, coordination and parkour). Depending on the location and the season, different activities are on the programme.\u003cp>\nCare before and after the camp can be booked via the following link \u003ca href=\"https://anmeldung.kinder-camps.ch/anmeldung/kurs/321371?kursCode=pol-zurich-bl-2610&modulId=6533\" target=\"_blank\" rel=\"noopener noreferrer\">Book before- and after-camp care\u003c/a>\u003cp>\nThis link is only for booking the additional care. Registration for the camp itself is required and is done through the Sports Office of the City of Zürich.","nrs":["POWO 21"]}],"bring":[{"value":"Sports clothing, trainers, water bottle, morning snack and afternoon snack","nrs":["POWO 21"]}],"notes":[{"value":"The price includes lunch with drinks and a T-shirt. In addition, early and late care from 08:00-09:30 and/or 16:00-17:30 can be booked with the provider via the link in the online listing. Registration for the camp is required and is done through the Sports Office of the City of Zürich. Early care on the first day of camp and late care on the last day of camp cannot be booked. Cost per additional care session: CHF 15.","nrs":["POWO 21"]}]},"variants":[{"id":30090,"nr":"POWO 21","venue":67,"price":320,"weekId":"3-2","dates":"12 Oct – 16 Oct 2026","days":"Monday to Friday","time":"09:30–16:00","start":9.5,"end":16,"from":"2026-10-12T09:30:00","to":"2026-10-16T16:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners and advanced","ageFrom":2013,"ageTo":2020,"age":"2013–2020","free":true}]},{"id":30089,"title":"Polysportives Sportcamp Tenero","category":"Movement & fitness","activity":"Multi-sport","ageFrom":2010,"ageTo":2016,"ageLabel":"2010–2016","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"Beginners and advanced","details":{"texts":[{"value":"In this varied camp you have the chance to try out lots of exciting sports – including swimming, diving, climbing, canoeing, stand-up paddling, squash, beach soccer, trampolining, football, baseball, beach volleyball, tennis, badminton and floorball. The daily programme is particularly appealing: every day three different sports await you, so boredom is guaranteed not to set in.\u003cp>\nYou will sleep in a spacious communal tent in Tenero – a real adventure in the open air. A modern on-site canteen takes care of the catering. Fresh, balanced meals are prepared every day. Meals are included in the price.","nrs":["POTE 42"]}],"bring":[{"value":"Enough sports clothes and clothes for free time. Everyone must bring their own sleeping bag. Cosy warm wool blankets are available for cold nights.","nrs":["POTE 42"]}],"notes":[{"value":"All further details about the camp will be sent by separate post. If you have questions about the camp beforehand, you can contact the camp management directly: Ueli Lüscher, ueli@tls.ch.","nrs":["POTE 42"]}]},"variants":[{"id":30089,"nr":"POTE 42","venue":94,"price":450,"weekId":"3-2","dates":"11 Oct – 16 Oct 2026","days":"Sunday to Friday","time":"09:00–19:00","start":9,"end":19,"from":"2026-10-11T09:00:00","to":"2026-10-16T19:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners and advanced","ageFrom":2010,"ageTo":2016,"age":"2010–2016","free":true}]},{"id":30127,"title":"Pool Billard","category":"Ball sports","activity":"Billiards","ageFrom":2011,"ageTo":2018,"ageLabel":"2011–2018","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"Beginners and advanced","details":{"texts":[{"value":"Pool billiards is considered one of the technically most demanding sports in the world. Learn the basic techniques of this fascinating game with the cue.","nrs":["POB 11","POB 21","POB 22"]}],"bring":[{"value":"normal everyday clothes","nrs":["POB 11","POB 21","POB 22"]}],"notes":[]},"variants":[{"id":30127,"nr":"POB 11","venue":95,"price":120,"weekId":"3-1","dates":"5 Oct – 9 Oct 2026","days":"Monday to Friday","time":"14:00–16:00","start":14,"end":16,"from":"2026-10-05T14:00:00","to":"2026-10-09T16:00:00","deadline":"2026-09-13T23:59:59","status":"Book "level":"Beginners and advanced","details":{"texts":[{"value":"During the tennis camp week you learn the basic techniques of tennis. Alongside the many felt balls hit, a multi-sport programme provides variety.","nrs":["TEBE 11","TEBE 21","TEMI 11","TEMI 21","TESO 11","TESO 21"]},{"value":"Under the guidance of experienced coaches you will learn the basics of tennis and improve your technique. Whether you are a beginner or already a bit more experienced, there is something here for everyone! Alongside time on the tennis court, various exciting games and exercises await you that develop your coordination and fitness.\u003cp>\nMeet others your age who enjoy tennis as much as you do. Together you will take on exciting challenges and celebrate your successes! At the end of the week you can show what you can do in an exciting tournament.\u003cp>\nJoin in and experience a week full of energy, team spirit and unforgettable moments on the tennis court!","nrs":["TEUE 11","TEUE 21"]}],"bring":[{"value":"Sports clothes, clay court shoes (indoor shoes in bad weather), drinks and snacks. Bring a tennis racket if you have one, otherwise the tennis club will provide one.","nrs":["TEBE 11","TEBE 21"]},{"value":"Sports clothes, outdoor and indoor shoes, drinks and snacks, shower things. Bring a tennis racket if you have one, otherwise the tennis club will provide one.","nrs":["TEMI 11","TEMI 21"]},{"value":"Sports clothes, tennis shoes and a drink. Tennis rackets are provided.","nrs":["TESO 11","TESO 21","TEUE 11","TEUE 21"]}],"notes":[{"value":"Lunch and supervision are included in the course fee.","nrs":["TEBE 11","TEBE 21","TEMI 11","TEMI 21"]},{"value":"Lunch, snacks and supervision are included in the course fee.\nThe course takes place in any weather. In wet weather an indoor hall is available.","nrs":["TESO 11","TESO 21"]},{"value":"Lunch and snacks are included in the course fee.\nThe course takes place in any weather. The youngest age groups must already be attending kinderg -10-16T16:30:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners and advanced","ageFrom":2013,"ageTo":2020,"age":"2013–2020","free":true}]},{"id":31436,"title":"Textildruck Lab *Sek*","category":"Tech & crafts","activity":"Crafts and making","ageFrom":2010,"ageTo":2015,"ageLabel":"2010–2015","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"","details":{"texts":[{"value":"\u003cstrong>Print your Style\u003c/strong> \u003cp>\nThis holiday course is aimed at young people who enjoy designing and experimenting with textile printing. Here you learn how to make your own stamps and print on fabric using the screen-printing technique.\u003cp>\nYou can bring your own textile, for example a T-shirt, a pencil case or a fabric bag.\u003cp>\nThe course offers space to turn creative ideas into fabric designs and to experiment with different printing techniques.\u003cp>\nDuring the course there is a half-hour break outdoors. More information at: \u003ca href=\"http://decolor.ch/\" target=\"_blank\" rel=\"noopener noreferrer\">www.decolor.ch\u003c/a>","nrs":["FTL 11"]}],"bring":[{"value":"Slippers and a snack. Wear clothes that are allowed to get dirty, plus weather-appropriate clothing for the break.\nYou can bring your own textile, for example a T-shirt, a pencil case or a fabric bag.\nVarious textiles (tote bags, pencil cases, T-shirts) can also be bought directly at the studio. T-shirts at the studio: CHF 10, pencil cases: CHF 3, tote bags: CHF 5.","nrs":["FTL 11"]}],"notes":[]},"variants":[{"id":31436,"nr":"FTL 11","venue":53,"price":260,"weekId":"3-1","dates":"5 Oct – 9 Oct 2026","days":"Monday to Friday","time":"14:00–17:00","start":14,"end":17,"from":"2026-10-05T14:00:00","to":"2026-10-09T17:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"","ageFrom":2010,"ageTo":2015,"age":"2010–2015","free":true}]},{"id":30685,"title":"Theaterabenteuer und Geschichtenspiel","category":"Dance, music & stage","activity":"Theatre and dance","ageFrom":2018,"ageTo":2021,"ageLabel":"2018–2021","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"","details":{"texts":[{"value":"Set off on an adventurous journey and dive into the world of theatre and stories. During this week we will develop a short play together with lots of fun and imagination and present it at the end of the week. The focus is on the joy of playing, sensory experience, physical expression and the wonderful feeling that comes from creating something together. We look forward to seeing you.","nrs":["FTG 21"]}],"bring":[{"value":"Comfortable clothes, non-slip socks or slippers, a small snack (afternoon snack) and a drink","nrs":["FTG 21"]}],"notes":[]},"variants":[{"id":30685,"nr":"FTG 21","venue":117,"price":180,"weekId":"3-2","dates":"12 Oct – 16 Oct 2026","days":"Monday to Friday","time":"14:00–17:00","start":14,"end":17,"from":"2026-10-12T14:00:00","to":"2026-10-16T17:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"","ageFrom":2018,"ageTo":2021,"age":"2018–2021","free":true}]},{"id":30667,"title":"Theaterkreation im Wald","category":"Dance, music & stage","activity":"Theatre and dance","ageFrom":2014,"ageTo":2018,"ageLabel":"2014–2018","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"","details":{"texts":[{"value":"Do you love the forest?  \u003cbr>\nDo you enjoy playing with your body, your voice and nature? \u003cbr>\nDo you like listening to the stories the forest tells you? \u003cbr>\nAnd would you like to turn these stories, together with others, into an imaginative storytelling theatre in the forest? Then this holiday course is just the thing for you!\n\u003cp>\nIn \"Theatre creation in the forest\" we explore which stories the forest holds hidden. We discover what sounds arise when we play with natural materials, and what stories these sounds tell us. With improvisations and playful experiments we develop a musical theatre story together. In doing so we will explore forms of storytelling and music theatre. We combine our creations into a unique, forest-inspired showcase, which we will present outdoors to your parents and friends on Friday at 16:00.\nThe focus is on playful exploration with the body, voice and natural materials as instruments, as well as the joy of creating together. With our curiosity and our imagination we transform the natural surroundings into living stories.\n\u003cp>\nThe holiday course is led by Katrin Sauter, theatre educator, and Miriam Sutter, singer, both of whom also bring experience of working with children in nature.","nrs":["FAK 21"]}],"bring":[{"value":"Comfortable outdoor clothing suited to the weather, morning snack, packed lunch, drink","nrs":["FAK 21"]}],"notes":[{"value":"The meeting point is at the Zehntenhausplatz stop. We gather there in the morning at 09:30 and say goodbye again at 16:30.\nYou will be supervised over lunchtime; please bring your lunch from home.\nWe spend the whole day in the forest.\nThe Waldschule Hönggerberg gives us shelter when it rains.\nShowcase: Fri, 16.10.26 at 16:00","nrs":["FAK 21"]}]},"variants":[{"id":30667,"nr":"FAK 21","venue":118,"price":390,"weekId":"3-2","dates":"12 Oct – 16 Oct 2026","days":"Monday to Friday","time":"09:30–16:30","start":9.5,"end":16.5,"from":"2026-10-12T09:30:00","to":"2026-10-16T16:30:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"","ageFrom":2014,"ageTo":2018,"age":"2014–2018","free":true}]},{"id":30948,"title":"Tierheld*innen in Action","category":"Nature & adventure","activity":"Nature and adventure","ageFrom":2014,"ageTo":2020,"ageLabel":"2014–2020","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"","details":{"texts":[{"value":"The little animal heroes learn what good they can do for wild animals, pets and farm animals, and we put the first brave heroic deeds into practice right away. Here they learn what it means to keep animals responsibly and experience first-hand what their animal friends need to be happy. We will be accompanied by our 13 affectionate Schöflis.","nrs":["FTA 21"]}],"bring":[{"value":"Vegetarian lunch, weather-appropriate clothing that is allowed to get dirty, and sturdy shoes.","nrs":["FTA 21"]}],"notes":[]},"variants":[{"id":30948,"nr":"FTA 21","venue":44,"price":80,"weekId":"3-2","dates":"14 Oct 2026","days":"Wednesday","time":"10:00–15:00","start":10,"end":15,"from":"2026-10-14T10:00:00","to":"2026-10-14T15:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"","ageFrom":2014,"ageTo":2020,"age":"2014–2020","free":true}]},{"id":30627,"title":"Tierischer Nachmittag beim Zürcher Tierschutz","category":"Nature & adventure","activity":"Nature and adventure","ageFrom":2017,"ageTo":2019,"ageLabel":"2017–2019","mixedAges":false,"mixedLevels":false,"gender":"Girls and boys","level":"","details":{"texts":[{"value":"Have you always wanted to take a look behind the scenes of the most modern animal shelter in Switzerland? And do you know what a cat boarding house is? Here at Zürcher Tierschutz, cats live alongside dogs, rabbits, snakes and more until they have found a new home. Get to know our animal residents up close and find out what animals need to be happy. We will meet a dog and also cats that usually enjoy being stroked, but they get to decide for themselves whether they feel like it at that moment. Many animals in the shelter, however, feel more comfortable if we only watch them and do not touch them.","nrs":["FTN 11","FTN 12","FTN 21"]}],"bring":[{"value":"Food and drink for the shared afternoon snack, comfortable clothing suited to the weather and shoes that are allowed to get dirty (the programme takes place mainly indoors, but we will also be outside briefly during the guided tour)","nrs":["FTN 11","FTN 12","FTN 21"]}],"notes":[{" ":"Monday to Friday","time":"09:00–12:30","start":9,"end":12.5,"from":"2026-10-12T09:00:00","to":"2026-10-16T12:30:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"Beginners and advanced","ageFrom":2016,"ageTo":2019,"age":"2016–2019","free":true}]},{"id":30946,"title":"Zum Hundeprofi werden","category":"Nature & adventure","activity":"Nature and adventure","ageFrom":2013,"ageTo":2018,"ageLabel":"2013–2018","mixedAges":true,"mixedLevels":false,"gender":"Girls and boys","level":"","details":{"texts":[{"value":"You'll spend an afternoon at the dog training ground where you can get to know different dogs. You'll be shown how to understand dogs and how a dog becomes your friend. Once you've learned a lot about dogs, it's on to the practical part: you'll watch dogs going to school themselves and then get to guide a dog through a fun obstacle course yourself.","nrs":["FZH 11","FZH 21"]}],"bring":[{"value":"Snacks and a drink, weather- and cold-proof clothing, sturdy shoes, rain protection","nrs":["FZH 11","FZH 21"]}],"notes":[{"value":"The event takes place outdoors.\nMeeting point: Albisgütli tram stop","nrs":["FZH 11","FZH 21"]}]},"variants":[{"id":30946,"nr":"FZH 11","venue":135,"price":70,"weekId":"3-1","dates":"6 Oct 2026","days":"Tuesday","time":"13:00–17:00","start":13,"end":17,"from":"2026-10-06T13:00:00","to":"2026-10-06T17:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"","ageFrom":2014,"ageTo":2018,"age":"2014–2018","free":true},{"id":30955,"nr":"FZH 21","venue":135,"price":70,"weekId":"3-2","dates":"12 Oct 2026","days":"Monday","time":"13:00–17:00","start":13,"end":17,"from":"2026-10-12T13:00:00","to":"2026-10-12T17:00:00","deadline":"2026-09-13T23:59:59","status":"Bookable from 18 Aug 2026","bookable":true,"level":"","ageFrom":2013,"ageTo":2018,"age":"2013–2018","free":true}]}]}</script>
<script>"use strict";

const DATA = JSON.parse(document.getElementById("payload").textContent);
const VENUES = new Map(DATA.venues.map((v) => [v.id, v]));
const BOOKING = (id) => `https://www.stadt-zuerich.ch/sport-portal/angebot/${id}`;
const FAV_KEY = "zurich-holiday-courses:favourites";
const FILTER_KEY = "zurich-holiday-courses:filters";
// Bumped whenever the filter shape or its vocabulary changes. Stored state
// from an older build is discarded rather than left to silently match nothing.
const FILTER_SCHEMA = 2;
const KM_ANY = 15;
const PRICE_ANY = 700;

const $ = (id) => document.getElementById(id);
const el = (tag, props, ...kids) => {
  const node = Object.assign(document.createElement(tag), props);
  for (const kid of kids.flat()) if (kid != null) node.append(kid);
  return node;
};

// ------------------------------------------------------------- persistence

const load = (key, fallback) => {
  try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; }
};
const save = (key, value) => {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* private mode */ }
};

// Favourites are keyed by the course's stable API id, so a rebuild that
// reshuffles grouping keeps them attached to the right card.
const courseIds = new Set(DATA.groups.map((g) => g.id));
const favorites = new Set(load(FAV_KEY, []).filter((id) => courseIds.has(id)));
const persistFavorites = () => save(FAV_KEY, [...favorites]);

const DEFAULTS = {
  q: "", weeks: [], cats: [], activity: "", year: "", level: "", gender: "",
  km: KM_ANY, price: PRICE_ANY, start: "", end: "", favOnly: false, bookable: false,
  sort: "distance",
};
const expanded = new Set();
const openSlots = new Set();

// ------------------------------------------------------------- derived data

for (const g of DATA.groups) {
  g.haystack = [g.title, g.activity, g.category, g.ageLabel,
    ...[...g.details.texts, ...g.details.bring, ...g.details.notes].map((e) => e.value),
    ...g.variants.map((v) => `${v.nr} ${VENUES.get(v.venue).name} ${VENUES.get(v.venue).city}`)]
    .join(" ").toLowerCase();
  for (const v of g.variants) v.km = VENUES.get(v.venue).km;
}

const tally = (items, keyOf) => {
  const counts = new Map();
  for (const item of items) for (const key of [keyOf(item)].flat()) {
    counts.set(key, (counts.get(key) ?? 0) + 1);
  }
  return counts;
};

const categoryCounts = tally(DATA.groups, (g) => g.category);
const activityCounts = tally(DATA.groups, (g) => g.activity);
const weekCounts = tally(DATA.groups, (g) => [...new Set(g.variants.map((v) => v.weekId))]);
const levels = [...new Set(DATA.groups.flatMap((g) => g.variants.map((v) => v.level)))]
  .filter(Boolean).sort();
const startTimes = [...new Set(DATA.groups.flatMap((g) => g.variants.map((v) => v.start)))]
  .filter((t) => t != null).sort((a, b) => a - b);
const endTimes = [...new Set(DATA.groups.flatMap((g) => g.variants.map((v) => v.end)))]
  .filter((t) => t != null).sort((a, b) => a - b);
const years = (() => {
  const from = Math.min(...DATA.groups.map((g) => g.ageFrom));
  const to = Math.max(...DATA.groups.map((g) => g.ageTo));
  return Array.from({ length: to - from + 1 }, (_, i) => from + i);
})();

// ------------------------------------------------------------- filter state

// Restored filters are validated against the vocabulary this build actually
// has. A value that no longer exists (a renamed category, a level from the
// German build) is dropped instead of quietly matching nothing and leaving
// the user staring at an empty list.
const restoreFilters = () => {
  const stored = load(FILTER_KEY, null);
  if (!stored || stored.v !== FILTER_SCHEMA || typeof stored.filters !== "object") {
    return { ...DEFAULTS };
  }
  const saved = stored.filters;
  const oneOf = (value, allowed, fallback = "") => (allowed.includes(value) ? value : fallback);
  const subset = (value, allowed) =>
    Array.isArray(value) ? value.filter((x) => allowed.includes(x)) : [];
  // Out of the control's domain means corrupt, not "clamp me" — clamping a
  // stored -5 to 0 would restore a filter that matches nothing.
  const inRange = (value, lo, hi, fallback) =>
    typeof value === "number" && Number.isFinite(value) && value >= lo && value <= hi
      ? value : fallback;

  return {
    q: typeof saved.q === "string" ? saved.q : "",
    weeks: subset(saved.weeks, DATA.weeks.map((w) => w.id)),
    cats: subset(saved.cats, [...categoryCounts.keys()]),
    activity: oneOf(saved.activity, [...activityCounts.keys()]),
    level: oneOf(saved.level, levels),
    gender: oneOf(saved.gender, [...new Set(DATA.groups.map((g) => g.gender))]),
    year: years.includes(+saved.year) ? String(saved.year) : "",
    start: startTimes.includes(+saved.start) ? String(saved.start) : "",
    end: endTimes.includes(+saved.end) ? String(saved.end) : "",
    km: inRange(saved.km, 0, KM_ANY, KM_ANY),
    price: inRange(saved.price, 0, PRICE_ANY, PRICE_ANY),
    favOnly: saved.favOnly === true,
    bookable: saved.bookable === true,
    sort: oneOf(saved.sort, Object.keys(SORTS), DEFAULTS.sort),
  };
};

// ------------------------------------------------------------- formatting

const clock = (t) => t == null ? ""
  : `${String(Math.floor(t)).padStart(2, "0")}:${String(Math.round((t % 1) * 60)).padStart(2, "0")}`;
const money = (n) => `CHF ${n.toLocaleString("en-CH")}`;
const km = (n) => `${n.toLocaleString("en-CH", { minimumFractionDigits: 1, maximumFractionDigits: 1 })} km`;
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const day = (iso) => {
  if (!iso) return "";
  const d = new Date(iso);
  return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
};
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;

// ------------------------------------------------------------- filtering

const variantMatches = (v) =>
  (filters.weeks.length === 0 || filters.weeks.includes(v.weekId))
  && v.price <= filters.price
  && (filters.km >= KM_ANY || v.km <= filters.km)
  && (filters.start === "" || (v.start != null && v.start >= +filters.start))
  && (filters.end === "" || (v.end != null && v.end <= +filters.end))
  && (filters.year === "" || (+filters.year >= v.ageFrom && +filters.year <= v.ageTo))
  && (filters.level === "" || v.level === filters.level)
  && (!filters.bookable || v.bookable);

const groupMatches = (g) => {
  if (filters.favOnly && !favorites.has(g.id)) return false;
  if (filters.cats.length && !filters.cats.includes(g.category)) return false;
  if (filters.activity && g.activity !== filters.activity) return false;
  if (filters.gender && g.gender !== filters.gender) return false;
  if (filters.q) {
    const needles = filters.q.toLowerCase().split(/\s+/).filter(Boolean);
    if (!needles.every((n) => g.haystack.includes(n))) return false;
  }
  return true;
};

const SORTS = {
  distance: (a, b) => a.km - b.km || a.g.title.localeCompare(b.g.title, "en"),
  "price-asc": (a, b) => a.minPrice - b.minPrice || a.km - b.km,
  "price-desc": (a, b) => b.maxPrice - a.maxPrice || a.km - b.km,
  date: (a, b) => a.from.localeCompare(b.from) || a.g.title.localeCompare(b.g.title, "en"),
  title: (a, b) => a.g.title.localeCompare(b.g.title, "en"),
  category: (a, b) => a.g.category.localeCompare(b.g.category, "en")
    || a.g.title.localeCompare(b.g.title, "en"),
  age: (a, b) => b.g.ageTo - a.g.ageTo || a.g.title.localeCompare(b.g.title, "en"),
};

const filters = restoreFilters();

// Sort order is not a filter, so it never counts towards the active badge.
const activeFilterCount = () =>
  Object.entries(DEFAULTS).filter(([key, fallback]) => {
    if (key === "sort") return false;
    const value = filters[key];
    return Array.isArray(fallback) ? value.length > 0 : value !== fallback;
  }).length;

const collect = () => {
  const hits = [];
  for (const g of DATA.groups) {
    if (!groupMatches(g)) continue;
    const slots = g.variants.filter(variantMatches);
    if (!slots.length) continue;
    hits.push({
      g,
      slots,
      km: Math.min(...slots.map((v) => v.km)),
      minPrice: Math.min(...slots.map((v) => v.price)),
      maxPrice: Math.max(...slots.map((v) => v.price)),
      from: slots.reduce((min, v) => (v.from < min ? v.from : min), slots[0].from),
    });
  }
  hits.sort(SORTS[filters.sort] ?? SORTS.distance);
  return hits;
};

// ------------------------------------------------------------- rendering

const venueCell = (v) => {
  const venue = VENUES.get(v.venue);
  const dir = `https://www.google.com/maps/dir/?api=1&origin=${DATA.home.lat},${DATA.home.lon}`
    + `&destination=${venue.lat},${venue.lon}`;
  return el("td", {},
    el("a", { href: dir, target: "_blank", rel: "noopener noreferrer", textContent: venue.name }),
    el("div", { className: "venue-sub", textContent: [venue.street, venue.city].filter(Boolean).join(", ") }),
  );
};

const richText = (html) => {
  const div = el("div", { className: "desc" });
  div.innerHTML = html;
  for (const a of div.querySelectorAll("a")) { a.target = "_blank"; a.rel = "noopener noreferrer"; }
  return div;
};

const plainText = (html) => html.replace(/<[^>]+>/g, " ").replace(/\s{2,}/g, " ").trim();

const noteLine = (caption, html) => el("p", { className: "note" },
  el("b", { textContent: `${caption}: ` }), plainText(html));

// A merged card can carry several provider blurbs. Entries that no visible
// date belongs to are dropped; what is left is shared across the card only if
// a single entry covers everything — otherwise it belongs on the date rows.
const visibleEntries = (list, slots) => {
  const kept = list.filter((e) => e.nrs.some((nr) => slots.some((v) => v.nr === nr)));
  return kept.length ? kept : list;
};

const splitDetails = (details, slots) => {
  const shared = {}, perRow = {};
  for (const field of ["texts", "bring", "notes"]) {
    const kept = visibleEntries(details[field], slots);
    if (kept.length <= 1) shared[field] = kept[0]?.value ?? "";
    else perRow[field] = kept;
  }
  return { shared, perRow };
};

const rowDetail = (perRow, nr) => {
  const pick = (field) => perRow[field]?.find((e) => e.nrs.includes(nr))?.value ?? "";
  const [text, bring, notes] = ["texts", "bring", "notes"].map(pick);
  if (!text && !bring && !notes) return null;
  return el("div", { className: "row-detail" },
    text ? richText(text) : null,
    bring ? noteLine("Bring", bring) : null,
    notes ? noteLine("Note", notes) : null,
  );
};

const slotTable = (slots, group, perRow) => {
  const expandable = Object.keys(perRow).length > 0;
  const columns = ["No.", "Week", "Dates", "Time", group.mixedAges ? "Born" : null,
    group.mixedLevels ? "Level" : null, "Venue", "Distance", "Price", "Registration", ""]
    .filter((h) => h !== null);
  const head = el("tr", {}, columns.map((h) => el("th", {
    textContent: h,
    className: ["Distance", "Price"].includes(h) ? "num" : "",
  })));

  const body = el("tbody", {});
  for (const v of slots) {
    const detail = expandable ? rowDetail(perRow, v.nr) : null;
    const isOpen = openSlots.has(v.id);
    const row = el("tr", { className: [detail ? "expandable" : "", v.bookable ? "" : "closed"].join(" ").trim() },
      el("td", {}, detail ? el("span", { className: "caret", textContent: isOpen ? "▾ " : "▸ " }) : null, v.nr),
      el("td", { textContent: DATA.weeks.find((w) => w.id === v.weekId)?.label ?? "" }),
      el("td", { textContent: v.dates }),
      el("td", { textContent: [v.days, v.time].filter(Boolean).join(", ") }),
      group.mixedAges ? el("td", { textContent: v.age }) : null,
      group.mixedLevels ? el("td", { textContent: v.level || "—" }) : null,
      venueCell(v),
      el("td", { className: "num", textContent: km(v.km) }),
      el("td", { className: "num", textContent: money(v.price) }),
      el("td", {},
        el("div", { textContent: v.status }),
        v.deadline ? el("div", { className: "venue-sub", textContent: `Deadline ${day(v.deadline)}` }) : null,
        v.free ? null : el("div", { className: "venue-sub", textContent: "no places left" }),
      ),
      el("td", {}, el("a", {
        href: BOOKING(v.id), target: "_blank", rel: "noopener noreferrer", textContent: "Details ↗",
      })),
    );
    if (detail) {
      row.onclick = (e) => {
        if (e.target.closest("a")) return;
        if (openSlots.has(v.id)) openSlots.delete(v.id); else openSlots.add(v.id);
        render();
      };
    }
    body.append(row);
    if (detail && isOpen) {
      body.append(el("tr", { className: "detail-row" },
        el("td", { colSpan: columns.length }, detail)));
    }
  }
  return el("table", { className: "slots" }, el("thead", {}, head), body);
};

const describe = (shared) => [
  shared.texts ? richText(shared.texts) : null,
  shared.bring ? noteLine("Bring", shared.bring) : null,
  shared.notes ? noteLine("Note", shared.notes) : null,
].filter(Boolean);

const card = (hit) => {
  const { g, slots } = hit;
  const isFav = favorites.has(g.id);
  const open = expanded.has(g.id);

  const star = el("button", {
    className: "star", type: "button", textContent: isFav ? "★" : "☆",
    title: isFav ? "Remove from favourites" : "Save as favourite",
  });
  star.setAttribute("aria-pressed", String(isFav));
  star.onclick = (e) => {
    e.stopPropagation();
    if (isFav) favorites.delete(g.id); else favorites.add(g.id);
    persistFavorites();
    render();
  };

  const toggle = el("button", { type: "button", textContent: g.title });
  toggle.onclick = () => {
    if (expanded.has(g.id)) expanded.delete(g.id); else expanded.add(g.id);
    render();
  };

  const tags = [
    el("span", { className: "tag", textContent: g.category }),
    g.activity !== "—" && g.activity !== g.category
      ? el("span", { className: "tag plain", textContent: g.activity }) : null,
    el("span", { className: "tag plain", textContent: `Jg. ${g.ageLabel}` }),
    g.gender === "Mädchen" ? el("span", { className: "tag girls", textContent: "nur Mädchen" }) : null,
    g.level ? el("span", { className: "tag plain", textContent: g.level }) : null,
  ];

  const price = hit.minPrice === hit.maxPrice ? money(hit.minPrice)
    : `${money(hit.minPrice)}–${money(hit.maxPrice)}`;
  const hidden = g.variants.length - slots.length;

  const head = el("div", { className: "card-head" },
    star,
    el("div", {},
      el("h2", { className: "card-title" }, toggle),
      el("div", { className: "tags" }, tags),
    ),
    el("div", { className: "card-facts" },
      el("strong", { textContent: price }),
      el("div", { textContent: `${km(hit.km)} · ${plural(slots.length, "date", "dates")}` }),
      hidden > 0 ? el("div", { textContent: `${hidden} filtered out` }) : null,
    ),
  );
  // The title button handles its own click; anywhere else in the header toggles too.
  head.onclick = (e) => { if (!e.target.closest("button, a")) toggle.click(); };

  const { shared, perRow } = splitDetails(g.details, slots);
  const body = open ? el("div", { className: "card-body" },
    describe(shared),
    slotTable(slots, g, perRow),
  ) : null;

  return el("article", { className: `card${isFav ? " fav" : ""}` }, head, body);
};

const render = () => {
  const hits = collect();
  const slotTotal = hits.reduce((n, h) => n + h.slots.length, 0);
  $("count").textContent = `${plural(hits.length, "course", "courses")} · ${plural(slotTotal, "date", "dates")}`;
  $("fav-count").textContent = String(favorites.size);
  const active = activeFilterCount();
  $("active-count").textContent = active ? String(active) : "";
  $("expand-all").textContent = hits.length && hits.every((h) => expanded.has(h.g.id))
    ? "Collapse dates" : "Show all dates";

  const out = $("results");
  out.replaceChildren();
  if (!hits.length) {
    // Never a bare blank page: say what is filtering everything out and offer
    // the way back, so restored state can't look like a broken app.
    const clear = el("button", { className: "ghost", type: "button", textContent: "Clear all filters" });
    clear.onclick = () => $("reset").click();
    out.append(el("div", { className: "empty" },
      el("p", { textContent: "No courses match these filters." }),
      active ? el("p", { className: "empty-detail", textContent: `${plural(active, "filter is", "filters are")} active.` }) : null,
      clear,
    ));
    return;
  }
  const frag = document.createDocumentFragment();
  for (const hit of hits) frag.append(card(hit));
  out.append(frag);
};

// ------------------------------------------------------------- wiring

const commit = () => {
  save(FILTER_KEY, { v: FILTER_SCHEMA, filters });
  syncLabels();
  render();
};

const syncLabels = () => {
  $("o-km").textContent = filters.km >= KM_ANY ? "any" : `≤ ${km(+filters.km)}`;
  $("o-price").textContent = filters.price >= PRICE_ANY ? "any" : `≤ ${money(+filters.price)}`;
};

const chipGroup = (host, entries, selected, onToggle) => {
  host.replaceChildren();
  for (const [value, label, count] of entries) {
    const chip = el("button", { className: "chip", type: "button" },
      label, el("span", { className: "n", textContent: String(count) }));
    chip.setAttribute("aria-pressed", String(selected.includes(value)));
    chip.onclick = () => onToggle(value);
    host.append(chip);
  }
};

const fillSelect = (node, options, value) => {
  node.replaceChildren(...options.map(([v, label]) => el("option", { value: v, textContent: label })));
  node.value = value;
};

const renderChips = () => {
  chipGroup($("f-weeks"), DATA.weeks.map((w) => [w.id, w.label, weekCounts.get(w.id) ?? 0]),
    filters.weeks, (v) => {
      filters.weeks = filters.weeks.includes(v) ? filters.weeks.filter((x) => x !== v) : [...filters.weeks, v];
      renderChips(); commit();
    });
  chipGroup($("f-cats"), [...categoryCounts].sort((a, b) => b[1] - a[1]).map(([c, n]) => [c, c, n]),
    filters.cats, (v) => {
      filters.cats = filters.cats.includes(v) ? filters.cats.filter((x) => x !== v) : [...filters.cats, v];
      renderChips(); commit();
    });
};

// Options never change, so they are built once; values are re-synced whenever
// the filter object is replaced wholesale (reset).
const buildControls = () => {
  fillSelect($("f-activity"),
    [["", "all"], ...[...activityCounts].sort((a, b) => a[0].localeCompare(b[0], "en"))
      .map(([a, n]) => [a, `${a} (${n})`])], filters.activity);
  fillSelect($("f-level"), [["", "all"], ...levels.map((l) => [l, l])], filters.level);
  fillSelect($("f-start"), [["", "any"], ...startTimes.map((t) => [t, `from ${clock(t)}`])], filters.start);
  fillSelect($("f-end"), [["", "any"], ...endTimes.map((t) => [t, `until ${clock(t)}`])], filters.end);
  $("years").replaceChildren(...years.map((y) => el("option", { value: String(y) })));

  const bind = (id, key, read = (n) => n.value, event = "input") =>
    $(id).addEventListener(event, (e) => { filters[key] = read(e.target); commit(); });

  bind("f-q", "q");
  bind("f-activity", "activity", (n) => n.value, "change");
  bind("f-level", "level", (n) => n.value, "change");
  bind("f-gender", "gender", (n) => n.value, "change");
  bind("f-start", "start", (n) => n.value, "change");
  bind("f-end", "end", (n) => n.value, "change");
  bind("f-sort", "sort", (n) => n.value, "change");
  bind("f-year", "year");
  bind("f-km", "km", (n) => +n.value);
  bind("f-price", "price", (n) => +n.value);
  bind("f-fav", "favOnly", (n) => n.checked, "change");
  bind("f-bookable", "bookable", (n) => n.checked, "change");

  $("reset").onclick = () => {
    Object.assign(filters, structuredClone(DEFAULTS));
    expanded.clear();
    syncControls();
    commit();
  };

  $("expand-all").onclick = () => {
    const hits = collect();
    const allOpen = hits.every((h) => expanded.has(h.g.id));
    expanded.clear();
    if (!allOpen) for (const h of hits) expanded.add(h.g.id);
    render();
  };
};

const syncControls = () => {
  renderChips();
  for (const [id, key] of [["f-q", "q"], ["f-activity", "activity"], ["f-level", "level"],
    ["f-gender", "gender"], ["f-start", "start"], ["f-end", "end"], ["f-sort", "sort"],
    ["f-year", "year"], ["f-km", "km"], ["f-price", "price"]]) {
    $(id).value = filters[key];
  }
  $("f-fav").checked = filters.favOnly;
  $("f-bookable").checked = filters.bookable;
  syncLabels();
};

$("home-label").textContent = DATA.home.label;
buildControls();
syncControls();
commit();
</script>
</body>
</html>
